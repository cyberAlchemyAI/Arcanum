    scope_id: CTX-BODY-WAR-ARCH-AUDIT
    decision_type: blocker
    question: Which TypeScript architecture/import boundary will Body War use to consume DomainSpec methods?
    description: Closed architecture/import-boundary decision that unblocks MVP work-pack planning while keeping DomainSpec method ownership outside Body War.
    options:
      - body-war-own-typescript-workspace-with-domainspec-path-alias
      - shared-domainspec-method-package
      - documentation-only-reference-until-export-exists
    selected: body-war-own-typescript-workspace-with-domainspec-path-alias
    rationale: User selected option 1. This unblocks MVP planning fastest while preserving DomainSpec as method authority through explicit TypeScript path aliases or source references.
    evidence: projects/body-war/docs/decisions/architecture-import-boundary.md
    status: closed
    blocking: false
    impact: MVP implementation can proceed in a Body War-owned TypeScript workspace; shared DomainSpec package extraction remains future hardening.
    owner: Body War architecture
    links:
