    notes: Root context. Feature is designed-not-built; L0 fixture-only.
  - context_id: CTX-GQ-IMPL-ARCH
    parent_id: CTX-GQ-PROMO-GOV
    title: Implementation-architecture discovery (victor pattern)
    purpose: Derive the current implementation architecture and model from spec and explain it to the team in the four-view victor discovery pattern.
    stage: validate
    gate: pass
    next_move: Recomposed into root; optional follow-up — link the impl-architecture pack from the feature SPEC.md so the team finds it.
    owned_artifacts:
      - ART-IMPL-PACK
      - ART-DERIVATION
      - ART-DRIFT
      - ART-DISPATCH
    notes: Produced via dispatch gq-impl-arch-discovery-2026-06-10; drift-checked and count-corrected.
