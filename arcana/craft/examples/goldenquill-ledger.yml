decisions:
  - decision_id: DEC-OQ4
    scope_id: CTX-GQ-PROMO-GOV
    decision_type: selection
    question: Should GoldenQuill keep three typed decision surfaces or collapse them into one unified enum?
    description: Blocking vocabulary decision for L1 candidate shape and promotion-authority semantics.
    selected: PENDING — operator weighing three decision surfaces vs single unified enum.
    rationale: Proposed resolution is three typed surfaces (PursuitDecision / MatchFitVerdict / OwnerDecision) with OwnerDecision the sole promotion vocabulary; operator answered "let me think" on the shape.
    evidence: docs/features/goldenquill-promotion-governance/integration/OPEN-QUESTIONS-LEDGER.md
    status: active
    blocking: true
    impact: Blocks L1 candidate shape and keeps BLK-OQ4-VOCAB active until the vocabulary model is locked.
    owner: governance
    links:
      - label: open questions ledger
        target: ART-OQ-LEDGER
        kind: artifact-id
      - label: vocabulary blocker
        target: BLK-OQ4-VOCAB
        kind: row-id
  - decision_id: DEC-PACK-LOCATION
    scope_id: CTX-GQ-IMPL-ARCH
    decision_type: selection
    question: Where should the implementation-architecture discovery pack live?
    description: Closed packaging decision for the victor-pattern implementation architecture discovery.
    selected: Impl-architecture pack lands under docs/features/goldenquill-promotion-governance/discovery/impl-architecture/.
    rationale: Scopes the explanation to the feature, mirrors the victor four-file pattern.
    evidence: ART-IMPL-PACK
    status: closed
    blocking: false
    impact: Keeps the pack near feature docs and makes the discovery path stable for future links.
    owner: architecture
    links:
      - label: implementation pack
        target: ART-IMPL-PACK
        kind: artifact-id
  - decision_id: DEC-D2-FLIP
    scope_id: CTX-GQ-ARCH-DESIGN
    decision_type: selection
    question: How should GoldenQuill authorize the L0 to L1 mutation_allowed flip?
    description: Proposed team decision for per-org promotion activation.
    selected: "PROPOSED: operator-signed per-org Ed25519 flip of mutation_allowed (false->true), journaled; shared-card mutation stays separately gated."
    rationale: Matches existing white-glove Ed25519 discipline; keeps operator in loop; scopes per-org for Law 3.
    evidence: ART-ARCH-DESIGN (D2)
    status: active
    blocking: false
    impact: If accepted, L0 to L1 activation becomes an operator-signed per-org event rather than an implicit runtime transition.
    owner: governance
    links:
      - label: architecture design D2
        target: ART-ARCH-DESIGN
        kind: artifact-id
      - label: L0/L1 flip gap
        target: GAP-L0L1-FLIP
        kind: row-id
  - decision_id: DEC-D3-SHARED-GATE
    scope_id: CTX-GQ-ARCH-DESIGN
    decision_type: selection
    question: What gate keeps shared cards general and prevents metric hill-climbing?
    description: Proposed structural shared-card gate for promotion authority policy hardening.
    selected: "PROPOSED: structural 'general' rule (generalized + >=K orgs + >=2 CICs, no metric hill-climb) + operator Ed25519 card-edit review; requires consent_tier=composable_with_others."
    rationale: D5a says shared cards are guardposts, not hill-climbed; boundary should be structural not a score.
    evidence: ART-ARCH-DESIGN (D3); links BLK-D5A-THRESHOLD
    status: active
    blocking: false
    impact: If accepted, BLK-D5A-THRESHOLD can close through a machine-checkable PromotionAuthorityPolicy boundary.
    owner: governance
    links:
      - label: architecture design D3
        target: ART-ARCH-DESIGN
        kind: artifact-id
      - label: threshold blocker
        target: BLK-D5A-THRESHOLD
        kind: row-id
  - decision_id: DEC-D4-VERIFY
    scope_id: CTX-GQ-ARCH-DESIGN
    decision_type: selection
    question: How should GoldenQuill verify an improvement without overfitting to one funder or metric?
    description: Proposed descriptive-statistics verification rule for promotion candidates.
    selected: "PROPOSED: diverse held-out set (>=2 CIC/CLC); reject on negative primary-KPI delta or any guardrail-KPI significant decrease; descriptive stats only (numpy/scipy)."
    rationale: Stays within L0/L1 descriptive analytics per D-E; prevents single-funder overfit (RK-006).
    evidence: ART-ARCH-DESIGN (D4)
    status: active
    blocking: false
    impact: If accepted, promotion candidates get an evidence rule without turning evaluation into metric optimization.
    owner: validator
    links:
      - label: architecture design D4
        target: ART-ARCH-DESIGN
        kind: artifact-id
  - decision_id: DEC-USE-CRAFT
    scope_id: CTX-GQ-PROMO-GOV
    decision_type: selection
    question: Should this promotion-governance work be tracked in a scoped Craft ledger?
    description: Closed decision to use Craft as the recursive state surface for this feature.
    selected: Record this work in a goldenquill-scoped Craft ledger (.craft/ledger.yml).
    rationale: Craft is the right surface for recursive blockers/decisions/gaps/definitions state; operator asked to use it.
    evidence: ../../arcanum/arcana/craft/SKILL.md
    status: closed
    blocking: false
    impact: Establishes this `.craft/ledger.yml` as the feature-local state authority and `CRAFT.md` as its human view.
    owner: governance
    links:
      - label: canonical Craft sigil
        target: ../../arcanum/arcana/craft/SKILL.md
        kind: path

