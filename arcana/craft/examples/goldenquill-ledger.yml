    scope_id: CTX-GQ-PROMO-GOV
    term: promotion authority (owner-decision-sole-approval)
    statement: OwnerDecision is the only place approved_allowed_uses may be set; adapters, journal, KPIs, analytics, candidates, and the vault projection cannot self-promote.
    status: candidate
    evidence: SPEC.md:89; domain.md:216
