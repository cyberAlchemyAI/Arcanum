schema_id: craft.ledger_core
schema_version: 0.3.0
status: canonical-first
owner_context_id: CTX-LEDGER
purpose: >
  Define Craft source-ledger metadata, row families, row identity, references,
  links, lifecycle enums, and source-ledger validation rules. This schema owns
  `.craft/ledger.yml` source rows only; generated indexes, human views,
  projections, route exchange, and row-update plans have separate schemas.

compatibility_entrypoint: ../ledger.schema.yml
source_of_truth_policy:
  ledger: .craft/ledger.yml
  human_view: CRAFT.md
  generated_index: .craft/index.json
  rule: Source ledger rows own Craft state. Human views and generated indexes are derived.

row_identity_policy:
  stable_id_required: true
  exception_families:
    recomposition:
      identity: composite
      fields:
        - child_id
        - parent_id
      reason: Current examples use child and parent context IDs as the stable recomposition identity.

linking_contract:
  row_link_shape:
    label: string
    target: string
    kind: row-id|artifact-id|path|section|external
  path_policy: Paths are relative to the Craft scope unless marked [repo-root] or absolute.
  evidence_policy: Evidence may be an artifact ID, receipt ID, path, selector, or link object.

enums:
  context_stage:
    - idea
    - define
    - design
    - plan
    - execute
    - validate
    - review-audit
    - reflect
    - blocked
    - closed
  gate_status:
    - pass
    - flag
    - block
  artifact_status:
    - planned
    - active
    - pass
    - flag
    - block
    - blocked
    - resolved
    - stale
    - superseded
    - closed
  relation_type:
    - contains
    - blocks
    - enables
    - depends_on
    - informs
    - supersedes
  relation_status:
    - active
    - proposed
    - resolved
    - rejected
    - superseded
  typed_item_kind:
    - blocker
    - gate
    - enabler
  typed_item_status:
    - active
    - proposed
    - pass
    - flag
    - block
    - resolution_proposed
    - resolved
    - rejected
    - waived
  refinement_status:
    - raw
    - typed
    - refined
    - resolution_proposed
    - resolved
    - waived
  decision_type:
    - blocker
    - selection
    - waiver
    - deferral
    - approval
    - rejection
  decision_status:
    - active
    - superseded
    - closed
  operational_lane:
    - architecture
    - business
    - tech
    - product
    - qa
    - validator
    - auditor
    - governance
    - planner
    - operations
    - integrator
    - blocker_refiner
  definition_status:
    - candidate
    - active-local
    - superseded
    - promoted-by-owner
  gap_status:
    - active
    - planned
    - resolved
    - waived
    - superseded
  gap_severity:
    - info
    - flag
    - block
    - deferred
  gap_treatment:
    - plan
    - defer
    - waive
    - delegate
    - split
  description_status:
    - active
    - superseded

base_condition_types:
  blocker:
    - architecture_blocker
    - decision_blocker
    - definition_blocker
    - design_blocker
    - dependency_blocker
    - evidence_blocker
    - artifact_blocker
    - governance_blocker
    - validator_blocker
    - vocabulary_blocker
    - validation_blocker
    - authority_blocker
    - resource_blocker
    - sequence_blocker
    - recomposition_blocker
  gate:
    - definition_gate
    - design_gate
    - plan_gate
    - artifact_gate
    - validation_gate
    - authority_gate
    - blocker_refinement_gate
    - recomposition_gate
    - risk_gate
    - readiness_gate
  enabler:
    - definition_enabler
    - design_enabler
    - dependency_enabler
    - knowledge_enabler
    - route_enabler
    - route_shape_enabler
    - artifact_enabler
    - validation_enabler
    - authority_enabler
    - resource_enabler
    - sequence_enabler
    - recomposition_enabler

row_families:
  contexts:
    id_field: context_id
    description: Recursive project-like units.
    required_fields:
      - context_id
      - parent_id
      - title
      - purpose
      - stage
      - gate
      - next_move
    optional_fields:
      - owned_artifacts
      - links
      - notes
    fields:
      context_id:
        type: string
        pattern: "^CTX-[A-Z0-9-]+$"
      parent_id:
        type: reference
        references: contexts.context_id
        allow_literal:
          - root
      title:
        type: string
      purpose:
        type: string
      stage:
        type: enum
        enum_ref: context_stage
      gate:
        type: enum
        enum_ref: gate_status
      next_move:
        type: string
      owned_artifacts:
        type: list
        item_type: reference
        references: artifacts.artifact_id
      links:
        type: list
        item_type: link
      notes:
        type: string

  artifacts:
    id_field: artifact_id
    description: Files, records, work-packs, validations, and handoffs owned by contexts.
    required_fields:
      - artifact_id
      - owner_context_id
      - path
      - artifact_type
      - status
    optional_fields:
      - links
      - notes
    fields:
      artifact_id:
        type: string
        pattern: "^ART-[A-Z0-9-]+$"
      owner_context_id:
        type: reference
        references: contexts.context_id
      path:
        type: string
      artifact_type:
        type: string
      status:
        type: enum
        enum_ref: artifact_status
      notes:
        type: string
      links:
        type: list
        item_type: link

  descriptions:
    id_field: description_id
    description: Versioned working descriptions for Craft contexts.
    required_fields:
      - description_id
      - context_id
      - description
      - status
    optional_fields:
      - evidence
      - links
    fields:
      description_id:
        type: string
        pattern: "^DESC-[A-Z0-9-]+$"
      context_id:
        type: reference
        references: contexts.context_id
      description:
        type: string
      status:
        type: enum
        enum_ref: description_status
      evidence:
        type: string
      links:
        type: list
        item_type: link

  definitions:
    id_field: definition_id
    description: Local candidate definitions scoped to a Craft context or artifact.
    required_fields:
      - definition_id
      - scope_id
      - term
      - statement
      - status
      - evidence
    optional_fields:
      - links
    fields:
      definition_id:
        type: string
        pattern: "^DEF-[A-Z0-9-]+$"
      scope_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
      term:
        type: string
      statement:
        type: string
      status:
        type: enum
        enum_ref: definition_status
      evidence:
        type: string
      links:
        type: list
        item_type: link

  gaps:
    id_field: gap_id
    description: Missing, deferred, weak, or unresolved areas that remain visible in Craft.
    required_fields:
      - gap_id
      - scope_id
      - summary
      - severity
      - treatment
      - owner
      - status
      - evidence
    optional_fields:
      - links
    fields:
      gap_id:
        type: string
        pattern: "^GAP-[A-Z0-9-]+$"
      scope_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
          - typed_items.item_id
          - decisions.decision_id
      summary:
        type: string
      severity:
        type: enum
        enum_ref: gap_severity
      treatment:
        type: enum
        enum_ref: gap_treatment
      owner:
        type: string
      status:
        type: enum
        enum_ref: gap_status
      evidence:
        type: string
      links:
        type: list
        item_type: link

  relations:
    id_field: relation_id
    description: Links between contexts, artifacts, decisions, typed items, and source-ledger rows.
    required_fields:
      - relation_id
      - source_id
      - target_id
      - type
      - status
      - reason
    optional_fields:
      - evidence
      - links
    fields:
      relation_id:
        type: string
        pattern: "^REL-[A-Z0-9-]+$"
      source_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
          - descriptions.description_id
          - definitions.definition_id
          - gaps.gap_id
          - typed_items.item_id
          - decisions.decision_id
        references_deferred_any:
          - route_handoffs.handoff_id
          - receipts.receipt_id
      target_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
          - descriptions.description_id
          - definitions.definition_id
          - gaps.gap_id
          - typed_items.item_id
          - decisions.decision_id
        references_deferred_any:
          - route_handoffs.handoff_id
          - receipts.receipt_id
      type:
        type: enum
        enum_ref: relation_type
      status:
        type: enum
        enum_ref: relation_status
      reason:
        type: string
      evidence:
        type: string
      links:
        type: list
        item_type: link

  typed_items:
    id_field: item_id
    description: Unified blocker, gate, and enabler rows.
    required_fields:
      - item_id
      - kind
      - base_type
      - primary_lane
      - source_id
      - target_id
      - status
      - reason
    conditionally_required_fields:
      - when:
          kind: blocker
        require:
          - refinement_status
          - closure_condition
      - when:
          kind: gate
        require:
          - closure_condition
    optional_fields:
      - context_type
      - secondary_lanes
      - refinement_status
      - default_role
      - delegation_route
      - closure_condition
      - evidence
      - decision_ref
      - links
    fields:
      item_id:
        type: string
        pattern: "^(BLK|GATE|ENA)-[A-Z0-9-]+$"
      kind:
        type: enum
        enum_ref: typed_item_kind
      base_type:
        type: enum_by_kind
        enum_map_ref: base_condition_types
      context_type:
        type: string
        nullable: true
      primary_lane:
        type: enum
        enum_ref: operational_lane
      secondary_lanes:
        type: list
        item_type: enum
        enum_ref: operational_lane
      source_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
          - descriptions.description_id
          - definitions.definition_id
          - gaps.gap_id
          - typed_items.item_id
          - decisions.decision_id
      target_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
          - descriptions.description_id
          - definitions.definition_id
          - gaps.gap_id
          - typed_items.item_id
          - decisions.decision_id
      status:
        type: enum
        enum_ref: typed_item_status
      refinement_status:
        type: enum
        enum_ref: refinement_status
      default_role:
        type: string
      delegation_route:
        type: string
      closure_condition:
        type: string
      evidence:
        type: string
      decision_ref:
        type: reference
        references: decisions.decision_id
        allow_literal:
          - none
      links:
        type: list
        item_type: link
      reason:
        type: string

  decisions:
    id_field: decision_id
    description: Explicit human or governance decisions with enough detail to navigate and audit later.
    required_fields:
      - decision_id
      - scope_id
      - decision_type
      - question
      - selected
      - rationale
      - status
    optional_fields:
      - description
      - options
      - default_option
      - evidence
      - blocking
      - impact
      - owner
      - links
    fields:
      decision_id:
        type: string
        pattern: "^DEC-[A-Z0-9-]+$"
      scope_id:
        type: reference
        references_any:
          - contexts.context_id
          - artifacts.artifact_id
          - descriptions.description_id
          - definitions.definition_id
          - gaps.gap_id
          - relations.relation_id
          - typed_items.item_id
      decision_type:
        type: enum
        enum_ref: decision_type
      question:
        type: string
      description:
        type: string
      options:
        type: list
        item_type: string
      default_option:
        type: string
      selected:
        type: string
      rationale:
        type: string
      evidence:
        type: string
      status:
        type: enum
        enum_ref: decision_status
      blocking:
        type: boolean
      impact:
        type: string
      owner:
        type: string
      links:
        type: list
        item_type: link

  recomposition:
    identity: composite
    composite_id_fields:
      - child_id
      - parent_id
    description: Evidence that a child context has been recomposed into a parent context.
    required_fields:
      - child_id
      - parent_id
      - summary
      - evidence
      - residue
      - next_parent_move
      - status
    optional_fields:
      - links
    fields:
      child_id:
        type: reference
        references: contexts.context_id
      parent_id:
        type: reference
        references: contexts.context_id
      summary:
        type: string
      evidence:
        type: string
      residue:
        type: string
      next_parent_move:
        type: string
      status:
        type: enum
        enum_ref: gate_status
      links:
        type: list
        item_type: link

validation_rules:
  - id: VAL-001
    description: Every context has a unique context_id.
    severity: block
  - id: VAL-002
    description: Every non-root context references an existing parent_id.
    severity: block
  - id: VAL-003
    description: Every artifact references an existing owner_context_id.
    severity: block
  - id: VAL-004
    description: Every relation source and target references an existing source-ledger ID.
    severity: block
  - id: VAL-005
    description: Every typed item includes kind, base_type, primary_lane, source_id, target_id, status, and reason.
    severity: block
  - id: VAL-006
    description: Every blocker includes refinement_status and closure_condition.
    severity: block
  - id: VAL-007
    description: A blocker with status resolved has refinement evidence or a linked waiver decision.
    severity: block
  - id: VAL-008
    description: Every gate includes a closure_condition.
    severity: block
  - id: VAL-009
    description: Every enabler includes evidence or a reason explaining what it enables.
    severity: flag
  - id: VAL-010
    description: Work-pack artifacts are artifacts, not the ledger root.
    severity: block
  - id: VAL-011
    description: Every decision includes a question plus enough description, rationale, evidence, and impact to understand the decision without the original conversation.
    severity: block
  - id: VAL-012
    description: Row references resolve to known row IDs or explicit path/external links.
    severity: block
  - id: VAL-013
    description: Human views render current decisions, blockers, gaps, next moves, and artifacts with navigable links or anchors.
    severity: flag
  - id: VAL-014
    description: Ledgers include indexes for by_id, open_decisions, blocking_decisions, active_blockers, active_gaps, next_moves, and artifacts_by_path.
    severity: flag
  - id: VAL-015
    description: Every description references an existing context and keeps active or superseded status.
    severity: block
  - id: VAL-016
    description: Every definition remains local-candidate unless promoted by an owner route.
    severity: block
  - id: VAL-017
    description: Every gap has severity, treatment, owner, status, evidence, and a known scope.
    severity: block
  - id: VAL-018
    description: Every recomposition row references an existing child context and parent context.
    severity: block
  - id: VAL-019
    description: A closed child context requires recomposition evidence before parent closure claims.
    severity: block
