artifact:
  artifact_id: xray.schema.lane-model
  artifact_type: schema
  intent: Candidate structural schema for x-ray lane model JSON artifacts.
  owner: x-ray
  lifecycle_status: candidate
  evidence_role: source
  canonical_format: schema.yml
  constitution_selectors:
    - framework.artifact-metadata
    - framework.schema
    - xray
  validation_profile:
    - yaml-parse
    - xray-lane-model
schema:
  id: xray-lane-model
  status: candidate
  target_artifact: "*.lanes.json"
  required_top_level:
    - xray_version
    - example_id
    - mode
    - target_boundary
    - renderer_level
    - layer_interaction
    - lanes
  allowed_modes:
    - object
    - artifact
    - architecture
    - codebase
    - process
    - mixed
  allowed_renderer_levels:
    - L0
  required_lanes:
    - surface
    - properties
    - components
    - internal_dependencies
    - external_dependencies
    - flow
    - lifecycle
    - risk_questions
    - visual_composition
  required_lane_fields:
    - handle
    - evidence
    - inference
  non_empty_evidence_except:
    - risk_questions
  lane_field_types:
    handle: string
    evidence: list
    inference: list
  notes:
    - This schema validates structure only.
    - It does not validate explanatory correctness, source truth, or promotion readiness.
    - Full result-envelope schema is deferred until multiple real x-ray outputs exist.
