    smallest_correction: Represent optional submission of a new version after requested changes, and omit renewed review unless evidence licenses that transition.
  - finding_id: F-003
    severity: major
    visual_claim: The author creates an initial draft and directly hands it to the reviewer.
    status: unsupported
    evidence: POL-12 sections 3 and 4 address reviewer choices and an author's optional new-version submission after changes; neither establishes the depicted initial creation-and-handoff transition.
    smallest_correction: Remove the initial author-creation and handoff claim, or supply evidence that directly supports it.
