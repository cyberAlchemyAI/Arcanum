$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://arcanum.local/evidence-grounded-diagrams/diagram-review-receipt.schema.yml"
title: Evidence-Grounded Diagram Review Receipt
type: object
additionalProperties: false
required:
  - contract_version
  - review_id
  - reviewed_at
  - reviewer
  - reader_question
  - target
  - evidence_boundary
  - verdict
  - findings
properties:
  contract_version:
    const: "1.0.0"
  review_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  reviewed_at:
    type: string
    format: date-time
  reviewer:
    type: string
    minLength: 1
  reader_question:
    type: string
    minLength: 1
  target:
    oneOf:
      - $ref: "#/$defs/bundleTarget"
      - $ref: "#/$defs/sourceTarget"
  evidence_boundary:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [source_id, locators]
      properties:
        source_id:
          type: string
          minLength: 1
        locators:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
  verdict:
    enum: [PASS, FIX, INSUFFICIENT_EVIDENCE]
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [finding_id, severity, visual_claim, status, evidence, smallest_correction]
      properties:
        finding_id:
          type: string
          pattern: "^F-[0-9]{3}$"
        severity:
          enum: [blocker, major, minor]
        visual_claim:
          type: string
          minLength: 1
        status:
          enum: [supported, unsupported, ambiguous, inferred, hypothetical, unknown]
        evidence:
          type: string
          minLength: 1
        smallest_correction:
          type: string
          minLength: 1
  first_blocker:
    description: First material blocker in findings order; omit or set null when no material blocker exists.
    oneOf:
      - type: "null"
      - type: string
        pattern: "^F-[0-9]{3}$"
allOf:
  - if:
      properties:
        verdict:
          enum: [PASS, INSUFFICIENT_EVIDENCE]
      required: [verdict]
    then:
      properties:
        first_blocker:
          type: "null"
  - if:
      properties:
        verdict:
          const: FIX
      required: [verdict]
    then:
      properties:
        findings:
          minItems: 1
          contains:
            type: object
            required: [severity, status]
            properties:
              severity:
                enum: [blocker, major]
              status:
                enum: [unsupported, ambiguous, inferred, hypothetical, unknown]
          minContains: 1
$defs:
  observedMember:
    type: object
    additionalProperties: false
    required: [role, path, sha256]
    properties:
      role:
        enum: [request, source, render, manifest, semantic-model, textual-equivalent, validation-receipt]
      path:
        type: [string, "null"]
      sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"
  bundleTarget:
    type: object
    additionalProperties: false
    required: [kind, diagram_id, revision, bundle_path, normalization, observed_members, render_inspected]
    properties:
      kind:
        const: bundle
      diagram_id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
      revision:
        type: string
        pattern: "^r[0-9]{4}$"
      bundle_path:
        type: string
        minLength: 1
      normalization:
        type: string
        minLength: 1
      observed_members:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/observedMember"
      render_inspected:
        type: boolean
  sourceTarget:
    type: object
    additionalProperties: false
    required: [kind, normalization, observed_members, render_inspected]
    properties:
      kind:
        const: source
      normalization:
        const: UTF-8, LF line endings, no trailing newline
      observed_members:
        type: array
        minItems: 1
        maxItems: 1
        uniqueItems: true
        items:
          allOf:
            - $ref: "#/$defs/observedMember"
            - properties:
                role:
                  const: source
      render_inspected:
        const: false
