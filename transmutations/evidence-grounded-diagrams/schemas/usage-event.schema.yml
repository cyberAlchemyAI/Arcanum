$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://arcanum.local/evidence-grounded-diagrams/usage-event.schema.yml"
title: Evidence-Grounded Diagrams Usage Event
type: object
additionalProperties: false
required:
  - timestamp
  - sigil
  - tier
  - mode
  - meaningful_execution
  - outcome
  - diagram_id
  - revision
  - generated_output_count
  - quality_bar_status
  - anti_pattern_hits
  - workflow_gaps
  - output_contract_drift
  - user_correction
  - observer_recommendation
  - reflection_trigger
properties:
  timestamp:
    type: string
    format: date-time
  sigil:
    const: evidence-grounded-diagrams
  tier:
    const: transmutations
  mode:
    enum: [create, review, revise]
  meaningful_execution:
    type: boolean
  outcome:
    enum: [diagram, no-diagram, needs-evidence, review-result, render-blocked, persistence-blocked]
  diagram_id:
    oneOf:
      - type: "null"
      - type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
  revision:
    oneOf:
      - type: "null"
      - type: string
        pattern: "^r[0-9]{4}$"
  generated_output_count:
    type: integer
    minimum: 0
  quality_bar_status:
    enum: [pass, partial, fail, not-applicable]
  anti_pattern_hits:
    type: array
    items:
      type: string
      minLength: 1
  workflow_gaps:
    type: array
    items:
      type: string
      minLength: 1
  output_contract_drift:
    type: boolean
  user_correction:
    type: boolean
  observer_recommendation:
    enum: [none, observe-more, reflect-now, severe-gap]
  reflection_trigger:
    enum: [none, manual, usage-threshold, output-threshold, gap-threshold, severe-gap]
