$schema: https://json-schema.org/draft/2020-12/schema
$id: https://arcanum.dev/framework/governance-flow/schemas/governance-flow-source-v1.schema.yml
title: Governance Flow Machine Source v1
type: object
additionalProperties: false
required:
  - schema_version
  - flow_id
  - owner
  - targets
  - authority
  - risk
  - executable
  - independent_review
  - consumers
  - protected_inputs
  - request_budget
  - terminal_outcome
  - retry_policy
  - sidecar_resume
  - metrics
properties:
  schema_version:
    const: arcanum.governance-flow.source.v1
  flow_id:
    $ref: '#/$defs/id'
  owner:
    type: object
    additionalProperties: false
    required: [owner_id, lifecycle_route]
    properties:
      owner_id: {$ref: '#/$defs/id'}
      lifecycle_route: {$ref: '#/$defs/id'}
  targets:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: '#/$defs/target'}
  authority:
    $ref: '#/$defs/authority'
  risk:
    type: object
    additionalProperties: false
    required: [class, reasons]
    properties:
      class: {enum: [low, medium, high, critical]}
      reasons:
        type: array
        items: {type: string, minLength: 1}
  executable:
    $ref: '#/$defs/executable'
  independent_review:
    type: object
    additionalProperties: false
    required: [required, reviewer_id, reviewer_role]
    properties:
      required: {const: true}
      reviewer_id: {$ref: '#/$defs/id'}
      reviewer_role: {type: string, minLength: 1}
  consumers:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: '#/$defs/consumer'}
  protected_inputs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: '#/$defs/path'}
  request_budget:
    const: 1
  terminal_outcome:
    $ref: '#/$defs/terminal'
  retry_policy:
    type: array
    minItems: 3
    maxItems: 3
    items: {$ref: '#/$defs/retry'}
  sidecar_resume:
    type: object
    additionalProperties: false
    required: [maximum_resumes, required_classification, independent_review_required, unchanged_fields]
    properties:
      maximum_resumes: {const: 1}
      required_classification: {const: mechanical_evidence_only}
      independent_review_required: {const: true}
      unchanged_fields:
        type: array
        minItems: 3
        uniqueItems: true
        items:
          enum: [decision_graph_digest, target_byte_digest, authority_bearing_executable_digest]
  metrics:
    type: array
    minItems: 5
    maxItems: 5
    items: {$ref: '#/$defs/metric'}
$defs:
  id:
    type: string
    pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
  hash:
    type: string
    pattern: '^[a-f0-9]{64}$'
  path:
    type: string
    minLength: 1
    pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$'
  target:
    type: object
    additionalProperties: false
    required: [path, baseline_sha256, postimage_sha256, visibility]
    properties:
      path: {$ref: '#/$defs/path'}
      baseline_sha256: {$ref: '#/$defs/hash'}
      postimage_sha256: {$ref: '#/$defs/hash'}
      visibility: {enum: [public, private]}
  authority:
    type: object
    additionalProperties: false
    required:
      - write_paths
      - execution
      - publication
      - git
      - deployment
      - credentials
      - destructive_actions
      - external_effects
      - successor_execution
      - selection_required
      - admission_required
    properties:
      write_paths:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/path'}
      execution: {type: boolean}
      publication: {type: boolean}
      git: {type: boolean}
      deployment: {type: boolean}
      credentials: {type: boolean}
      destructive_actions: {type: boolean}
      external_effects: {type: boolean}
      successor_execution: {type: boolean}
      selection_required: {const: true}
      admission_required: {const: true}
  executable:
    type: object
    additionalProperties: false
    required: [path, sha256, argv, mode, cwd, environment_allowlist]
    properties:
      path: {$ref: '#/$defs/path'}
      sha256: {$ref: '#/$defs/hash'}
      argv:
        type: array
        minItems: 1
        items: {type: string}
      mode: {enum: [python_script, executable]}
      cwd: {const: '{isolated_root}'}
      environment_allowlist:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}
  consumer:
    type: object
    additionalProperties: false
    required: [consumer_id, kind, depends_on]
    properties:
      consumer_id: {$ref: '#/$defs/id'}
      kind:
        enum: [source_schema, graph_schema, human_renderer, executable_identity, terminal_contract]
      depends_on:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
  terminal:
    type: object
    additionalProperties: false
    required:
      - promised_boundary_id
      - required_terminal_receipt_schema
      - required_effects
      - prohibited_effects
      - expected_postimages
      - completion_predicate
      - terminal_observer
    properties:
      promised_boundary_id: {$ref: '#/$defs/id'}
      required_terminal_receipt_schema: {type: string, minLength: 1}
      required_effects:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      prohibited_effects:
        type: array
        minItems: 2
        uniqueItems: true
        items: {type: string, minLength: 1}
      expected_postimages:
        type: object
        minProperties: 1
        additionalProperties: {$ref: '#/$defs/hash'}
      completion_predicate:
        const: exact_terminal_match
      terminal_observer:
        type: object
        additionalProperties: false
        required: [observer_id, sha256]
        properties:
          observer_id: {$ref: '#/$defs/id'}
          sha256: {$ref: '#/$defs/hash'}
  retry:
    type: object
    additionalProperties: false
    required: [classification, maximum_attempts, owner_prompt]
    properties:
      classification:
        enum: [environmental, mechanical_evidence_only, semantic_or_authority]
      maximum_attempts: {type: integer, minimum: 0, maximum: 10}
      owner_prompt: {enum: [none, new_graph_only]}
  metric:
    type: object
    additionalProperties: false
    required: [metric_id, event, target]
    properties:
      metric_id: {$ref: '#/$defs/id'}
      event: {type: string, pattern: '^governance_flow\.[a-z_]+\.v1$'}
      target: {type: integer, minimum: 0}
