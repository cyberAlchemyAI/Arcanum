$schema: https://json-schema.org/draft/2020-12/schema
$id: https://arcanum.dev/framework/governance-flow/schemas/governance-flow-graph-v1.schema.yml
title: Governance Flow Normalized Decision Graph v1
type: object
additionalProperties: false
required:
  - schema_version
  - flow_id
  - source_digest
  - decision_graph_digest
  - digest_algorithm
  - authority_effect
  - decision_envelope
  - derived_permissions
properties:
  schema_version: {const: arcanum.governance-flow.graph.v1}
  flow_id: {type: string, minLength: 1}
  source_digest: {$ref: '#/$defs/hash'}
  decision_graph_digest: {$ref: '#/$defs/hash'}
  digest_algorithm: {const: sha256-canonical-json-without-self-digest}
  authority_effect: {const: none}
  decision_envelope:
    type: object
    additionalProperties: false
    required:
      - owner
      - targets
      - authority
      - risk
      - executable
      - independent_review
      - consumers
      - protected_inputs
      - request_budget
      - terminal_outcome
      - retry_policy
      - sidecar_resume
      - metrics
    properties:
      owner: {type: object}
      targets: {type: array, minItems: 1}
      authority: {type: object}
      risk: {type: object}
      executable: {type: object}
      independent_review: {type: object}
      consumers: {type: array, minItems: 1}
      protected_inputs: {type: array, minItems: 1}
      request_budget: {const: 1}
      terminal_outcome: {type: object}
      retry_policy: {type: array, minItems: 3, maxItems: 3}
      sidecar_resume: {type: object}
      metrics: {type: array, minItems: 5, maxItems: 5}
  derived_permissions:
    $ref: '#/$defs/no_authority'
$defs:
  hash:
    type: string
    pattern: '^[a-f0-9]{64}$'
  no_authority:
    type: object
    additionalProperties: false
    required: [selection, admission, execution, publication, git, deployment, credentials, destructive_actions, external_effects, successor_execution]
    properties:
      selection: {const: false}
      admission: {const: false}
      execution: {const: false}
      publication: {const: false}
      git: {const: false}
      deployment: {const: false}
      credentials: {const: false}
      destructive_actions: {const: false}
      external_effects: {const: false}
      successor_execution: {const: false}
