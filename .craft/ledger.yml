  - artifact_id: ART-MANUAL-VALIDATION
    owner_context_id: CTX-ARCANUM-MANUAL-ROOT
    path: development/user-guide/ARCANUM-MANUAL.validation.md
    artifact_type: validation-evidence
    status: pass
    notes: Claim-to-source map for the manual (step s05); verdict pass. Evidence only, no promotion.

descriptions:
  - description_id: DESC-ARCANUM-MANUAL-001
    context_id: CTX-ARCANUM-MANUAL-ROOT
    description: >
      The manual project turns the whole of Arcanum (framework, CyberAlchemy Method, disciplines,
      sigils, spells, observability) into a single reader-facing manual. The strategy is encoded as
      a validated dispatch route: x-ray maps the surface, inventory makes the corpus source-backed,
      distill groups it by reader leverage, whisper authors the prose modeled on the existing
      user-guide, and a validation pass confirms every claim resolves to an Arcanum source. Craft
      governs state and residue; dispatch-spec governs route shape; it does not execute the route.
    status: active
    evidence: .craft/artifacts/20260616-arcanum-manual-research-strategy.dispatch.json

definitions:
  - definition_id: DEF-ARCANUM-MANUAL-001
    scope_id: CTX-ARCANUM-MANUAL-ROOT
    term: Arcanum manual
    statement: >
      A leverage-oriented explanatory artifact that lets a reader understand what Arcanum is, what
      its processes are, and how each kind of user can use it, with every claim backed by an
      Arcanum source path. It is documentation, not a canonical surface, and does not hold authority
      over the sigils, spells, or definitions it explains.
    status: candidate
    evidence: README.md, framework/CYBERALCHEMY-METHOD.md, development/user-guide/README.md

gaps:
  - gap_id: GAP-AUDIENCE-TAXONOMY-001
    scope_id: CTX-ARCANUM-MANUAL-ROOT
    summary: >
      "How each user can leverage it" needs an explicit reader/persona taxonomy (e.g. capability
      author, capability consumer, reviewer/validator, repository maintainer, researcher) before the
      manual can guarantee per-audience coverage. The taxonomy is not yet enumerated.
    severity: flag
    treatment: plan
    owner: distill (step s03-distill-per-audience)
    status: resolved
    evidence: >
      Resolved by the distill step: a 7-persona taxonomy (newcomer, consumer/invoker, capability
      author, maintainer/installer, reviewer, researcher, cross-functional) was grounded in
      README Start-Here, FRIEND-INSTALL-TUTORIAL.md, the user-guide thesis, and registry use-when
      conditions. Inferred personas are labelled as such. See ART-MANUAL-DISTILL-NOTES and the
      manual's Part 3.
    links:
      - label: Resolved in distill notes
        target: ART-MANUAL-DISTILL-NOTES
        kind: artifact-id
      - label: Rendered in manual Part 3
        target: ART-ARCANUM-MANUAL
        kind: artifact-id
