contexts:
  - context_id: CTX-ARCANUM-MANUAL-ROOT
    parent_id: root
    title: Arcanum Manual — Research Strategy and Authoring
    purpose: >
      Build a leverage-oriented Arcanum manual that explains what Arcanum is, what its processes
      are, and how each kind of user can use it, by researching the full Arcanum knowledge surface
      and authoring through whisper. development/user-guide/ is the explanatory pattern base and
      the final home for the manual.
    stage: validate
    gate: pass
    next_move: >
      Operator review of development/user-guide/ARCANUM-MANUAL.md; optionally render an HTML/PDF
      companion and commit inside the arcanum submodule before bumping the parent gitlink.
    owned_artifacts:
      - ART-ARCANUM-MANUAL-LEDGER
      - ART-ARCANUM-MANUAL-VIEW
      - ART-MANUAL-RESEARCH-DISPATCH
      - ART-USER-GUIDE-BASE
      - ART-ARCANUM-MANUAL
      - ART-MANUAL-DISTILL-NOTES
      - ART-MANUAL-XRAY-HTML
      - ART-MANUAL-VALIDATION
    links:
      - label: Research-strategy dispatch
        target: ART-MANUAL-RESEARCH-DISPATCH
        kind: artifact-id
      - label: User-guide pattern base
        target: ART-USER-GUIDE-BASE
        kind: artifact-id
    notes: Root context created by /craft start for the Arcanum manual.

