descriptions:
  - description_id: DESC-ARCANUM-MANUAL-001
    context_id: CTX-ARCANUM-MANUAL-ROOT
    description: >
      The manual project turns the whole of Arcanum (framework, CyberAlchemy Method, disciplines,
      sigils, spells, observability) into a single reader-facing manual. The strategy is encoded as
      a validated dispatch route: x-ray maps the surface, inventory makes the corpus source-backed,
      distill groups it by reader leverage, whisper authors the prose modeled on the existing
      user-guide, and a validation pass confirms every claim resolves to an Arcanum source. Craft
      governs state and residue; dispatch-spec governs route shape; it does not execute the route.
    status: active
    evidence: .craft/artifacts/20260616-arcanum-manual-research-strategy.dispatch.json
  - description_id: DESC-ARCANUM-COMPOSITION-001
    context_id: CTX-ARCANUM-COMPOSITION-ANALYSIS
    description: >
      The composition analysis keeps the user's introduction intact while a governed research
      baseline determines what the repository can support about capability ownership, artifact
      handoffs, invocation, Task Session readiness, Craft-backed state, Decision Gate, write-back,
      evidence class, source authority, and improvement boundaries.
    status: active
    evidence: >
      ART-ARCANUM-COMPOSITION-INITIAL-DEFINITIONS and ART-ARCANUM-COMPOSITION-REVIEW
  - description_id: DESC-ARCANUM-COMPOSITION-002
    context_id: CTX-ARCANUM-COMPOSITION-ANALYSIS
    description: >
      Governed research now supports a plural, authority-bound and artifact-mediated model of
      Arcanum composition rather than one universal linear pipeline. The accepted findings preserve
      relation-specific evidence classes and leave generic Craft write-back coordination, generic
      write-back adaptation, same-concern source precedence, and product-authorized improvement
      classification unresolved for later work.
    status: active
    evidence: ART-ARCANUM-COMPOSITION-FINDINGS

  - description_id: DESC-SUBAGENT-STRATEGY-HARDENING-001
    context_id: CTX-SUBAGENT-STRATEGY-RUNTIME-HARDENING
    description: >
      Arcanum now treats the exact confirmed JSON as temporary authority and the append-only YAML
      dispatch/close pair as durable evidence. Native execution additionally binds a canonical
      projection digest and independently checks group-to-wave topology, while locking,
      content-based idempotency, path confinement, handoff validation, and semantic close rules
      protect the lifecycle across Windows and Linux-compatible code paths.
    status: active
    evidence: ART-SUBAGENT-STRATEGY-HARDENING-SESSION

