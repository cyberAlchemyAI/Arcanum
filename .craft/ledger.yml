contexts:
  - context_id: CTX-ARCANUM-MANUAL-ROOT
    parent_id: root
    title: Arcanum Manual — Research Strategy and Authoring
    purpose: >
      Build a leverage-oriented Arcanum manual that explains what Arcanum is, what its processes
      are, and how each kind of user can use it, by researching the full Arcanum knowledge surface
      and authoring through whisper. development/user-guide/ is the explanatory pattern base and
      the final home for the manual.
    stage: validate
    gate: pass
    next_move: >
      Operator review of development/user-guide/ARCANUM-MANUAL.md; optionally render an HTML/PDF
      companion and commit inside the arcanum submodule before bumping the parent gitlink.
    owned_artifacts:
      - ART-ARCANUM-MANUAL-LEDGER
      - ART-ARCANUM-MANUAL-VIEW
      - ART-MANUAL-RESEARCH-DISPATCH
      - ART-USER-GUIDE-BASE
      - ART-ARCANUM-MANUAL
      - ART-MANUAL-DISTILL-NOTES
      - ART-MANUAL-XRAY-HTML
      - ART-MANUAL-VALIDATION
    links:
      - label: Research-strategy dispatch
        target: ART-MANUAL-RESEARCH-DISPATCH
        kind: artifact-id
      - label: User-guide pattern base
        target: ART-USER-GUIDE-BASE
        kind: artifact-id
    notes: Root context created by /craft start for the Arcanum manual.
  - context_id: CTX-CRAFT-LEDGER-INTEGRITY
    parent_id: root
    title: Craft ledger-integrity research
    purpose: >
      Determine where Craft source rows, embedded indexes, generated indexes, human views, and
      called-capability results can diverge; establish Craft's responsibility boundary and the
      minimum integrity properties required for safe navigation and use.
    stage: plan
    gate: flag
    next_move: >
      Obtain explicit operator confirmation, execute the prepared internal/external governed
      research dispatch, and produce research.md plus findings.md before proposing any canonical
      Craft contract, validator, runtime, migration, or operator-discipline change.
    owned_artifacts:
      - ART-CRAFT-LEDGER-INTEGRITY-DISPATCH
      - ART-CRAFT-LEDGER-INTEGRITY-SESSION
    links:
      - label: Prepared governed research dispatch
        target: ART-CRAFT-LEDGER-INTEGRITY-DISPATCH
        kind: artifact-id
      - label: Closing session and evidence boundary
        target: ART-CRAFT-LEDGER-INTEGRITY-SESSION
        kind: artifact-id
    notes: >
      Opened by /craft at session close. Dispatch validation and independent tension checks passed,
      but no research agents were launched and no dispatch event or research findings exist.
  - context_id: CTX-ARCANUM-COMPOSITION-ANALYSIS
    parent_id: root
    title: Arcanum composition analysis
    purpose: >
      Explain the current relationships among Arcanum capabilities and artifacts faithfully, then
      identify evidence-backed improvement opportunities without presenting intended, inferred, or
      caller-mediated behavior as implemented automatic integration.
    stage: execute
    gate: flag
    next_move: >
      Expand analysis.md from the accepted per-RQ findings while preserving the four unresolved
      boundaries, then run a separate adversarial review of the completed reader-facing analysis.
    owned_artifacts:
      - ART-ARCANUM-COMPOSITION-ANALYSIS
      - ART-ARCANUM-COMPOSITION-INITIAL-DEFINITIONS
      - ART-ARCANUM-COMPOSITION-REVIEW
      - ART-ARCANUM-COMPOSITION-SESSION
      - ART-ARCANUM-COMPOSITION-DISPATCH
      - ART-ARCANUM-COMPOSITION-RESEARCH-RETURNS
      - ART-ARCANUM-COMPOSITION-FINDINGS
      - ART-ARCANUM-COMPOSITION-DISPATCH-LEDGER
      - ART-ARCANUM-COMPOSITION-RESEARCH-SESSION
    links:
      - label: Reader-facing analysis
        target: ART-ARCANUM-COMPOSITION-ANALYSIS
        kind: artifact-id
      - label: Governed research baseline
        target: ART-ARCANUM-COMPOSITION-INITIAL-DEFINITIONS
        kind: artifact-id
      - label: Applied adversarial review
        target: ART-ARCANUM-COMPOSITION-REVIEW
        kind: artifact-id
      - label: Closing session
        target: ART-ARCANUM-COMPOSITION-SESSION
        kind: artifact-id
      - label: Executed governed dispatch
        target: ART-ARCANUM-COMPOSITION-DISPATCH
        kind: artifact-id
      - label: Accepted per-RQ findings
        target: ART-ARCANUM-COMPOSITION-FINDINGS
        kind: artifact-id
      - label: Dispatch lifecycle ledger
        target: ART-ARCANUM-COMPOSITION-DISPATCH-LEDGER
        kind: artifact-id
      - label: Research closing session
        target: ART-ARCANUM-COMPOSITION-RESEARCH-SESSION
        kind: artifact-id
    notes: >
      The original introduction in analysis.md remains unchanged. The governed research dispatch
      was confirmed, executed, closed, and accepted after two skeptic passes and an independent
      coverage audit. Findings answer seven of eleven questions and preserve four explicit
      unresolved boundaries; the reader-facing analysis has not yet been expanded from them.
  - context_id: CTX-LENS-RESOLUTION-ROUTING
    parent_id: root
    title: Lens and resolution routing
    purpose: >
      Maintain the installed separation between investigative lens routing and cumulative
      reader-facing resolution routing, beginning with the low-resolution writer and preserving
      explicit unavailability for medium and high writers until separately implemented.
    stage: review-audit
    gate: flag
    next_move: >
      Obtain an operator decision on whether to repair the four platform-neutral MAJOR findings;
      preserve the installed trio and do not alter Windows-specific failure paths meanwhile.
    owned_artifacts:
      - ART-ROUTING-POST-PROMOTION-REVIEW
      - ART-LENS-RESOLUTION-ROUTING-SESSION
    links:
      - label: Independent post-promotion review
        target: ART-ROUTING-POST-PROMOTION-REVIEW
        kind: artifact-id
      - label: Closing session and operator decision
        target: ART-LENS-RESOLUTION-ROUTING-SESSION
        kind: artifact-id
    notes: >
      The routing architecture and installation checks passed, but the independent review returned
      FIX. Windows-specific repair was explicitly deferred by the operator; four platform-neutral
      evidence, lifecycle, and authoring-governance findings remain open.

  - context_id: CTX-SUBAGENT-STRATEGY-RUNTIME-HARDENING
    parent_id: root
    title: Subagent strategy runtime hardening
    purpose: >
      Keep confirmed multi-agent strategy, append-only registration, executable Dispatch Spec,
      stage handoffs, closeout evidence, observability, and cross-platform enforcement mutually
      bound so working agents cannot launch from stale or mismatched authority.
    stage: validate
    gate: flag
    next_move: >
      Run the configured Windows and Ubuntu CI matrix; on dual pass, mark the context pass and
      resolve GAP-SUBAGENT-STRATEGY-LINUX-CI-001, otherwise preserve the failure and repair it.
    owned_artifacts:
