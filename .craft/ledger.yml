        target: ART-SUBAGENT-STRATEGY-CAPABILITY
        kind: artifact-id
      - label: Native projection and topology verifier
        target: ART-SUBAGENT-STRATEGY-RUNTIME
        kind: artifact-id
      - label: Cross-platform validation route
        target: ART-SUBAGENT-STRATEGY-CI-WORKFLOW
        kind: artifact-id
      - label: Governed closeout
        target: ART-SUBAGENT-STRATEGY-HARDENING-SESSION
        kind: artifact-id
    notes: >
      Local Windows tests pass, including concurrent registration and junction confinement. The
      Ubuntu job is configured but has not yet produced observed evidence in this session.

