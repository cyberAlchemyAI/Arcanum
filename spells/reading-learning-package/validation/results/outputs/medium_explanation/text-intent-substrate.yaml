text_intent_substrate:
  source: "reading-learning-package"
  whisper_contract: "compatible substrate; Whisper retains composition authority"
  resonance_core:
    tone: "clear"
    voice: "field_notebook"
    style_register: "practical"
    emotional_residue: "oriented confidence"
    forbidden_feels: "academic throat-clearing"
    accepted_examples:
      - "field_notebook"
    rejected_examples:
      - "unsupported_flourish"
  relevance_core:
    target_public: "curious builder"
    reader_state: "ready to apply the source model"
    assumed_knowledge: "knows what a source trace is"
    likely_objections: "whether generated prose can be trusted"
    authority_mode: "traceable practical explanation"
    reader_reward: "usable map"
  trajectory_core:
    narrative_anchor: "from claim to practice"
    introduction_strategy: "start from the source boundary"
    body_parts:
      - "core claim"
      - "source evidence"
      - "worked example"
      - "next reading"
    ending_strategy: "show how to continue with the trace"
    length: "medium"
    must_include:
      - "examples"
      - "next reading"
    must_avoid:
      - "burying the source trace"
  source_handles:
    - "arcanum/spells/reading-learning-package/fixtures/demo-tower/FINAL-LEARNING-PACK.md"
    - "arcanum/spells/reading-learning-package/fixtures/demo-tower/tracks/paper-claim-ledger.md"
    - "arcanum/spells/reading-learning-package/fixtures/demo-tower/source-record.md"
  validation_checks:
    - "source handles must support load-bearing claims"
    - "generated manuscript is learning output, not source authority"
    - "accepted and rejected examples must be preserved"
