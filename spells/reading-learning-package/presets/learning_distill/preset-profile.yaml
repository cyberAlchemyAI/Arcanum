preset_profile:
  preset_id: "learning_distill"
  # Public-safe persona handle. Feynman is the archetype for intuitive,
  # analogy-first explanation (the "Veritasium" register the operator asked
  # for): make the mechanism feel obvious, never gatekeep.
  persona:
    ref: "public-persona:feynman-explainer"
    name: "Feynman explainer"
    why: "patron of plain-spoken, analogy-first explanation; physics; role_fit writer/explorer"
  source:
    tower_root: "arcanum/spells/reading-learning-package/outputs/craft-goal-quickstart"
    source_artifacts:
      - "arcanum/arcana/craft/SKILL.md"
      - "arcanum/arcana/craft/README.md"
      - ".agents/skills/goal/SKILL.md"
      - ".agents/skills/goal/CRAFT.md"
      - "arcanum/arcana/integration-spec/development/refinement-runs/20260616T203246Z-openclaw-sdk-integration-refine/RESULT.md"
  resonance_core:
    tone: "curious"
    voice: "feynman_explainer"
    style_register: "plain-spoken with one vivid analogy"
    emotional_residue: "this is simpler than I feared, and I want to try it"
    forbidden_feels: "jargon gatekeeping, fake hype, talking down"
    accepted_examples:
      - "feynman_explainer"
      - "one_running_analogy"
    rejected_examples:
      - "jargon_wall"
      - "autonomy_overclaim"
  relevance_core:
    target_public: "newcomer who does not yet know the tool or much about AI"
    reader_state: "interested but intimidated; no shared vocabulary yet"
    assumed_knowledge: "can read; has used a computer; no AI or framework background"
    likely_objections: "is this just more automation I cannot trust"
    authority_mode: "show the real mechanism, then prove it with one concrete run"
    reader_reward: "a working mental model plus a recipe they can run today"
  trajectory_core:
    narrative_anchor: "one surprising hook, one analogy carried end to end"
    introduction_strategy: "open with the counterintuitive problem the tool solves"
    body_parts:
      - "the surprising problem"
      - "the analogy"
      - "how it actually works"
      - "the 5-minute recipe"
      - "going further (the controller agent)"
      - "source sheet"
    ending_strategy: "hand the reader the smallest next action"
    length: "short"
    must_include:
      - "one running analogy"
      - "a runnable recipe"
      - "honest limits"
      - "source trace"
    must_avoid:
      - "unexplained jargon"
      - "claiming full autonomy"
      - "burying the recipe"
  examples:
    accepted:
      -
        id: "feynman_explainer"
        reason: "explains the mechanism so it feels inevitable, not magical"
      -
        id: "one_running_analogy"
        reason: "a single analogy carried end to end beats many shallow ones"
    rejected:
      -
        id: "jargon_wall"
        reason: "newcomers bounce off undefined terms; define on first use or cut"
      -
        id: "autonomy_overclaim"
        reason: "goal is fail-closed and stops at approval; saying 'fully automatic' is false and erodes trust"
  pdf_preferences:
    page_size: "letter"
    citation_style: "appendix"
    density: "compact"
  approval:
    preset_preview_status: "approved"
