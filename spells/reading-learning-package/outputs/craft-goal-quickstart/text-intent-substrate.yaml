text_intent_substrate:
  transport: "learning_package"        # extension of substack_research_post; non-conversion learning artifact
  preset_id: "learning_distill"
  objective: >
    Give a complete newcomer a working mental model of Craft + the Goal loop, show
    how they snap together into an easy automated pipeline, and end with a recipe
    they can run in five minutes. Introduce the controller-agent pattern (e.g. a
    Hermes-class model or an OpenClaw agent runtime) as the optional conductor.
  resonance_core:
    tone: "curious"
    voice: "feynman_explainer"
    style_register: "plain-spoken with one vivid analogy"
    emotional_residue: "this is simpler than I feared, and I want to try it"
    forbidden_feels: ["jargon gatekeeping", "fake hype", "talking down", "autonomy overclaim"]
  relevance_core:
    target_public: "newcomer to the tool and to AI"
    reader_state: "interested but intimidated; no shared vocabulary"
    domain: "agentic software development with a project ledger"
    authority_mode: "show the real mechanism, then prove it with one concrete run"
    assumptions: ["reader can use a terminal at a copy-paste level", "reader has an AI coding agent available (Claude Code or Codex)"]
    objections: ["is this just more automation I cannot trust", "do I need to learn a whole framework first"]
  trajectory_core:
    narrative_anchor: "AI agents have amnesia; Craft is the notebook that cures it; Goal is the autopilot that reads it"
    running_analogy: "expedition logbook (Craft) + autopilot that stops at the toll booth (Goal) + expedition leader (controller agent)"
    introduction: "open on the amnesia problem — every fresh session forgets yesterday"
    body_parts:
      - id: hook
        part: "The surprising problem: brilliant agents with no memory"
      - id: craft
        part: "Craft = the expedition logbook (durable project memory)"
      - id: goal
        part: "Goal = the autopilot that reads the log and stops at the toll booth"
      - id: pipeline
        part: "Snapping them together: the easy automated pipeline"
      - id: recipe
        part: "The 5-minute recipe"
      - id: controller
        part: "Going further: the conductor (Hermes / OpenClaw controller agent)"
      - id: limits
        part: "Honest limits: what it will NOT do for you"
      - id: sources
        part: "Source sheet"
    ending: "hand the reader the single smallest next command"
    length: "short"
  source_use_policy:
    rule: "Every load-bearing claim about Craft, Goal, or OpenClaw maps to a source artifact in source-trace.md. Analogies are clearly the author's framing, not source claims."
    source_artifacts:
      - "arcanum/arcana/craft/SKILL.md"
      - "arcanum/arcana/craft/README.md"
      - ".agents/skills/goal/SKILL.md"
      - ".agents/skills/goal/CRAFT.md"
      - "arcanum/arcana/integration-spec/development/refinement-runs/20260616T203246Z-openclaw-sdk-integration-refine/RESULT.md"
  validation_checks:
    - "one analogy carried end to end (not a pile of metaphors)"
    - "every jargon term defined on first use or cut"
    - "the recipe is copy-pasteable and ordered"
    - "fail-closed / approval-gate behavior stated honestly (no full-autonomy claim)"
    - "controller agent framed as optional conductor, not a required dependency"
    - "source trace covers every mechanism claim"
