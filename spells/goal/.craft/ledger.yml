descriptions:
  - description_id: DESC-GOAL-001
    context_id: CTX-GOAL-ROOT
    description: >
      The goal spell is a router-only, fail-closed control spine (read-frontier →
      classify-risk → select owner+technique → dispatch → audit gate → stage delta
      → promote behind a batched approval token) plus opt-in gap-discovery and
      proportionality modules. It delegates reusable mechanisms to owning sigils
      and owns inline only 6 new mechanisms; its N5 mechanism reads a private
      decision-mentality profile.
    status: active
    evidence: ART-ADO-DESIGN-RESULT

definitions:
  - definition_id: DEF-GOAL-SPELL-001
    scope_id: CTX-GOAL-ROOT
    term: goal spell
    statement: >
      A composed Arcanum spell at spells/goal that drives a Craft DAG autonomously
      under a propose-then-promote control spine, mutating the ledger only through
      staged deltas promoted behind a batched, decision-gate-recorded approval.
    status: candidate
    evidence: ART-ADO-DESIGN-RESULT
  - definition_id: DEF-PUBLIC-PRIVATE-SPLIT-001
    scope_id: CTX-GOAL-ROOT
    term: goal public/private split
    statement: >
      The public arcanum spell ships only generic contracts, public schemas, and
      neutral defaults. The filled profile instance stays private in the consuming
      root repository and is supplied at runtime.
    status: candidate
    evidence: ART-DECISION-PROFILE-PRIVATE

typed_items:
  - item_id: BLK-GOAL-SUBMODULE-001
    kind: blocker
    base_type: governance_blocker
    context_type: goal.public_submodule_discipline
    primary_lane: governance
    secondary_lanes:
      - architecture
      - validator
    source_id: CTX-GOAL-ROOT
    target_id: CTX-GOAL-ROOT
    status: closed
    refinement_status: refined
    default_role: governance_reviewer
    delegation_route: task-session
    closure_condition: >
      All goal-spell authoring lands in public arcanum with NO private operator data
      (decision corpus / filled profile excluded). Public arcanum keeps only generic
      contracts, schemas, neutral defaults, opaque handles, and public-safe evidence.
      Commits follow submodule discipline (arcanum first + make bump-check) only
      when publication is separately requested.
    evidence: ART-DECISION-PROFILE-PRIVATE
    decision_ref: DEC-GOAL-PRIVACY-SPLIT-001
    reason: spells/goal lives in the public arcanum submodule; private data must not leak.
  - item_id: GATE-GOAL-PROMOTION-001
    kind: gate
    base_type: readiness_gate
    context_type: goal.draft_to_promoted
    primary_lane: validator
    secondary_lanes:
      - auditor
    source_id: CTX-GOAL-ROOT
    target_id: CTX-GOAL-ROOT
    status: active
    refinement_status: refined
    default_role: validation_reviewer
    delegation_route: experiment-harness
    closure_condition: >
      experiment-harness evidence shows the spine holds - fail-closed not
      bypassable (read-only-craft boundary), gap-discovery terminates, approvals
      emit decision-gate records - before the spell promotes out of draft.
    evidence: ART-GOAL-PROMOTION-RECEIPT
    decision_ref: DEC-GOAL-PROMOTE-REGISTER-001
    reason: The two audit BLOCKs (B1 staging, B2 bypass) were proven resolved by fixtures, dispatch validation, and Experiment Harness evidence.
  - item_id: ENA-ADO-DESIGN-001
    kind: enabler
    base_type: design_enabler
    context_type: goal.validated_option_a_design
    primary_lane: architecture
    secondary_lanes:
      - planner
    source_id: CTX-GOAL-ROOT
    target_id: CTX-GOAL-ROOT
    status: active
    refinement_status: refined
    default_role: architecture_reviewer
    delegation_route: invoke
    closure_condition: Option A design + recomposition proof (16/16 components) + SWU-GOAL-* plan remain the build contract.
    evidence: ART-ADO-DESIGN-RESULT
    decision_ref: DEC-GOAL-PACKAGING-001
    reason: The validated, audited design is the ready input that makes the build a bounded SWU set.

decisions:
  - decision_id: DEC-GOAL-PACKAGING-001
    scope_id: CTX-GOAL-ROOT
    decision_type: selection
    question: How should the autonomous DAG goal-loop be packaged into Arcanum?
    description: Chosen packaging shape for the goal-loop design among composed-spell vs new-atomic-sigils vs extend-existing.
    options:
      - option-a-one-composed-spell-at-spells-goal
      - option-b-spell-plus-new-atomic-sigils
      - option-c-extend-existing-sigils
    default_option: option-a-one-composed-spell-at-spells-goal
    selected: option-a-one-composed-spell-at-spells-goal
    rationale: Operator selected A; single promotion-gated home, composition over duplication, spells/goal already scaffolded, owner-boundary cleanliness. Tournament A=19 (Pareto-dominant) vs B=12, C=10.
    evidence: ART-ADO-DESIGN-RESULT
    status: closed
    blocking: false
    impact: The build is a single spell package at spells/goal composing existing sigils + 6 inline new mechanisms.
    owner: operator
    links:
      - label: design result
        target: ART-ADO-DESIGN-RESULT
        kind: artifact-id
      - label: design enabler
        target: ENA-ADO-DESIGN-001
        kind: row-id
  - decision_id: DEC-GOAL-PRIVACY-SPLIT-001
    scope_id: CTX-GOAL-ROOT
    decision_type: approval
    question: How is the private decision-mentality model handled given arcanum is public?
    description: Public/private split so the operator's decision data never enters the public submodule.
    options:
      - public-schema-only-private-filled-profile
      - whole-model-into-arcanum
    default_option: public-schema-only-private-filled-profile
    selected: public-schema-only-private-filled-profile
    rationale: arcanum is public; the model is private operator data and operator rule D12 forbids touching arcanum with it. Public ships schema + neutral default; filled profile stays private and loads at runtime.
    evidence: ART-DECISION-PROFILE-PRIVATE
    status: closed
    blocking: false
    impact: spells/goal ships decision-profile.schema only; BLK-GOAL-SUBMODULE-001 governs no-leak authoring.
    owner: operator
    links:
      - label: private profile
        target: ART-DECISION-PROFILE-PRIVATE
        kind: artifact-id
      - label: no-leak blocker
        target: BLK-GOAL-SUBMODULE-001
        kind: row-id
  - decision_id: DEC-GOAL-PROFILE-HOME-001
    scope_id: ART-DECISION-PROFILE-PRIVATE
    decision_type: selection
    question: Where does the filled profile instance live?
    description: Private runtime home for the operator's filled decision profile.
    options:
      - consuming-root-private-profile-instance
      - external-private-artifact
      - inside-arcanum-submodule
    default_option: consuming-root-private-profile-instance
    selected: consuming-root-private-profile-instance
    rationale: Public arcanum carries only generic contracts and schemas. The consuming root repository owns the filled schema instance and supplies it at runtime.
    evidence: ART-DECISION-PROFILE-PRIVATE
    status: closed
    blocking: false
    impact: Profile instance stays private in the consuming root; the public spell loads a private runtime instance without shipping filled data or local paths.
    owner: operator
    links:
      - label: private profile
        target: ART-DECISION-PROFILE-PRIVATE
        kind: artifact-id
  - decision_id: DEC-GOAL-CRAFT-SCOPE-001
    scope_id: CTX-GOAL-ROOT
    decision_type: selection
    question: Where does the Craft ledger for the goal-spell build live?
    description: Craft scope location for tracking the goal spell build.
    options:
      - spells-goal-dot-craft
      - spells-goal-development-dot-craft
      - consuming-root-craft
      - external-private-child-context
    default_option: spells-goal-dot-craft
    selected: spells-goal-dot-craft
    rationale: Operator correction — the spell is the scope, so .craft sits at the spell root (spells/goal/.craft). Rows reference the private profile by opaque handle, not by content or local path.
    evidence: ART-GOAL-CRAFT-LEDGER
    status: closed
    blocking: false
    impact: This ledger lives at spells/goal/.craft/ledger.yml with the human view at spells/goal/CRAFT.md.
    owner: operator
    links:
      - label: ledger source
        target: ART-GOAL-CRAFT-LEDGER
        kind: artifact-id
  - decision_id: DEC-GOAL-PROMOTE-REGISTER-001
    scope_id: CTX-GOAL-ROOT
    decision_type: approval
    question: Should the goal spell promote, register, and install after post-workpack validation?
    description: Owner approval to move the goal spell from draft evidence into registered reusable spell status and install a consuming-repository generated runtime package.
    options:
      - promote-register-install
      - keep-draft
      - register-only
    default_option: promote-register-install
    selected: promote-register-install
    rationale: Spellcraft post-workpack validation passed; fixture runner, dispatch validation, Experiment Harness evidence, generated-surface dry run, diff check, and public-boundary scan passed.
    evidence: ART-GOAL-PROMOTION-RECEIPT
    status: closed
    blocking: false
    impact: The public spell is registered and the consuming repository may expose the generated native Codex package without copying a filled decision profile into public arcanum.
    owner: operator
    links:
      - label: promotion receipt
        target: ART-GOAL-PROMOTION-RECEIPT
        kind: artifact-id
      - label: promotion gate
        target: GATE-GOAL-PROMOTION-001
        kind: row-id

