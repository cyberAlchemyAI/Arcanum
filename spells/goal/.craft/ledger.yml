descriptions:
  - description_id: DESC-GOAL-001
    context_id: CTX-GOAL-ROOT
    description: >
      The goal spell is a router-only, fail-closed control spine (read-frontier →
      classify-risk → select owner+technique → dispatch → audit gate → stage delta
      → promote behind a batched approval token) plus opt-in gap-discovery and
      proportionality modules. It delegates reusable mechanisms to owning sigils
      and owns inline only 6 new mechanisms; its N5 mechanism reads a private
      decision-mentality profile.
    status: active
    evidence: ART-ADO-DESIGN-RESULT

definitions:
  - definition_id: DEF-GOAL-SPELL-001
    scope_id: CTX-GOAL-ROOT
    term: goal spell
    statement: >
      A composed Arcanum spell at spells/goal that drives a Craft DAG autonomously
      under a propose-then-promote control spine, mutating the ledger only through
      staged deltas promoted behind a batched, decision-gate-recorded approval.
    status: candidate
    evidence: ART-ADO-DESIGN-RESULT
  - definition_id: DEF-PUBLIC-PRIVATE-SPLIT-001
    scope_id: CTX-GOAL-ROOT
    term: goal public/private split
    statement: >
      The public arcanum spell ships only decision-profile.schema (shape, no data);
      the filled decision-profile.yml (operator data) stays private in .arcanum/profiles
      and is loaded at runtime. Honors submodule discipline and operator rule D12.
    status: candidate
    evidence: ART-DECISION-PROFILE-PRIVATE

