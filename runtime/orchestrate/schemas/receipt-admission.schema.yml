{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://arcanum.local/runtime/orchestrate/schemas/receipt-admission.schema.yml",
  "title": "Native Dispatch Runner Receipt Admission",
  "type": "object",
  "required": [
    "schema_version",
    "dispatch_id",
    "run_id",
    "wave_id",
    "status",
    "expected_action_ids",
    "admitted_receipt_action_ids",
    "receipt_files",
    "blockers"
  ],
  "properties": {
    "schema_version": {"const": "arcanum.native-dispatch-runner.receipt-admission.v0.1"},
    "dispatch_id": {"type": "string", "minLength": 1},
    "run_id": {"type": "string", "minLength": 1},
    "wave_id": {"type": "string", "minLength": 1},
    "status": {"enum": ["pass", "block"]},
    "expected_action_ids": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {"type": "string", "pattern": "^spawn-[0-9]{4}$"}
    },
    "admitted_receipt_action_ids": {
      "type": "array",
      "uniqueItems": true,
      "items": {"type": "string", "pattern": "^spawn-[0-9]{4}$"}
    },
    "receipt_files": {
      "type": "array",
      "items": {
        "type": "object",
        "required": ["action_id", "path", "sha256", "receipt_status"],
        "properties": {
          "action_id": {"type": "string", "pattern": "^spawn-[0-9]{4}$"},
          "path": {"type": "string", "minLength": 1},
          "sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
          "receipt_status": {"enum": ["pass", "fail", "block", "timed_out"]}
        },
        "additionalProperties": false
      }
    },
    "blockers": {"type": "array", "items": {"type": "string", "minLength": 1}}
  },
  "allOf": [
    {
      "if": {"properties": {"status": {"const": "pass"}}},
      "then": {"properties": {"blockers": {"maxItems": 0}}}
    },
    {
      "if": {"properties": {"status": {"const": "block"}}},
      "then": {"properties": {"blockers": {"minItems": 1}}}
    }
  ],
  "additionalProperties": false
}
