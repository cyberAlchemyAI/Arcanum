decisions:
  - decision_id: DEC-LEDGER-MUTATION-RUNTIME-OWNER
    scope_id: CTX-CRAFT-LEDGER-RUNTIME
    decision_type: selection
    question: "Qual componente será o owner canônico do runtime mutável: o pacote Craft, um adapter separado ou uma superfície compartilhada de runtime?"
    description: The runtime is project-local to runtime/craft-ledger and its implementation tree separates responsibilities into subdirectories.
    options:
      - runtime/craft-ledger/implementation
      - Craft package root
      - separate runtime adapter
      - shared runtime surface
    selected: runtime/craft-ledger/implementation
    rationale: The operator selected a project-local implementation root and explicitly allowed subdirectories there to separate runtime responsibilities.
    evidence: "operator-direction: 2026-08-31; runtime_root=runtime/craft-ledger/implementation; layout=responsibility-separated-subdirectories"
    status: closed
    blocking: false
    impact: Runtime code, responsibility boundaries, tests, and implementation-local schemas now have one project-owned root; the concrete subdirectory layout remains Design work.
    owner: architecture
    links:
      - label: Discovery open questions
        target: ART-CRAFT-LEDGER-MUTATION-DISCOVERY
        kind: artifact-id
  - decision_id: DEC-LEDGER-MUTATION-OPERATION-INVENTORY
    scope_id: CTX-CRAFT-LEDGER-RUNTIME
    decision_type: selection
    question: "Qual é o inventário inicial de operações suportadas e qual delas fornece o menor slice útil sem fingir cobertura completa?"
    description: The runtime admits authoritative semantic mutations in coherent slices and keeps read, standalone validation, projection, orchestration, and external-owner execution outside the mutation discriminator.
    options:
      - mirror all declared Craft methods in the mutation runtime
      - stop at the add_gap-only transaction kernel
      - phase coherent mutation lifecycles after the add_gap kernel
    selected: phase coherent mutation lifecycles after the add_gap kernel
    rationale: The operator accepted the Robot-Talks synthesis. add_gap remains S0 and creates only active gaps. S1 adds transition_gap, next, open_decision, and decide so the runtime exercises creation, transition, context update, and a complete decision lifecycle without claiming all-method support. Later slices cover evidence and local knowledge, typed items and gates, then recursive contexts. New lifecycle operations require canonical Craft maintenance before runtime admission.
    evidence: ART-CRAFT-OPERATIONS-ROBOT-TALKS
    status: closed
    blocking: false
    impact: Bounds the runtime surface and prevents partial coverage from being represented as complete ledger support.
    owner: product
    links:
      - label: Updated discovery operation boundary
        target: ART-CRAFT-LEDGER-MUTATION-DISCOVERY
        kind: artifact-id
      - label: Admitted add_gap-only Define
        target: ART-LEDGER-MUTATION-DEFINE-SPEC
        kind: artifact-id
      - label: Robot-Talks operation decision
        target: ART-CRAFT-OPERATIONS-ROBOT-TALKS
        kind: artifact-id
  - decision_id: DEC-LEDGER-MUTATION-ID-POLICY
    scope_id: CTX-CRAFT-LEDGER-RUNTIME
    decision_type: selection
    question: "Qual autoridade fecha o domínio de unicidade e a política de alocação de IDs por família?"
    description: Open governance question for proposed row IDs, collision handling, and allocation authority across ledger families.
    options: []
    selected: pending
    rationale: Pending; enumerate governance-compatible allocation models and bind the selected model to each supported family.
    evidence: ART-CRAFT-LEDGER-MUTATION-DISCOVERY
    status: active
    blocking: false
    impact: Determines whether callers may propose IDs and how the runtime rejects collisions without inventing policy.
    owner: governance
    links:
