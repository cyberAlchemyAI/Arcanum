descriptions:
  - description_id: DESC-CRAFT-LEDGER-RUNTIME-001
    context_id: CTX-CRAFT-LEDGER-RUNTIME
    description: The project is defining a runtime that accepts structured Craft operations, validates candidate state, and applies admitted ledger mutations without partial writes or silent policy invention.
    status: active
    evidence: docs/features/ledger-mutation/discovery.md

  - description_id: DESC-CRAFT-LEDGER-RUNTIME-002
    context_id: CTX-CRAFT-LEDGER-RUNTIME
    description: Define v1 closes the input idea as one versioned protocol with a common envelope, an operation-discriminated payload, a mandatory pre-proposal ledger inspection snapshot, a non-writing plan, an explicit apply boundary, and stable outcomes. Only add_gap is supported in the first slice.
    status: active
    evidence: ART-LEDGER-MUTATION-DEFINE-ADMISSION

  - description_id: DESC-CRAFT-LEDGER-RUNTIME-003
    context_id: CTX-CRAFT-LEDGER-RUNTIME
    description: The operator observed that producing and admitting the add_gap-only Define v1 took 38 minutes. This cost is disproportionate for one supported operation and should not be repeated unchanged for every additional ledger family.
    status: active
    evidence: "operator-observation: 2026-08-31; elapsed=38m; scope=add_gap-only Define v1"

  - description_id: DESC-CRAFT-LEDGER-RUNTIME-004
    context_id: CTX-CRAFT-LEDGER-RUNTIME
    description: The canonical persisted gap-row schema already exists in arcana/craft/templates/schemas/ledger-core.schema.yml. The remaining design work is limited to the machine-checkable mutation request envelope, the add_gap payload contract, deterministic mapping into the existing gap row, and inspect/plan/apply/outcome contracts.
    status: active
    evidence: ../../../arcana/craft/templates/schemas/ledger-core.schema.yml#row_families.gaps

  - description_id: DESC-CRAFT-LEDGER-RUNTIME-005
    context_id: CTX-CRAFT-LEDGER-RUNTIME
    description: The mutation runtime supports authoritative semantic mutations through shared inspect, plan, apply, and outcome mechanics without treating read, standalone validation, projection, orchestration, or external execution as mutation operations. add_gap remains the create-active S0 transaction kernel; the first useful lifecycle slice adds transition_gap, next, open_decision, and decide, followed by evidence, typed-item, and recursive-context slices only after their contracts are admitted.
    status: active
    evidence: ART-CRAFT-OPERATIONS-ROBOT-TALKS

