$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://arcanum.local/evidence-grounded-diagrams/diagram-validation-receipt.schema.yml"
title: Evidence-Grounded Diagram Validation Receipt
type: object
additionalProperties: false
required:
  - contract_version
  - diagram_id
  - revision
  - validated_at
  - validator
  - observed_manifest_sha256
  - observed_members
  - manual_attestation
  - checks
  - overall
  - blockers
properties:
  contract_version:
    const: "2.0.0"
  diagram_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  revision:
    type: string
    pattern: "^r[0-9]{4}$"
  validated_at:
    type: string
    format: date-time
  validator:
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
  observed_manifest_sha256:
    type: string
    pattern: "^[a-f0-9]{64}$"
  observed_members:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [path, sha256]
      properties:
        path:
          type: string
          minLength: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
  manual_attestation:
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        required: [path, sha256, assessor_identity, provenance]
        properties:
          path:
            type: string
            minLength: 1
          sha256:
            type: string
            pattern: "^[a-f0-9]{64}$"
          assessor_identity:
            type: string
            minLength: 1
          provenance:
            type: string
            minLength: 1
  checks:
    type: object
    additionalProperties: false
    required:
      - schema_shape
      - referential_integrity
      - evidence_adequacy
      - source_validation
      - render_inspection
      - semantic_reconciliation
      - accessibility
      - persistence
    properties:
      schema_shape:
        $ref: "#/$defs/check"
      referential_integrity:
        $ref: "#/$defs/check"
      evidence_adequacy:
        $ref: "#/$defs/check"
      source_validation:
        $ref: "#/$defs/check"
      render_inspection:
        $ref: "#/$defs/check"
      semantic_reconciliation:
        $ref: "#/$defs/check"
      accessibility:
        $ref: "#/$defs/check"
      persistence:
        $ref: "#/$defs/check"
  overall:
    enum: [PASS, FAIL, DRAFT, BLOCKED]
  blockers:
    type: array
    items:
      type: string
      minLength: 1
$defs:
  check:
    type: object
    additionalProperties: false
    required: [status, assessor, evidence, limitations]
    properties:
      status:
        enum: [PASS, FAIL, NOT_RUN, N/A]
      assessor:
        type: string
        minLength: 1
      evidence:
        type: string
      limitations:
        type: array
        items:
          type: string
          minLength: 1
    allOf:
      - if:
          properties:
            status:
              enum: [PASS, FAIL]
          required: [status]
        then:
          properties:
            evidence:
              minLength: 1
      - if:
          properties:
            status:
              const: NOT_RUN
          required: [status]
        then:
          properties:
            limitations:
              minItems: 1
allOf:
  - if:
      properties:
        overall:
          const: PASS
      required: [overall]
    then:
      properties:
        blockers:
          maxItems: 0
        checks:
          properties:
            schema_shape:
              properties: {status: {const: PASS}}
            referential_integrity:
              properties: {status: {const: PASS}}
            evidence_adequacy:
              properties: {status: {const: PASS}}
            source_validation:
              properties: {status: {const: PASS}}
            render_inspection:
              properties: {status: {const: PASS}}
            semantic_reconciliation:
              properties: {status: {const: PASS}}
            accessibility:
              properties: {status: {const: PASS}}
            persistence:
              properties: {status: {const: PASS}}
