$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://arcanum.local/evidence-grounded-diagrams/diagram-semantic-model.schema.yml"
title: Evidence-Grounded Diagram Semantic Model
description: Structural claim and visual-encoding model. Shape validation does not prove evidence truth or semantic equivalence.
type: object
additionalProperties: false
required:
  - contract_version
  - diagram_id
  - revision
  - request_binding
  - reader_question
  - caption
  - rationale
  - scope
  - sources
  - claims
  - elements
  - encodings
  - textual_equivalent_coverage
  - aggregate_status
  - residue
properties:
  contract_version:
    const: "2.0.0"
  diagram_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  revision:
    type: string
    pattern: "^r[0-9]{4}$"
  request_binding:
    $ref: "#/$defs/requestBinding"
  reader_question:
    type: string
    minLength: 1
  caption:
    type: string
    minLength: 1
  rationale:
    type: string
    minLength: 1
  scope:
    type: object
    additionalProperties: false
    required: [coverage, completeness, exclusions]
    properties:
      coverage:
        type: string
        minLength: 1
      completeness:
        enum: [complete, partial]
      exclusions:
        type: array
        items:
          type: string
          minLength: 1
  sources:
    type: array
    items:
      $ref: "#/$defs/source"
  claims:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/claim"
  elements:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/element"
  encodings:
    type: array
    items:
      $ref: "#/$defs/encoding"
  textual_equivalent_coverage:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
  aggregate_status:
    enum: [evidence-backed, inferred, hypothesis, mixed, unknown, not-applicable]
  residue:
    type: array
    items:
      $ref: "#/$defs/residue"
$defs:
  requestBinding:
    type: object
    additionalProperties: false
    required: [request_id, evidence_set_id, request_sha256, evidence_snapshot_digest]
    properties:
      request_id:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]*$"
      evidence_set_id:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
      request_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"
      evidence_snapshot_digest:
        type: [string, "null"]
        pattern: "^[a-f0-9]{64}$"
  locator:
    type: object
    additionalProperties: false
    required: [locator_id, selector]
    properties:
      locator_id:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
      selector:
        type: string
        minLength: 1
      excerpt:
        type: string
  source:
    type: object
    additionalProperties: false
    required: [source_id, source_type, location, authority_role, locators]
    properties:
      source_id:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
      source_type:
        enum: [file, url, document, code, observation, user-provided, other]
      location:
        type: string
        minLength: 1
      authority_role:
        enum: [governing, primary, secondary, observational, unknown]
      content_digest:
        type: [string, "null"]
        pattern: "^[a-f0-9]{64}$"
      locators:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/locator"
  support:
    type: object
    additionalProperties: false
    required: [source_id, locator_id, support_kind]
    properties:
      source_id:
        type: string
        minLength: 1
      locator_id:
        type: string
        minLength: 1
      support_kind:
        enum: [direct, corroborating, conflicting, motivating]
  claim:
    type: object
    additionalProperties: false
    required:
      - claim_id
      - exact_meaning
      - relation_kind
      - status
      - support
      - qualification
      - load_bearing
      - included
    properties:
      claim_id:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
      exact_meaning:
        type: string
        minLength: 1
      relation_kind:
        type: string
        pattern: "^(existence|association|flow|dependency|precedence|sequence|transition|containment|ownership|part-whole|hierarchy|causality|recurrence|exclusion|convergence|custom:[a-z0-9][a-z0-9.-]*)$"
      status:
        enum: [evidence-backed, inferred, hypothesis, unknown]
      support:
        type: array
        items:
          $ref: "#/$defs/support"
      qualification:
        type: string
        minLength: 1
      load_bearing:
        type: boolean
      included:
        type: boolean
  element:
    type: object
    additionalProperties: false
    required: [element_id, element_type, label, claim_ids]
    properties:
      element_id:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
      element_type:
        enum: [node, label, edge, direction, order, branch, merge, loop, enclosure, grouping, proximity, omission, emphasis]
      label:
        type: string
      selector:
        type: [string, "null"]
      claim_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
  encoding:
    type: object
    additionalProperties: false
    required: [encoding_id, mark, meaning, element_ids, claim_ids, redundant_text_channel]
    properties:
      encoding_id:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
      mark:
        type: string
        minLength: 1
      meaning:
        type: string
        minLength: 1
      element_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      claim_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      redundant_text_channel:
        type: string
        minLength: 1
  residue:
    type: object
    additionalProperties: false
    required: [item, reason, disposition]
    properties:
      item:
        type: string
        minLength: 1
      reason:
        enum: [unsupported, conflicting, omitted, unknown, deferred]
      disposition:
        type: string
        minLength: 1
