<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Table Is Not The Project</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f0;
      --surface: #ffffff;
      --ink: #1f242b;
      --muted: #616b76;
      --line: #d7d2c7;
      --green: #23724d;
      --blue: #2f639d;
      --amber: #9a6a12;
      --coral: #b6543b;
      --violet: #6750a4;
      --soft-green: #eaf6ef;
      --soft-blue: #eaf2fb;
      --soft-amber: #fff2d3;
      --soft-coral: #fae9e4;
      --soft-violet: #eee9fa;
      --shadow: 0 16px 40px rgba(31, 36, 43, .12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button {
      font: inherit;
    }

    .topbar {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      min-height: 56px;
      padding: 9px 18px;
      border-bottom: 1px solid rgba(215, 210, 199, .9);
      background: rgba(247, 246, 240, .92);
      backdrop-filter: blur(14px);
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      display: block;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .deck-title {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: inline-grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(31, 36, 43, .07);
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: var(--blue);
      outline: 3px solid rgba(47, 99, 157, .18);
    }

    .counter {
      min-width: 68px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .progress {
      position: fixed;
      z-index: 25;
      top: 56px;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(215, 210, 199, .85);
    }

    .progress span {
      display: block;
      width: 7.14%;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--coral));
      transition: width .2s ease;
    }

    .deck {
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      scroll-snap-type: none;
    }

    .slide {
      min-height: 100vh;
      padding: 88px clamp(22px, 5vw, 72px) 38px;
      display: grid;
      align-items: center;
      scroll-snap-align: start;
    }

    .slide-inner {
      width: min(1220px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(360px, 1.08fr) minmax(320px, .92fr);
      gap: clamp(24px, 4vw, 56px);
      align-items: center;
    }

    .visual-stage {
      min-height: 480px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at top left, rgba(47, 99, 157, .08), transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, .92), rgba(247, 246, 240, .98));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .visual-stage[data-has-reveal="true"] {
      cursor: pointer;
    }

    .visual-stage[data-has-reveal="true"]:focus-visible {
      outline: 4px solid rgba(47, 99, 157, .24);
      outline-offset: 5px;
    }

    .copy {
      display: grid;
      gap: 17px;
    }

    .slide-id {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 5.2vw, 76px);
      line-height: .98;
      letter-spacing: 0;
    }

    .question {
      margin: 0;
      color: var(--blue);
      font-size: clamp(21px, 2.1vw, 30px);
      font-weight: 760;
      line-height: 1.16;
    }

    .takeaway {
      margin: 0;
      color: var(--ink);
      font-size: clamp(18px, 1.35vw, 22px);
    }

    .speaker-note b {
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .speaker-note p {
      margin: 0;
      color: var(--muted);
    }

    .term {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid currentColor;
      border-radius: 8px;
      color: var(--coral);
      font-size: 13px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .speaker-note {
      display: none;
      gap: 7px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
    }

    body.show-notes .speaker-note {
      display: grid;
    }

    .visual {
      width: 100%;
      height: 100%;
      min-height: 480px;
      padding: 34px;
      display: grid;
      place-items: center;
    }

    .visual svg {
      width: 100%;
      max-height: 420px;
      display: block;
    }

    .scene-grid,
    .branch-grid,
    .compare-grid,
    .schema-grid,
    .mini-grid {
      width: 100%;
      display: grid;
      gap: 16px;
      align-items: stretch;
    }

    .scene-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .compare-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mini-grid {
      grid-template-columns: .8fr 1.2fr;
    }

    .branch-grid,
    .schema-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .mini-grid .schema-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .visual-card,
    .node,
    .schema-field {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 10px 24px rgba(31, 36, 43, .07);
    }

    .visual-card {
      min-height: 150px;
      padding: 16px;
      display: grid;
      align-content: space-between;
      gap: 14px;
    }

    .visual-card strong,
    .node strong,
    .schema-field strong {
      display: block;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.15;
    }

    .visual-card span,
    .node span,
    .schema-field span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .prompt-box {
      width: min(520px, 100%);
      margin: 0 auto 22px;
      padding: 18px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      background: var(--soft-blue);
      color: var(--ink);
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 800;
      text-align: center;
    }

    .node {
      min-height: 96px;
      padding: 15px;
      display: grid;
      align-content: center;
      gap: 7px;
      text-align: center;
    }

    .node.root {
      grid-column: 1 / -1;
      background: var(--soft-amber);
      border-color: rgba(154, 106, 18, .35);
    }

    .node.green {
      background: var(--soft-green);
    }

    .node.blue {
      background: var(--soft-blue);
    }

    .node.coral {
      background: var(--soft-coral);
    }

    .node.violet {
      background: var(--soft-violet);
    }

    .schema-field {
      min-height: 110px;
      padding: 15px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
    }

    .chip {
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .reveal-prompt {
      display: grid;
      justify-items: center;
      gap: 10px;
    }

    .pause-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .pause-badge {
      border: 1px solid rgba(154, 106, 18, .35);
      background: var(--soft-amber);
      color: var(--amber);
    }

    .slide[data-reveal-step="1"] .pause-badge,
    .slide[data-reveal-step="2"] .pause-badge {
      display: none;
    }

    .reveal-step {
      display: none;
    }

    .slide[data-reveal-step="1"] .reveal-step-1,
    .slide[data-reveal-step="2"] .reveal-step-1,
    .slide[data-reveal-step="2"] .reveal-step-2 {
      display: flex;
    }

    .example-map {
      width: min(560px, 100%);
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .slide[data-reveal-step="2"] .example-map {
      display: grid;
    }

    .example-item {
      min-height: 68px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
    }

    .example-item b,
    .example-item span {
      display: block;
    }

    .example-item b {
      color: var(--ink);
      font-size: 14px;
    }

    .example-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .bad-prompt {
      padding: 22px;
      border: 2px solid rgba(182, 84, 59, .4);
      border-radius: 8px;
      background: var(--soft-coral);
      color: var(--ink);
      font-size: clamp(24px, 2.4vw, 36px);
      font-weight: 820;
      text-align: center;
    }

    .arrow-label {
      align-self: center;
      color: var(--muted);
      font-weight: 850;
      text-align: center;
    }

    @media (max-width: 980px) {
      .slide {
        padding-top: 84px;
      }

      .slide-inner {
        grid-template-columns: 1fr;
      }

      .visual-stage,
      .visual {
        min-height: 360px;
      }

      .scene-grid,
      .compare-grid,
      .branch-grid,
      .schema-grid,
      .mini-grid {
        grid-template-columns: 1fr 1fr;
      }

      .node.root {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .toolbar {
        justify-content: space-between;
      }

      .progress {
        top: 102px;
      }

      .slide {
        padding: 126px 16px 34px;
      }

      .visual {
        padding: 20px;
      }

      .scene-grid,
      .compare-grid,
      .branch-grid,
      .schema-grid,
      .mini-grid,
      .example-map {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: clamp(34px, 13vw, 48px);
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .topbar,
      .progress {
        display: none;
      }

      .deck {
        height: auto;
        overflow: visible;
      }

      .slide {
        min-height: 100vh;
        page-break-after: always;
        padding: 26px;
      }

      .slide-inner {
        grid-template-columns: 1fr 1fr;
      }

      .visual-stage,
      .visual {
        min-height: 360px;
        box-shadow: none;
      }

      .speaker-note {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Beginner coding class</span>
      <span class="deck-title">The Table Is Not The Project</span>
    </div>
    <div class="toolbar" aria-label="Deck controls">
      <button class="icon-button" id="prev-slide" type="button" aria-label="Previous slide" title="Previous slide">&lt;</button>
      <span class="counter" id="slide-counter">1 / 14</span>
      <button class="icon-button" id="next-slide" type="button" aria-label="Next slide" title="Next slide">&gt;</button>
      <button class="icon-button" id="toggle-notes" type="button" aria-label="Toggle speaker notes" title="Toggle speaker notes">i</button>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <main class="deck" id="deck" aria-label="Beginner coding class slide deck"></main>

  <script>
    const slides = [
      {
        id: "CRAFT-INTRO-S01",
        title: "Look At This Table",
        question: "What would you need before anyone builds?",
        term: "",
        concept: "Do not answer yet. Let the object make the missing work visible.",
        activity: "Silent list for 15 seconds. Then click the table twice: first reveal buckets, then reveal examples.",
        note: "Begin with recognition, not explanation. Hold the answer back for one short pause. The point is not that a table is hard. The point is that even a familiar object has hidden requirements before it can be built.",
        check: "Students name at least materials, tools, measurements, and steps without needing formal vocabulary.",
        bridge: "Good. That list is raw material. Craft starts by defining what this object is supposed to become.",
        visual: "simpleTable",
        revealMax: 2
      },
      {
        id: "CRAFT-INTRO-S02",
        title: "Define The Object",
        question: "Which table are we actually talking about?",
        term: "define",
        concept: "Define turns a wish into a bounded target.",
        activity: "Ask students what must be named before the table can be discussed responsibly: use, place, user, size range, and what it is not.",
        note: "Use the closure condition from the initial definition: what is being built, why, for whom or what, in what bounded space, and what artifact should exist next. Do not design yet. Only name the target clearly enough that everyone is talking about the same object.",
        check: "Students can distinguish a dining table, desk, coffee table, and work table as different targets.",
        bridge: "Now that the target is named, we still need facts before choosing the shape.",
        visual: "defineTarget"
      },
      {
        id: "CRAFT-INTRO-S03",
        title: "Research Before Design",
        question: "What do we need to learn before choosing?",
        term: "research",
        concept: "Research gathers evidence so the design is not just a guess.",
        activity: "Ask which facts would change the table: room size, material strength, available tools, examples, cost, and how people will use it.",
        note: "Research here means grounding, not a school report. In the formal definition, research is an input to Define and a route when domain information is missing. For beginners, make it practical: look at reality before locking the design.",
        check: "Students can name at least two facts that would change the table design.",
        bridge: "Now the evidence can become a structure.",
        visual: "researchBoard"
      },
      {
        id: "CRAFT-INTRO-S04",
        title: "Design The Schema",
        question: "What structure will hold the target?",
        term: "schema",
        concept: "The design becomes a schema: the chosen shape of valid work.",
        activity: "Point to one design choice the schema now fixes: material, size, joinery, finish, or check.",
        note: "This is where the first formal Craft word is earned. Schema should not feel abstract. It is the chosen structure that makes the target legible enough to build, compare, and say whether a result still counts.",
        check: "Students can say that the schema narrows which tables count as valid for this job.",
        bridge: "A design is still not a build order. We need a plan.",
        visual: "planShape"
      },
      {
        id: "CRAFT-INTRO-S05",
        title: "Plan The Build",
        question: "What is the next executable piece?",
        term: "plan",
        concept: "Plan turns the design into ordered work with done checks.",
        activity: "Ask which step should happen first and what would prove that step is done.",
        note: "Bring in the initial definition's planning ladder gently: plan becomes waves, tasks, and smallest work units. For the table, that can be measure, cut, join, finish, and check. The plan closes only when the next piece can actually be executed.",
        check: "Students can name a next step, its input, its output, and a done check.",
        bridge: "Once a step is clear enough, someone can build.",
        visual: "planSteps"
      },
      {
        id: "CRAFT-INTRO-S06",
        title: "Build The Artifact",
        question: "What exists after the work runs?",
        term: "artifact",
        concept: "The artifact is the thing produced from the schema and plan.",
        activity: "Ask what changed when the drawing became a physical table.",
        note: "Make the contrast physical. The sketch cannot hold your coffee. The artifact can. But because it now exists, it can also fail in inspectable ways.",
        check: "Students can distinguish the plan from the produced object.",
        bridge: "Now we compare the thing back to the shape that produced it.",
        visual: "artifactCompare"
      },
      {
        id: "CRAFT-INTRO-S07",
        title: "Validate The Match",
        question: "Does the table match the design?",
        term: "validate",
        concept: "Validate means compare the artifact back to the schema.",
        activity: "Ask students which check they would run first: height, level surface, wobble, material, or fit.",
        note: "The initial definition treats validation as residue measurement. Keep the first pass simple: the check is not a vibe. It is a comparison between the thing we made and the structure we chose.",
        check: "Students name concrete checks such as height, stability, level surface, and material match.",
        bridge: "Anything left over is not shame. It is information.",
        visual: "validationChecks"
      },
      {
        id: "CRAFT-INTRO-S08",
        title: "Reflect On The Leftover",
        question: "What does the leftover teach us?",
        term: "residue",
        concept: "Residue is the mismatch or missing detail that tells us the next responsible move.",
        activity: "Name the leftover and route it: repair, research again, redesign, re-plan, or split a new layer.",
        note: "This is the reflection moment. Residue is not total failure. It is signal that the current layer may be missing information, structure, a check, a smaller unit, or a better path back into the whole.",
        check: "Students can distinguish residue from total failure and name one next move.",
        bridge: "Sometimes the leftover is small. Sometimes it reveals a hidden project.",
        visual: "leftOver"
      },
      {
        id: "CRAFT-INTRO-S09",
        title: "Same Word, New Problem",
        question: "Would the same plan still be enough?",
        term: "",
        concept: "The word stayed small, but the work inside it got much bigger.",
        activity: "List the new hidden work: drawings, carving tools, practice cuts, patterns, checks.",
        note: "Do not rush to the term yet. Let the ornate table create the pressure. The class should feel that 'make the legs' is no longer one simple instruction. It may need its own define, research, design, plan, build, validate, and reflect cycle.",
        check: "Students identify that the leg design may need its own drawing, tools, practice, and checks.",
        bridge: "The leg is part of the table, but it may also need its own layer.",
        visual: "ornateTable"
      },
      {
        id: "CRAFT-INTRO-S10",
        title: "A Step Becomes a Build",
        question: "When does one step need its own cycle?",
        term: "craft layer",
        concept: "If a part needs its own lifecycle and way back into the whole, it has become a craft layer.",
        activity: "Choose the leg, carving, assembly, or finish. What would its own define, research, design, plan, build, and check need?",
        note: "This is the core rule of the class. The layer is not separate because we like complexity. It is separate because the current step can no longer be responsibly handled as a single step inside the upper plan.",
        check: "Students can say why 'make the legs' is too broad.",
        bridge: "Software hides the same kind of work inside feature names.",
        visual: "plansInsidePlans"
      },
      {
        id: "CRAFT-INTRO-S11",
        title: "Software Does This Too",
        question: "What is hiding inside 'login'?",
        term: "",
        concept: "A feature name can hide its own target, evidence, design, plan, checks, and residue.",
        activity: "Break login into parts: field, button, validation, error, session, redirect.",
        note: "Keep this grounded in what beginners have seen. Login sounds like one feature until you ask what has to happen when the password is wrong, the network fails, the session expires, or the user returns tomorrow.",
        check: "Students produce at least three smaller responsibilities under one feature.",
        bridge: "Now we need a way to choose how much work belongs in one responsible piece.",
        visual: "codingVersion"
      },
      {
        id: "CRAFT-INTRO-S12",
        title: "Small Enough To Hold",
        question: "Which piece can we build and check?",
        term: "SCU",
        concept: "An SCU is the smallest coherent unit that still carries responsibility.",
        activity: "Pick the responsible unit: whole app, login form, or one blue button.",
        note: "The trap is thinking smaller always means better. Too large loses details. Too tiny stops meaning anything. The useful middle is small enough to build and check, but large enough to fit back into the whole.",
        check: "Students can reject both too-large and too-tiny units for the given objective.",
        bridge: "When the unit is too loose, too many paths compete.",
        visual: "responsiblePiece"
      },
      {
        id: "CRAFT-INTRO-S13",
        title: "Too Many Good Answers",
        question: "Why does the result drift?",
        term: "entropy",
        concept: "Entropy is the uncertainty pressure created when too many meanings are still possible.",
        activity: "Make 'dashboard' less slippery: who uses it, what data, what actions, what done means.",
        note: "Keep the term humble. Entropy here means uncertainty pressure. The AI has many plausible continuations, and the larger or vaguer the task is, the more those continuations compete.",
        check: "Students suggest constraints such as user, data, layout, actions, and success criteria.",
        bridge: "Craft is the method for routing that pressure instead of letting it drift.",
        visual: "manyPaths"
      },
      {
        id: "CRAFT-INTRO-S14",
        title: "The Craft Rule",
        question: "What did we actually do?",
        term: "Craft",
        concept: "Craft searches for the next responsible schema/data layer: define, research when needed, design, plan, execute, validate, reflect.",
        activity: "Ask students to explain the loop using the simple table, ornate leg, or login example.",
        note: "End with the formal spine from the initial definition. Craft is the recursive search for the next smallest coherent schema/data layer needed to translate intent into artifact with acceptable residue. The deck should now make that sentence feel earned.",
        check: "Students can map intention, schema, artifact, residue, and next layer onto at least one example.",
        bridge: "Next class, we use this loop to build a small app without letting the plan disappear.",
        visual: "craftLoop"
      }
    ];

    const visuals = {
      simpleTable: () => `
        <div class="visual" aria-label="Plain table with four straight legs">
          <svg viewBox="0 0 760 460" role="img">
            <rect x="100" y="142" width="560" height="58" rx="8" fill="#936b3d"/>
            <rect x="126" y="194" width="46" height="206" rx="6" fill="#70502e"/>
            <rect x="588" y="194" width="46" height="206" rx="6" fill="#70502e"/>
            <rect x="218" y="202" width="34" height="174" rx="6" fill="#80613a"/>
            <rect x="508" y="202" width="34" height="174" rx="6" fill="#80613a"/>

      formalSentence: () => `
        <div class="visual" aria-label="Intention to schema to artifact to residue to next layer">
          <div class="branch-grid">
            <div class="node blue"><strong>intention</strong><span>what we want</span></div>
            <div class="node green"><strong>schema</strong><span>the shape of the work</span></div>
            <div class="node amber" style="background: var(--soft-amber)"><strong>artifact</strong><span>the thing that exists</span></div>
            <div class="node coral"><strong>residue</strong><span>what is left over</span></div>
            <div class="node root"><strong>next layer</strong><span>repair locally or split out a smaller project</span></div>
          </div>
        </div>
      `
    };

    const deck = document.getElementById("deck");
    const counter = document.getElementById("slide-counter");
    const progress = document.getElementById("progress-bar");
    let activeIndex = 0;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderSlides() {
      deck.innerHTML = slides.map((slide, index) => `
        <section class="slide" id="${escapeHtml(slide.id)}" data-index="${index}" data-reveal-step="0" data-reveal-max="${slide.revealMax || 0}" aria-labelledby="${escapeHtml(slide.id)}-title">
          <div class="slide-inner">
            <div class="visual-stage" data-has-reveal="${slide.revealMax ? "true" : "false"}"${slide.revealMax ? ` role="button" tabindex="0" aria-label="Reveal more for ${escapeHtml(slide.title)}"` : ""}>${visuals[slide.visual]()}</div>
            <article class="copy">
              <span class="slide-id">${escapeHtml(slide.id)}</span>
              ${slide.term ? `<span class="term">${escapeHtml(slide.term)}</span>` : ""}
              <h1 id="${escapeHtml(slide.id)}-title">${escapeHtml(slide.title)}</h1>
              <p class="question">${escapeHtml(slide.question)}</p>
              <p class="takeaway">${escapeHtml(slide.concept)}</p>
              <aside class="speaker-note">
                <b>Prompt</b>
                <p>${escapeHtml(slide.activity)}</p>
                <b>Speaker note</b>
                <p>${escapeHtml(slide.note)}</p>
                <b>Check</b>
                <p>${escapeHtml(slide.check)}</p>
                <b>Bridge</b>
                <p>${escapeHtml(slide.bridge)}</p>
              </aside>
            </article>
          </div>
        </section>
      `).join("");
    }

    function advanceReveal(slideElement) {
      const max = Number(slideElement.dataset.revealMax || 0);
      if (!max) {
        return;
      }
      const current = Number(slideElement.dataset.revealStep || 0);
      const next = current >= max ? 0 : current + 1;
      slideElement.dataset.revealStep = String(next);
    }

    function wireRevealControls() {
      deck.querySelectorAll(".slide").forEach((slideElement) => {
        const stage = slideElement.querySelector(".visual-stage[data-has-reveal='true']");
        if (stage) {
          stage.addEventListener("click", () => advanceReveal(slideElement));
          stage.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              advanceReveal(slideElement);
            }
          });
        }
      });
    }

    function updateChrome(index) {
      activeIndex = Math.max(0, Math.min(slides.length - 1, index));
      counter.textContent = `${activeIndex + 1} / ${slides.length}`;
      progress.style.width = `${((activeIndex + 1) / slides.length) * 100}%`;
    }

    function scrollToTarget(target, behavior = "smooth") {
      if (target) {
        const slideElements = Array.from(deck.querySelectorAll(".slide"));
        const targetIndex = slideElements.indexOf(target);
        const scrollTop = slideElements
          .slice(0, Math.max(0, targetIndex))
          .reduce((total, slide) => total + slide.offsetHeight, 0);
        const previousSnap = deck.style.scrollSnapType;

        deck.style.scrollSnapType = "none";
        deck.scrollTo({ top: scrollTop, behavior });
        if (behavior === "auto") {
          deck.scrollTop = scrollTop;
        }
        window.clearTimeout(scrollToTarget.snapTimer);
        scrollToTarget.snapTimer = window.setTimeout(() => {
          deck.style.scrollSnapType = previousSnap;
        }, behavior === "auto" ? 140 : 520);
      }
    }

    function goToSlide(index, behavior = "smooth") {
      const target = deck.querySelector(`[data-index="${Math.max(0, Math.min(slides.length - 1, index))}"]`);
      scrollToTarget(target, behavior);
    }

    function goToHash(behavior = "auto") {
      if (!window.location.hash) {
        return;
      }
      const target = deck.querySelector(window.location.hash);
      if (target) {
        scrollToTarget(target, behavior);
        updateChrome(Number(target.dataset.index));
      }
    }

    renderSlides();
    wireRevealControls();
    updateChrome(0);
    requestAnimationFrame(() => {
      goToHash("auto");
      setTimeout(() => goToHash("auto"), 60);
      setTimeout(() => goToHash("auto"), 300);
    });
    window.addEventListener("load", () => {
      goToHash("auto");
      setTimeout(() => goToHash("auto"), 300);
    });

    const observer = new IntersectionObserver((entries) => {
      const visible = entries
        .filter((entry) => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) {
        updateChrome(Number(visible.target.dataset.index));
      }
    }, { root: deck, threshold: [.58, .72, .86] });

    deck.querySelectorAll(".slide").forEach((slide) => observer.observe(slide));

    document.getElementById("prev-slide").addEventListener("click", () => goToSlide(activeIndex - 1));
    document.getElementById("next-slide").addEventListener("click", () => goToSlide(activeIndex + 1));
    document.getElementById("toggle-notes").addEventListener("click", () => {
      document.body.classList.toggle("show-notes");
    });

    window.addEventListener("hashchange", () => goToHash("smooth"));

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
        event.preventDefault();
        goToSlide(activeIndex + 1);
      }
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        event.preventDefault();
        goToSlide(activeIndex - 1);
      }
      if (event.key.toLowerCase() === "n") {
        document.body.classList.toggle("show-notes");
      }
    });
  </script>
</body>
