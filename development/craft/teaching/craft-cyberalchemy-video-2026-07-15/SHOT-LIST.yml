    transition_out: One unresolved layer slides toward an external route.
    source_refs: [SRC-CAM-001, CLM-007]
    claim_posture: synthesis
    editor_notes: Avoid generic folders or database icons; trace is shown as reasons tied to the artifact.

  - segment_id: VID-CAM-018
    act_id: ACT-07
    title: Some Questions Belong Elsewhere
    duration_seconds: 38
    generation_clip_seconds: 8
    story_job: Earn lifecycle route and ownership through an authority boundary.
    concepts: [route, lifecycle_ownership]
    prior_model: The current builder should solve every discovered problem.
    voice_copy: >-
      Then the trace reveals a different question: is this opening part of a
      regulated fire route? Better hinge geometry cannot answer it. More
      confident prose cannot answer it. The work needs a route to the authority
      that owns the decision. A route names the responsible next lifecycle
      action; ownership names who may validate, decide, promote, or change the
      contract. Good agent work does not absorb every question. It knows when
      evidence must leave the current workbench.
    written_copy:
      - text: CAN THIS WORKBENCH ANSWER THE QUESTION?
        role: ownership_question
        position: upper_left
        display_seconds: 8
      - text: ROUTE THE DECISION. PRESERVE THE EVIDENCE.
        role: principle
        position: lower_left
        display_seconds: 10
    visual_mode: motion_graphic
    visual_prompt: >-
      Clean 16:9 overhead work surface. One unresolved red tracing layer marked
