  - segment_id: VID-CAM-016
    act_id: ACT-06
    title: Stop at Acceptable Residue
    duration_seconds: 34
    generation_clip_seconds: 8
    story_job: Prevent recursive method from becoming endless decomposition.
    concepts: [acceptable_residue, reflection]
    prior_model: A rigorous method removes every imperfection or keeps recursing forever.
    voice_copy: >-
      Craft does not aim for a world with no residue. The corrected door may
      leave a small scuff on the floor. We name it, check whether it threatens
      passage, safety, or future understanding, and decide whether more work is
      worth its cost. Reflection asks what the evidence should change: this
      artifact, the schema, the validation, the route, or perhaps nothing.
      Closure is contextual. We stop when the objective holds with residue we
      can explain and accept.
    written_copy:
      - text: ZERO RESIDUE IS NOT THE TARGET.
        role: correction
        position: upper_left
        display_seconds: 7
      - text: ACCEPTABLE, NAMED, GOVERNED RESIDUE.
        role: stop_condition
        position: lower_left
        display_seconds: 10
    visual_mode: generated_video
    visual_prompt: >-
      Cinematic 16:9 low-angle detail of the corrected natural ash-wood door
      opening freely toward the cool corridor. A small realistic floor scuff
      remains near the swing path, marked by a subtle translucent red tracing
      outline. A hand measures the scuff, records it on paper, then leaves the
      working door open. Clean upper-left and lower-left copy space, no text.
    negative_prompt: >-
      pristine showroom, severe floor damage, hazard tape, giant warning symbol,
      generated writing, dramatic repair, magical disappearance
    continuity_assets: [ASSET-DOOR-01, ASSET-RESIDUE-01]
    camera_and_motion: Low detail shot, measured inspection, then pull focus to open passage.
    sound_direction: Soft door movement, pencil note, room tone continues rather than ending triumphantly.
    transition_in: Small red mark remains as the Craft loop stops.
    transition_out: The paper note becomes one layer in a transparent trace stack.
    source_refs: [SRC-CAM-003]
    claim_posture: source
    editor_notes: The scuff is acceptable only because explicit criteria are shown, not because it is visually small.

  - segment_id: VID-CAM-017
    act_id: ACT-07
    title: Trace Is Operational Memory
    duration_seconds: 36
    generation_clip_seconds: 8
    story_job: Show why reasons must survive the original actor.
    concepts: [trace]
    prior_model: The finished artifact contains enough history to continue the work.
    voice_copy: >-
      A week later, another builder arrives. The door alone cannot explain why
      its swing changed, which repair was rejected, what test exposed the
      conflict, or which residue remains accepted. That remembered path is the
      trace: evidence, decisions, alternatives, gaps, and the next route. Trace
      is not an activity log. It is operational memory. It lets a future person
      recover not only what exists, but why this shape deserves to exist.
    written_copy:
      - text: THE ARTIFACT CANNOT EXPLAIN ITS OWN HISTORY.
        role: tension
        position: upper_right
        display_seconds: 8
      - text: TRACE
        role: term
        position: lower_right
        display_seconds: 4
      - text: EVIDENCE + DECISIONS + REJECTED OPTIONS + NEXT ROUTE
        role: definition
        position: lower_right
        display_seconds: 10
    visual_mode: generated_video
    visual_prompt: >-
      Overhead 16:9 archival work surface. A second builder's hands inspect a
      transparent stack: original off-white doorway blueprint, red failed-route
      tracing sheet, rejected hinge shim, corrected swing diagram, local test
      strip, upper passage proof and small accepted-scuff note. Each layer is
