  - segment_id: VID-CAM-015
    act_id: ACT-06
    title: Name the Engine Craft
    duration_seconds: 34
    generation_clip_seconds: 8
    story_job: Name Craft only after its recursive mechanism is visible.
    concepts: [craft, craft_cycle]
    prior_model: Craft is a workflow checklist or better prompting technique.
    voice_copy: >-
      Now we can name the engine. Craft is the recursive method for turning an
      intention into a stable artifact by moving between representation and
      result until a coherent unit can be executed, validated, and recomposed
      with acceptable residue. In practice, the rhythm often looks like define,
      design, plan, execute, validate, reflect. But the verbs are not the point.
      The return is the point. Each result can revise what the next cycle knows.
    written_copy:
      - text: CRAFT
        role: term
        position: center
        display_seconds: 5
      - text: MAKING THAT LETS THE RESULT REVISE THE MODEL.
        role: compressed_definition
        position: lower_center
        display_seconds: 10
      - text: DEFINE  DESIGN  PLAN  EXECUTE  VALIDATE  REFLECT
        role: cycle
        position: lower_center
        display_seconds: 8
    visual_mode: motion_graphic
    visual_prompt: >-
      16:9 overhead visual made from the same doorway blueprint, real ash-wood
      edge sample, red residue tracing layer and dark-green return thread. Arrange
      them as a physical recursive loop with six unlabeled stations, where the
      result side sends one thread back to the representation side. Neutral white
      field, clean center and lower space for editorial typography, no generated
      text, no circular corporate infographic.
    negative_prompt: >-
      corporate cycle diagram, arrows with labels, glossy icons, gradient ring,
      purple palette, text, infinity symbol, magical alchemy imagery
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-RESIDUE-01, ASSET-THREAD-01]
    camera_and_motion: Freeze passage proof, pull overhead, arrange evidence into a returning loop.
    sound_direction: Six quiet tactile beats; final beat routes back rather than resolving upward.
