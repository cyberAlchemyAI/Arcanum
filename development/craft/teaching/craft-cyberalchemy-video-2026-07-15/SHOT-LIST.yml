    negative_prompt: >-
      scrapbook decoration, sticky-note wall, readable handwriting, labels,
      fake database UI, clutter, extra hands, vintage sepia
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-RESIDUE-01, ASSET-THREAD-01]
    camera_and_motion: Layers separate in causal order, then align into one navigable stack.
    sound_direction: Paper lifts, hardware tap, quiet page-settle rhythm.
