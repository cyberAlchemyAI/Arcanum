package:
  package_id: craft-cyberalchemy-video-2026-07-15
  title: "How Do You Know What You Built Is Right?"
  subtitle: "Craft and the CyberAlchemy Method"
  status: full_draft
  transport: video_essay_model_input_package
  target_public: curious technical builders who use or encounter AI agents
  runtime_target_seconds: 706
  voice_target_words:
    min: 1500
    max: 1750
  aspect_ratio: "16:9"
  human_gate:
    status: approved
    approved_on: "2026-07-15"
    approved_surface: VOICE-AUDITION.md
  source_authority:
    - arcanum/framework/CYBERALCHEMY-METHOD.md
    - arcanum/arcana/craft/SKILL.md
    - arcanum/development/craft/CRAFT-INITIAL-DEFINITION.md
    - arcanum/development/craft/CRAFT-FORMAL-FOUNDATIONS.md
  source_trace: SOURCE-TRACE.md
  canonical_posture: non-canonical working production material

voice_profile:
  delivery: curious, warm, exact, conversational
  pace_words_per_minute: 140
  pause_policy: short pause after questions and before earned definitions
  pronunciation:
    CyberAlchemy: "cyber al-kuh-mee"
    schema: "skee-muh"
    recomposition: "ree-kom-puh-zish-un"
  exclusions:
    - announcer voice
    - breathless pacing
    - theatrical mystery
    - sales cadence

assets:
  ASSET-DOOR-01: >-
    Natural ash-wood interior door with simple contemporary joinery, matte brass
    lever, left-side hinges, visible fine grain, no ornament.
  ASSET-WALL-01: >-
    White plaster dividing wall between a warm daylight workshop and a cool gray
    corridor, with a physically impossible concrete blockage immediately behind
    the initial door opening.
  ASSET-BLUEPRINT-01: >-
    Off-white drafting paper with graphite architectural lines and blue pencil
    construction marks; all exact typography is added later in editorial.
  ASSET-RESIDUE-01: >-
    Translucent red tracing-paper line that marks one specific failed route or
    omitted relation; never used as generic danger decoration.
  ASSET-THREAD-01: >-
    Thin dark-green thread used only to show a validated result returning to its
    upper context.
  ASSET-APP-01: >-
    Quiet neutral project dashboard with realistic but intentionally unreadable
    interface blocks; exact interface text is added later in editorial.

acts:
  - act_id: ACT-01
    title: The Perfect Wrong Door
  - act_id: ACT-02
    title: The Invisible Model
  - act_id: ACT-03
    title: The Translation
  - act_id: ACT-04
    title: Let the Artifact Answer
  - act_id: ACT-05
    title: A Problem Inside the Problem
  - act_id: ACT-06
    title: Name the Engine
  - act_id: ACT-07
    title: Make the Learning Survive
  - act_id: ACT-08
    title: The Larger Turn

segments:
  - segment_id: VID-CAM-001
    act_id: ACT-01
    title: The Impossible Door
    duration_seconds: 13
    generation_clip_seconds: 8
    story_job: Ask whether perfect work can still be wrong.
    concepts: [intention]
    prior_model: A well-made object is necessarily the right object.
    voice_copy: >-
      Can a perfectly built door be wrong? Imagine this one is straight, smooth,
      and exact. The latch catches. The hinges move. And when we install it, it
      opens into a wall.
    written_copy:
      - text: Can a perfectly built door be wrong?
        role: opening_question
        position: center
        display_seconds: 7
    visual_mode: generated_video
    visual_prompt: >-
      Cinematic documentary close-up, 16:9. Inspect a flawless natural ash-wood
      interior door with simple contemporary joinery, matte brass lever and
      left-side hinges in warm workshop daylight. The camera glides across the
      grain, then the door opens smoothly to reveal solid white concrete only
      centimeters behind it. Physically believable materials, restrained color,
      clean center framing, no on-image text, eight-second continuous shot.
    negative_prompt: >-
      fantasy door, ornate carving, horror mood, impossible geometry before the
      reveal, extra doors, logos, captions, generated typography, dramatic fog,
      particles, lens dirt, distorted hardware
    continuity_assets: [ASSET-DOOR-01, ASSET-WALL-01]
    camera_and_motion: Slow macro glide, then a precise ninety-degree reveal.
    sound_direction: Quiet workshop room tone; clean latch click; muted concrete stop.
    transition_in: Fade up from black on wood grain.
    transition_out: Hold one beat on the blocked opening.
    source_refs: [CLM-008]
    claim_posture: metaphor
    editor_notes: Add the question in editorial after the first second; preserve one silent beat after the reveal.

  - segment_id: VID-CAM-002
    act_id: ACT-01
    title: Every Local Check Passes
    duration_seconds: 20
    generation_clip_seconds: 8
    story_job: Establish local correctness before challenging its boundary.
    concepts: [local_correctness]
    prior_model: Passing component tests proves the whole result.
    voice_copy: >-
      Nothing about the door is badly made. Its dimensions match the drawing.
      Its edges are square. The handle turns. If you inspect only the object and
      the instructions that produced it, the work looks finished. Every local
      check says yes.
    written_copy:
      - text: DIMENSIONS
        role: check_label
        position: lower_left
        display_seconds: 4
      - text: HINGES
        role: check_label
        position: lower_left
        display_seconds: 4
      - text: LATCH
        role: check_label
        position: lower_left
        display_seconds: 4
      - text: ALL PASS
        role: local_verdict
        position: center
        display_seconds: 5
    visual_mode: generated_video
    visual_prompt: >-
      Cinematic 16:9 inspection montage built as one smooth macro camera move
      across the same natural ash-wood door: steel square aligned to the edge,
      left hinge rotating cleanly, matte brass latch engaging, carpenter hand
      checking a graphite blueprint. Warm neutral workshop, physically accurate
      tools and hardware, clean lower-left negative space for editorial labels,
      no rendered words, eight-second clip suitable for three editorial crops.
    negative_prompt: >-
      text, numbers, logos, warped ruler, malformed hands, extra fingers, ornate
      wood, construction accident, red warning graphics, fantasy lighting
    continuity_assets: [ASSET-DOOR-01, ASSET-BLUEPRINT-01]
    camera_and_motion: Three match-cut macro crops from dimensions to hinge to latch.
    sound_direction: Soft pencil tick, hinge movement, latch click; no success chime.
    transition_in: Match the blocked door's brass handle.
    transition_out: Pull back before the wall context returns.
    source_refs: [CLM-001]
    claim_posture: synthesis
    editor_notes: Checks appear sequentially; never show the full-system verdict here.

  - segment_id: VID-CAM-003
    act_id: ACT-01
    title: The Request Was Not the Intention
    duration_seconds: 24
    generation_clip_seconds: 8
    story_job: Separate the requested artifact from the desired change.
    concepts: [intention, objective]
    prior_model: The requested noun fully expresses the desired outcome.
    voice_copy: >-
      The request said, build a door. But the intention was never a door. The
      intention was to let a person move from this room to that corridor. An
      intention is a desired change, not yet a complete account of how to make
      it real. The objective makes that change discussable: create a usable
      passage between these spaces.
    written_copy:
      - text: BUILD A DOOR
        role: request
        position: center
        display_seconds: 6
      - text: CREATE A USABLE PASSAGE
        role: objective
        position: center
        display_seconds: 9
    visual_mode: motion_graphic
    visual_prompt: >-
      Top-down 16:9 architectural scene on off-white drafting paper. A graphite
      outline of a door sits in a wall. A simple human route line begins in the
      warm room and attempts to reach the cool gray corridor but stops at the
      blocked doorway. Keep the drawing free of words and numbers, reserve the
      center for editorial text, realistic paper texture, restrained red route
      accent only at the blockage.
    negative_prompt: >-
      legible handwriting, generated labels, decorative blueprint symbols,
      complex floor plan, multiple route lines, neon glow, gradients, 3D text
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-RESIDUE-01]
    camera_and_motion: Request text dissolves; route line continues and becomes the visual subject.
    sound_direction: Paper lift, pencil line, brief silence before the objective.
    transition_in: Door outline flattens from physical object into drawing.
    transition_out: Route line pushes camera outward to reveal more context.
    source_refs: [CLM-001, SRC-CAM-001]
    claim_posture: synthesis
    editor_notes: The objective must replace, not sit beside, the request.

  - segment_id: VID-CAM-004
    act_id: ACT-02
    title: Correctness Has a Boundary
    duration_seconds: 39
    generation_clip_seconds: 8
    story_job: Show that facts become relevant under an objective and boundary.
    concepts: [boundary, context, objective]
    prior_model: Context means adding every available fact.
    voice_copy: >-
      Once the objective changes, the world around the door comes back into
      view. Which way do people approach? How wide is the corridor? What happens
      when someone carries a box? Is this part of a fire route? A boundary is
      not every fact we could collect. It is the set of conditions inside which
      our claim is supposed to hold. Change the boundary, and a correct answer
      can become wrong. The same door can be valid as a carpentry object and
      invalid as a passage because those claims live inside different boundaries.
    written_copy:
      - text: CORRECT FOR WHAT?
        role: boundary_question
        position: upper_left
        display_seconds: 7
      - text: A BOUNDARY DECIDES WHERE THE CLAIM MUST HOLD.
        role: definition
        position: lower_left
        display_seconds: 10
    visual_mode: motion_graphic
    visual_prompt: >-
      Clean 16:9 top-down floor-plan animation base on off-white paper. Begin
      close on one doorway, then reveal warm room, cool corridor, direction of
      foot traffic, a box-sized clearance shape, and a fire-exit route as distinct
      graphical relations. No text or numbers. Use graphite, muted blue, one red
      blocked route, and ample upper-left negative space for editorial copy.
    negative_prompt: >-
      busy architectural plan, illegible labels, decorative icons, color-coded
      legend, fake technical numbers, gradients, glowing arrows, clutter
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-RESIDUE-01]
    camera_and_motion: Continuous pullback; each relation appears only when named.
    sound_direction: Subtle widening room tone; one low pulse as the fire route appears.
    transition_in: Continue the route line from the prior segment.
    transition_out: Freeze the full plan beneath a sheet of tracing paper.
    source_refs: [CLM-001, SRC-CAM-001]
    claim_posture: synthesis
    editor_notes: Do not use generic context-cloud imagery; every fact must alter the passage claim.

  - segment_id: VID-CAM-005
    act_id: ACT-02
    title: The Schema Selects
    duration_seconds: 36
    generation_clip_seconds: 8
    story_job: Earn schema by showing selected and omitted distinctions.
    concepts: [schema]
    prior_model: A schema is a neutral description or file format.
    voice_copy: >-
      Now look again at the original drawing. It contains width, height, hinge
      positions, and material. It does not contain the direction of passage or
      the concrete behind the swing. This chosen structure is a schema: a way of
      making selected distinctions in an intention legible enough to translate.
      A schema is useful precisely because it leaves things out. But that means
      it is never the thing itself, and never neutral. It is chosen by someone,
      for some purpose. Another observer with another objective might select a
      different, equally legitimate structure.
    written_copy:
      - text: WHAT DID THE DRAWING PRESERVE?
        role: inspection_question
        position: upper_right
        display_seconds: 7
      - text: SCHEMA
        role: term
        position: lower_right
        display_seconds: 4
      - text: A CHOSEN STRUCTURE THAT MAKES SOME DISTINCTIONS TRANSLATABLE.
        role: definition
        position: lower_right
        display_seconds: 12
    visual_mode: motion_graphic
    visual_prompt: >-
      Overhead 16:9 view of an off-white architectural drawing for the natural
      ash-wood door. Graphite dimensions, hinge marks and material swatch are
      crisp visual features, while the passage direction and concrete blockage
      remain absent as faint empty regions. A translucent selection frame moves
      across included relations. Reserve clean right-side space; generate no
      readable text, numbers or labels.
    negative_prompt: >-
      generated typography, fake dimensions, magical hologram, glowing data,
      dense engineering annotations, purple palette, decorative geometry
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-DOOR-01]
    camera_and_motion: Overhead selection scan; empty omitted region becomes conspicuous only at the end.
    sound_direction: Graphite strokes; soft paper mask sound as omissions appear.
    transition_in: Tracing paper settles over the full context.
    transition_out: One graphite line exits the page into the build chain.
    source_refs: [SRC-CAM-003, SRC-EXT-003]
    claim_posture: analogy
    editor_notes: Use Spivak only on the source card, not as spoken proof of the broader Craft meaning.

  - segment_id: VID-CAM-006
    act_id: ACT-03
    title: Translation Is a Composite
    duration_seconds: 34
    generation_clip_seconds: 8
    story_job: Replace the single black-box translator with a visible chain.
    concepts: [translator]
    prior_model: The prompt or model alone turns intention into artifact.
    voice_copy: >-
      The drawing does not become a door by itself. Structure passes through a
      builder, tools, materials, measurements, vocabulary, attention, and
      feedback. With AI, add the model, its training, the selected context, and
      the harness around it. Craft calls this the translator. Not one magical
      box, and not the language model alone, but the composite process that
      tries to preserve structure while moving from representation to result.
      Each link can preserve a relation, flatten it, or introduce a new one.
    written_copy:
      - text: THE TRANSLATOR IS THE WHOLE CHAIN.
        role: reveal
        position: center
        display_seconds: 10
      - text: MODEL + CONTEXT + TOOLS + FEEDBACK
        role: components
        position: lower_center
        display_seconds: 9
    visual_mode: motion_graphic
    visual_prompt: >-
      Horizontal 16:9 process-table scene with one graphite line leaving an
      architectural drawing and passing through clearly different physical
      stations: human hand, measuring tool, material sample, neutral computer
      model node, selected document stack, validation gauge, then natural
      ash-wood door. No text or logos. The line retains some relations and drops
      one faint branch. Clean center composition, restrained documentary style.
    negative_prompt: >-
      robot head, glowing AI brain, magic particles, humanoid machine, cyberpunk,
      labels, logos, fake UI, purple-blue gradient, chaotic flowchart
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-DOOR-01]
    camera_and_motion: Sideways tracking shot following one line through each station.
    sound_direction: Each station contributes one tactile sound; no futuristic whoosh.
    transition_in: Follow the graphite line out of the blueprint.
    transition_out: The line becomes the physical edge of the door.
    source_refs: [SRC-CAM-003]
    claim_posture: source
    editor_notes: Editorial labels may identify the chain only after the viewer sees the stations.

  - segment_id: VID-CAM-007
    act_id: ACT-03
    title: The Artifact Answers Back
    duration_seconds: 28
    generation_clip_seconds: 8
    story_job: Define artifact through resistance and inspectability.
    concepts: [artifact]
    prior_model: The artifact is merely the final output.
    voice_copy: >-
      Then the line becomes wood. Something exists that can be touched, used,
      inspected, and challenged. That is the artifact: the concrete result of
      the current translation. It is not proof that the intention survived.
      Its deeper value is that it can now resist our story about it. Before the
      artifact, the model was plausible. After the artifact, the wall gets a
      vote.
    written_copy:
      - text: ARTIFACT
        role: term
        position: upper_left
        display_seconds: 4
      - text: THE RESULT THAT CAN NOW ANSWER BACK.
        role: definition
        position: upper_left
        display_seconds: 10
    visual_mode: generated_video
    visual_prompt: >-
      Cinematic 16:9 transformation shot. A graphite edge on off-white drafting
      paper aligns exactly with the edge of the same natural ash-wood door, then
      the paper slides away and a human hand pushes the real door into the solid
      concrete blockage. Warm workshop, cool corridor glimpsed at the side,
      upper-left negative space, physically grounded, no text.
    negative_prompt: >-
      magical morph, liquid wood, surreal wall, extra limbs, malformed hand,
      text, logo, dramatic sparks, fantasy portal
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-DOOR-01, ASSET-WALL-01]
    camera_and_motion: Match dissolve from drawn line to wood edge; fixed camera for impact.
    sound_direction: Paper slide, palm on wood, low physical contact with concrete.
    transition_in: Graphite line thickens into the door edge.
    transition_out: Cut on contact to a test bench split view.
    source_refs: [CLM-002]
    claim_posture: synthesis
    editor_notes: Let the phrase "the wall gets a vote" land on the physical stop.

  - segment_id: VID-CAM-008
    act_id: ACT-04
    title: Two Kinds of Validation
    duration_seconds: 33
    generation_clip_seconds: 8
    story_job: Show that a test inherits the boundary of what it compares.
    concepts: [validation, objective]
    prior_model: Validation is one final pass-fail event.
    voice_copy: >-
      So we test again. Does the hinge move? Yes. Does the latch catch? Yes.
      Does the finished door match the drawing? Yes. Can a person use it to
      reach the corridor? No. Validation is the comparison between an artifact,
      its schema, its objective, and the conditions that govern the claim. A
      test can be perfectly honest and still too narrow. The component passed.
      The passage failed.
    written_copy:
      - text: THE ARTIFACT CAN PASS.
        role: contrast
        position: left
        display_seconds: 7
      - text: THE INTENT CAN STILL FAIL.
        role: contrast
        position: right
        display_seconds: 8
      - text: VALIDATION COMPARES RESULT, MODEL, OBJECTIVE, AND BOUNDARY.
        role: definition
        position: lower_center
        display_seconds: 11
    visual_mode: motion_graphic
    visual_prompt: >-
      Precise 16:9 split composition. Left side shows macro green mechanical
      evidence from the natural ash-wood door: hinge rotation, latch engagement,
      edge aligned to drawing. Right side shows a human route line stopped by
      concrete behind the doorway, marked by one translucent red trace. Neutral
      white background, ample lower-center copy space, no generated words.
    negative_prompt: >-
      giant check marks, giant red X, quiz-show graphics, text, scoreboards,
      fake dashboards, cartoon style, glowing neon
    continuity_assets: [ASSET-DOOR-01, ASSET-WALL-01, ASSET-RESIDUE-01]
    camera_and_motion: Left evidence enters one item at a time; right route remains blocked.
    sound_direction: Three tactile pass sounds, then room tone drops on the failed passage.
    transition_in: Door impact becomes center divider.
    transition_out: Green evidence fades; red route remains.
    source_refs: [CLM-001, CLM-002, SRC-CAM-003]
    claim_posture: synthesis
    editor_notes: Preserve the approved tension wording exactly in the first two copy moments.

  - segment_id: VID-CAM-009
    act_id: ACT-04
    title: The Remainder Has Information
    duration_seconds: 34
    generation_clip_seconds: 8
    story_job: Earn residue as typed, actionable mismatch.
    concepts: [residue]
    prior_model: Mismatch is waste to erase or generic failure.
    voice_copy: >-
      What remains after that comparison is not just failure. The blocked route
      tells us something specific: our representation preserved the door and
      lost the passage. Craft calls a meaningful remainder like this residue.
      Residue can be mismatch, ambiguity, a missing relation, an unexplained
      obligation, or a validation gap. It is not automatically good. It is
      useful when it tells us what our current way of seeing could not hold. We
      still have to classify it before deciding whether to repair, accept,
      block, or route it.
    written_copy:
      - text: RESIDUE
        role: term
        position: upper_right
        display_seconds: 4
      - text: THE MEANINGFUL REMAINDER AFTER TRANSLATION AND CHECKING.
        role: definition
        position: upper_right
        display_seconds: 11
    visual_mode: generated_video
    visual_prompt: >-
      Overhead 16:9 documentary shot of translucent red tracing paper laid over
      the doorway blueprint. A single red line precisely traces the route that
      should pass through the door but terminates at the omitted concrete wall.
      A hand lifts the drawing while the red tracing layer remains, making the
      mismatch independently inspectable. Clean upper-right negative space, no
      text or decorative warning symbols.
    negative_prompt: >-
      blood, hazard tape, giant warning icon, random scribbles, multiple red
      lines, labels, handwriting, magical glow, cluttered desk
    continuity_assets: [ASSET-BLUEPRINT-01, ASSET-RESIDUE-01]
    camera_and_motion: Locked overhead shot; base drawing moves, exact residue layer remains.
    sound_direction: Thin paper friction; one quiet sustained tone under the definition.
    transition_in: Failed route expands into red tracing paper.
    transition_out: A cardboard box enters the physical doorway along that route.
    source_refs: [CLM-003, SRC-CAM-003]
    claim_posture: source
    editor_notes: Do not equate residue with an error code; keep it relational.

  - segment_id: VID-CAM-010
    act_id: ACT-04
    title: Tension Makes the Hidden Relation Visible
    duration_seconds: 25
    generation_clip_seconds: 8
    story_job: Demonstrate structured tension as an evidentiary action.
    concepts: [structured_tension]
    prior_model: Critique means adding negative opinion after the work.
    voice_copy: >-
      We can search for residue deliberately. Ask someone to carry a box through
      the opening, and a conflict that the static inspection missed becomes
      visible. CyberAlchemy calls this structured tension: a purposeful challenge
      to the artifact, boundary, or claim. Not criticism for atmosphere. A good
      tension changes what we can know.
    written_copy:
      - text: WHAT WOULD MAKE THIS CLAIM BREAK?
        role: tension_question
        position: upper_left
        display_seconds: 8
      - text: STRUCTURED TENSION
        role: term
        position: lower_left
        display_seconds: 6
    visual_mode: generated_video
    visual_prompt: >-
      Realistic 16:9 medium-wide shot in the warm workshop. One adult carries a
      plain rectangular cardboard box toward the natural ash-wood doorway. The
      door opens smoothly but traps the box against the nearby concrete wall,
      revealing the clearance conflict. Natural body proportions, face out of
      focus, clean upper-left copy space, no slapstick, no text.
    negative_prompt: >-
      injury, comedy fall, crushed person, deformed hands, extra fingers,
      branded box, captions, dramatic alarm, multiple people
    continuity_assets: [ASSET-DOOR-01, ASSET-WALL-01]
    camera_and_motion: Fixed medium-wide witness shot; action supplies the critique.
    sound_direction: Footsteps, cardboard contact, no comic sound effect.
    transition_in: Box edge wipes from the red route line.
    transition_out: Cut to close-up of a screwdriver at the hinge.
    source_refs: [SRC-CAM-001]
    claim_posture: source
    editor_notes: Viewer must see the action before the term appears.

  - segment_id: VID-CAM-011
    act_id: ACT-05
    title: The Closest Repair Is Not Always the Repair
    duration_seconds: 27
    generation_clip_seconds: 8
    story_job: Reject repair activity that does not reduce the named residue.
    concepts: [local_repair, residue]
    prior_model: Fixing the nearest visible component necessarily solves the failure.
    voice_copy: >-
      The tempting response is to repair the nearest visible part. Tighten the
      hinge. Shift it three millimeters. Sand the edge. The door moves a little
      better, but the route is still blocked. Activity is not evidence of
      progress. A repair matters only if the named residue decreases under the
      objective that exposed it.
    written_copy:
      - text: DID THE RESIDUE DECREASE?
        role: repair_check
        position: center
        display_seconds: 9
    visual_mode: generated_video
    visual_prompt: >-
      Cinematic 16:9 macro repair sequence on the same natural ash-wood door:
      screwdriver tightens left hinge, thin shim is inserted, edge is lightly
      sanded. End on the unchanged red route line still terminating at concrete.
      Physically accurate hand tools, restrained warm light, center negative
      space at the end, no text.
    negative_prompt: >-
      power-tool sparks, dangerous repair, malformed hands, exaggerated wood
      dust, extra hardware, warning symbols, labels, time-lapse blur
    continuity_assets: [ASSET-DOOR-01, ASSET-WALL-01, ASSET-RESIDUE-01]
    camera_and_motion: Three quick repair inserts, then repeat the original blocked-route angle.
    sound_direction: Screwdriver turns, soft sanding, then unchanged concrete contact.
    transition_in: Cut on box contact to screwdriver contact.
    transition_out: Pull the hinge, door edge, wall and clearance onto a workbench.
    source_refs: [CLM-004]
    claim_posture: synthesis
    editor_notes: The repeated blocked angle is the evidence; avoid implying repair-first is universal Craft law.

  - segment_id: VID-CAM-012
    act_id: ACT-05
    title: Smallest Does Not Mean Coherent
    duration_seconds: 40
    generation_clip_seconds: 8
    story_job: Earn the smallest coherent unit through a bounded isolation.
    concepts: [smallest_coherent_unit]
    prior_model: Good decomposition means making tasks as small as possible.
    voice_copy: >-
      We need a smaller view, but not the smallest possible one. A hinge by
      itself has no passage, no wall, and no reason to swing one way rather than
      another. The smallest coherent unit keeps enough relation to mean
      something: one primary responsibility, its inputs and outputs, a local
      test, a failure behavior, and a path back to the whole. Here, that unit is
      the swing problem: hinge, door edge, wall clearance, direction of travel,
      and the interface by which the answer will return.
    written_copy:
      - text: TOO SMALL LOSES MEANING.
        role: contrast
        position: left
        display_seconds: 6
      - text: TOO LARGE LOSES FIDELITY.
        role: contrast
        position: right
        display_seconds: 6
      - text: SMALLEST COHERENT UNIT
        role: term
        position: center
        display_seconds: 5
      - text: SMALL ENOUGH TO HANDLE. WHOLE ENOUGH TO RETURN.
        role: definition
        position: lower_center
        display_seconds: 10
    visual_mode: motion_graphic
    visual_prompt: >-
      Top-down 16:9 bounded workbench on neutral white. Arrange only five
      physically clear elements from the door system: left hinge, ash-wood door
      edge, short white wall section, transparent swing-clearance arc, and two
      dark-green return connection points. First isolate the hinge alone, then
      widen to include the coherent relation set. No labels, no words, no nested
      decorative cards, ample center and lower-center copy space.
    negative_prompt: >-
      random machine parts, exploded technical clutter, text, labels, floating
      icons, neon schematic, infinite nesting, jigsaw metaphor
    continuity_assets: [ASSET-DOOR-01, ASSET-WALL-01, ASSET-THREAD-01]
    camera_and_motion: Overhead extraction; frame widens only until meaning and return points are visible.
    sound_direction: Single hardware placement sounds; low room tone; no assembly montage music.
    transition_in: Physical components lift from doorway into overhead view.
