  - segment_id: VID-CAM-019
    act_id: ACT-07
    title: CyberAlchemy Makes the Loop Governable
    duration_seconds: 46
    generation_clip_seconds: 8
    story_job: Define CyberAlchemy and distinguish it from Craft.
    concepts: [cyberalchemy, discovery, tension, navigability, observability, route]
    prior_model: CyberAlchemy is another step in the Craft loop or a grand name for automation.
    voice_copy: >-
      Now zoom out once more. Craft gives us the recursive engine of making:
      represent, translate, inspect, learn, repair, return. CyberAlchemy governs
      the conditions around that engine. It keeps the objective and artifact
      visible. It requires discovery before premature closure, tension before
      brittle confidence, a navigable artifact instead of a vanishing answer,
      validation instead of vibes, trace instead of forgotten reasons, and a
      route instead of silent authority. Craft explains how making can become a
      way of knowing. CyberAlchemy helps that knowledge survive review, handoff,
      and repeated use. It does not remove human judgment. It makes the places
      where judgment enters easier to inspect.
    written_copy:
      - text: CYBERALCHEMY
        role: term
        position: center
        display_seconds: 5
      - text: GOVERNED SYNTHESIS THROUGH ARTIFACTS.
        role: compressed_definition
