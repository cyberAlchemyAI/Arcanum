  - segment_id: VID-CAM-013
    act_id: ACT-05
    title: Residue Becomes a New Layer
    duration_seconds: 34
    generation_clip_seconds: 8
    story_job: Show when a provisional Craft layer is justified.
    concepts: [craft_layer, reflection_tower]
    prior_model: Every subtask or folder is automatically a meaningful layer.
    voice_copy: >-
      The upper problem could not close responsibly with another tiny adjustment.
      So the residue becomes the starting evidence for a new, bounded layer. It
      receives its own objective, representation, artifact target, validation,
      and return path. That is a Craft layer. Not every subtask earns one. The
      layer is provisional. It is justified only if it makes the residue more
      explainable, more testable, and ultimately smaller.
    written_copy:
