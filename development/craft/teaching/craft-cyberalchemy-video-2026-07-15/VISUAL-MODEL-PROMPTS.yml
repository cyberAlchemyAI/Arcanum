prompt_schema_version: '1.0'
package_id: craft-cyberalchemy-video-2026-07-15
aspect_ratio: '16:9'
editorial_text_policy: Generate no precise typography; add written_copy during editing.
assets:
  ASSET-DOOR-01: Natural ash-wood interior door with simple contemporary joinery, matte brass lever, left-side
    hinges, visible fine grain, no ornament.
  ASSET-WALL-01: White plaster dividing wall between a warm daylight workshop and a cool gray corridor,
    with a physically impossible concrete blockage immediately behind the initial door opening.
  ASSET-BLUEPRINT-01: Off-white drafting paper with graphite architectural lines and blue pencil construction
    marks; all exact typography is added later in editorial.
  ASSET-RESIDUE-01: Translucent red tracing-paper line that marks one specific failed route or omitted
    relation; never used as generic danger decoration.
  ASSET-THREAD-01: Thin dark-green thread used only to show a validated result returning to its upper
    context.
  ASSET-APP-01: Quiet neutral project dashboard with realistic but intentionally unreadable interface
    blocks; exact interface text is added later in editorial.
prompts:
- segment_id: VID-CAM-001
  title: The Impossible Door
  visual_mode: generated_video
  timeline_duration_seconds: 13
  generation_clip_seconds: 8
  continuity_assets:
  - ASSET-DOOR-01
  - ASSET-WALL-01
  prompt: Cinematic documentary close-up, 16:9. Inspect a flawless natural ash-wood interior door with
    simple contemporary joinery, matte brass lever and left-side hinges in warm workshop daylight. The
    camera glides across the grain, then the door opens smoothly to reveal solid white concrete only centimeters
    behind it. Physically believable materials, restrained color, clean center framing, no on-image text,
    eight-second continuous shot.
  negative_prompt: fantasy door, ornate carving, horror mood, impossible geometry before the reveal, extra
    doors, logos, captions, generated typography, dramatic fog, particles, lens dirt, distorted hardware
  camera_and_motion: Slow macro glide, then a precise ninety-degree reveal.
  transition_in: Fade up from black on wood grain.
  transition_out: Hold one beat on the blocked opening.
- segment_id: VID-CAM-002
  title: Every Local Check Passes
  visual_mode: generated_video
  timeline_duration_seconds: 20
  generation_clip_seconds: 8
  continuity_assets:
  - ASSET-DOOR-01
  - ASSET-BLUEPRINT-01
  prompt: 'Cinematic 16:9 inspection montage built as one smooth macro camera move across the same natural
    ash-wood door: steel square aligned to the edge, left hinge rotating cleanly, matte brass latch engaging,
    carpenter hand checking a graphite blueprint. Warm neutral workshop, physically accurate tools and
    hardware, clean lower-left negative space for editorial labels, no rendered words, eight-second clip
    suitable for three editorial crops.'
  negative_prompt: text, numbers, logos, warped ruler, malformed hands, extra fingers, ornate wood, construction
    accident, red warning graphics, fantasy lighting
  camera_and_motion: Three match-cut macro crops from dimensions to hinge to latch.
  transition_in: Match the blocked door's brass handle.
  transition_out: Pull back before the wall context returns.
- segment_id: VID-CAM-003
  title: The Request Was Not the Intention
  visual_mode: motion_graphic
  timeline_duration_seconds: 24
  generation_clip_seconds: 8
  continuity_assets:
  - ASSET-BLUEPRINT-01
  - ASSET-RESIDUE-01
  prompt: Top-down 16:9 architectural scene on off-white drafting paper. A graphite outline of a door
    sits in a wall. A simple human route line begins in the warm room and attempts to reach the cool gray
    corridor but stops at the blocked doorway. Keep the drawing free of words and numbers, reserve the
    center for editorial text, realistic paper texture, restrained red route accent only at the blockage.
  negative_prompt: legible handwriting, generated labels, decorative blueprint symbols, complex floor
    plan, multiple route lines, neon glow, gradients, 3D text
  camera_and_motion: Request text dissolves; route line continues and becomes the visual subject.
  transition_in: Door outline flattens from physical object into drawing.
  transition_out: Route line pushes camera outward to reveal more context.
