ntinues and becomes the visual subject.", "sound_direction": "Paper lift, pencil line, brief silence before the objective.", "transition_in": "Door outline flattens from physical object into drawing.", "transition_out": "Route line pushes camera outward to reveal more context.", "source_refs": ["CLM-001", "SRC-CAM-001"], "claim_posture": "synthesis", "editor_notes": "The objective must replace, not sit beside, the request."}, {"segment_id": "VID-CAM-004", "act_id": "ACT-02", "title": "Correctness Has a Boundary", "duration_seconds": 39, "generation_clip_seconds": 8, "story_job": "Show that facts become relevant under an objective and boundary.", "concepts": ["boundary", "context", "objective"], "prior_model": "Context means adding every available fact.", "voice_copy": "Once the objective changes, the world around the door comes back into view. Which way do people approach? How wide is the corridor? What happens when someone carries a box? Is this part of a fire route? A boundary is not every fact we could collect. It is the set of conditions inside which our claim is supposed to hold. Change the boundary, and a correct answer can become wrong. The same door can be valid as a carpentry object and invalid as a passage because those claims live inside different boundaries.", "written_copy": [{"text": "CORRECT FOR WHAT?", "role": "boundary_question", "position": "upper_left", "display_seconds": 7}, {"text": "A BOUNDARY DECIDES WHERE THE CLAIM MUST HOLD.", "role": "definition", "position": "lower_left", "display_seconds": 10}], "visual_mode": "motion_graphic", "visual_prompt": "Clean 16:9 top-down floor-plan animation base on off-white paper. Begin close on one doorway, then reveal warm room, cool corridor, direction of foot traffic, a box-sized clearance shape, and a fire-exit route as distinct graphical relations. No text or numbers. Use graphite, muted blue, one red blocked route, and ample upper-left negative space for editorial copy.", "negative_prompt": "busy architectural plan, illegible labels, decorative icons, color-coded legend, fake technical numbers, gradients, glowing arrows, clutter", "continuity_assets": ["ASSET-BLUEPRINT-01", "ASSET-RESIDUE-01"], "camera_and_motion": "Continuous pullback; each relation appears only when named.", "sound_direction": "Subtle widening room tone; one low pulse as the fire route appears.", "transition_in": "Continue the route line from the prior segment.", "transition_out": "Freeze the full plan beneath a sheet of tracing paper.", "source_refs": ["CLM-001", "SRC-CAM-001"], "claim_posture": "synthesis", "editor_notes": "Do not use generic context-cloud imagery; every fact must alter the passage claim."}, {"segment_id": "VID-CAM-005", "act_id": "ACT-02", "title": "The Schema Selects", "duration_seconds": 36, "generation_clip_seconds": 8, "story_job": "Earn schema by showing selected and omitted distinctions.", "concepts": ["schema"], "prior_model": "A schema is a neutral description or file format.", "voice_copy": "Now look again at the original drawing. It contains width, height, hinge positions, and material. It does not contain the direction of passage or the concrete behind the swing. This chosen structure is a schema: a way of making selected distinctions in an intention legible enough to translate. A schema is useful precisely because it leaves things out. But that means it is never the thing itself, and never neutral. It is chosen by someone, for some purpose. Another observer with another objective might select a different, equally legitimate structure.", "written_copy": [{"text": "WHAT DID THE DRAWING PRESERVE?", "role": "inspection_question", "position": "upper_right", "display_seconds": 7}, {"text": "SCHEMA", "role": "term", "position": "lower_right", "display_seconds": 4}, {"text": "A CHOSEN STRUCTURE THAT MAKES SOME DISTINCTIONS TRANSLATABLE.", "role": "definition", "position": "lower_right", "display_seconds": 12}], "visual_mode": "motion_graphic", "visual_prompt": "Overhead : "Better making begins with a more precise command.", "voice_copy": "So the next time you ask a person or an AI to build something, do not ask only how to say the command more precisely. Ask what must remain true when the idea becomes real. Ask how the artifact can answer back. And when it does, preserve the residue, repair the right layer, and make the lesson capable of returning. That is where Craft begins.", "written_copy": [{"text": "WHAT MUST REMAIN TRUE WHEN THE IDEA BECOMES REAL?", "role": "closing_question", "position": "center", "display_seconds": 12}, {"text": "CRAFT + CYBERALCHEMY", "role": "closing_signature", "position": "lower_center", "display_seconds": 6}], "visual_mode": "generated_video", "visual_prompt": "Minimal cinematic 16:9 closing shot. A clean white plaster wall separates a warm workshop from a cool gray corridor, but no doorway has been cut yet. On an off-white blueprint in the foreground, a hand draws one graphite route line through the wall and pauses before choosing the door shape. The line is joined by a thin dark-green return thread and one small translucent red tracing marker. Center negative space for the closing question, no text.", "negative_prompt": "finished door, inspirational sunrise, person pointing, logo reveal, captions, glowing path, fantasy portal, particles, dramatic lens flare", "continuity_assets": ["ASSET-WALL-01", "ASSET-BLUEPRINT-01", "ASSET-RESIDUE-01", "ASSET-THREAD-01"], "camera_and_motion": "Slow push toward the undecided wall; pencil stops before drawing the artifact.", "sound_direction": "Pencil line, quiet breath, workshop and corridor room tones meet; clean fade.", "transition_in": "Four evidence cards clear to reveal the uncut wall.", "transition_out": "Fade to black after two seconds of silence.", "source_refs": ["CLM-007"], "claim_posture": "synthesis", "editor_notes": "End on the question, not on a feature list or call to subscribe."}]}</script>
  <header class="topbar">
    <div class="identity">
      <p class="eyebrow">Whisper Video Review</p>
      <h1 id="package-title"></h1>
    </div>
    <div class="stats" aria-label="Package status">
      <span id="runtime-stat"></span>
      <span id="word-stat"></span>
      <span class="status">Voice approved</span>
    </div>
  </header>
  <div class="shell">
    <aside class="rail" aria-label="Video scenes">
      <div class="rail-head">Scenes</div>
      <nav class="scene-list" id="scene-list"></nav>
    </aside>
    <main class="workspace">
      <section class="scene-head">
        <div>
          <div class="scene-meta" id="scene-meta"></div>
          <h2 id="scene-title"></h2>
          <p class="story-job" id="story-job"></p>
        </div>
        <div class="nav-buttons">
          <button class="icon-button" id="prev-scene" type="button" title="Previous scene" aria-label="Previous scene">&larr;</button>
          <button class="icon-button" id="next-scene" type="button" title="Next scene" aria-label="Next scene">&rarr;</button>
        </div>
      </section>
      <section class="visual-band">
        <div class="visual-field">
          <div class="visual-mode" id="visual-mode"></div>
          <div class="visual-title" id="visual-title"></div>
          <div class="concepts" id="concepts"></div>
        </div>
        <div class="prior-model">
          <strong>Prior model</strong>
          <p id="prior-model"></p>
        </div>
      </section>
      <div class="tabs" role="tablist" aria-label="Review surfaces">
        <button class="tab" type="button" data-tab="voice" role="tab">Voice</button>
        <button class="tab" type="button" data-tab="copy" role="tab">Screen copy</button>
        <button class="tab" type="button" data-tab="visual" role="tab">Visual prompt</button>
        <button class="tab" type="button" data-tab="edit" role="tab">Edit</button>
        <button class="tab" type="button" data-tab="sources" role="tab">Sources</button>
      </div>
      <section class="surface" id="surface" role="tabpanel"></section>
      <section class="comment-band">
        <div>
          <h3>Scene comment</h3>
          <div class="comment-form">
            <label>
              <span class="sr-only">Issue type</span>
              <select id="issue-type" aria-label="Issue type">
                <option value="voice">Voice</option>
                <option value="definition">Definition</option>
                <option value="visual">Visual</option>
                <option value="screen_copy">Screen copy</option>
                <option value="evidence">Evidence</option>
                <option value="edit">Edit</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Comment</span>
              <textarea id="comment-text" aria-label="Comment"></textarea>
            </label>
          </div>
          <div class="comment-actions">
            <button class="command" id="save-comment" type="button">Save comment</button>
            <button class="command secondary" id="copy-surface" type="button">Copy current surface</button>
          </div>
        </div>
        <div>
          <h3>Comments <span id="comment-count">0</span></h3>
          <div class="comment-list" id="comment-list"></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const data = JSON.parse(document.getElementById("video-review-data").textContent);
      const storageKey = "video-review:" + data.review_id;
      const state = { index: 0, tab: "voice", comments: [] };

      const els = {
        list: document.getElementById("scene-list"),
        meta: document.getElementById("scene-meta"),
        title: document.getElementById("scene-title"),
        job: document.getElementById("story-job"),
        mode: document.getElementById("visual-mode"),
        visualTitle: document.getElementById("visual-title"),
        concepts: document.getElementById("concepts"),
        prior: document.getElementById("prior-model"),
        surface: document.getElementById("surface"),
        comments: document.getElementById("comment-list"),
        count: document.getElementById("comment-count"),
        text: document.getElementById("comment-text"),
        issue: document.getElementById("issue-type"),
        prev: document.getElementById("prev-scene"),
        next: document.getElementById("next-scene")
      };

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>\"]/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[char];
        });
      }
      function formatTime(seconds) {
        return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
      }
      function current() { return data.segments[state.index]; }
      function load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(storageKey) || "{}");
          if (Array.isArray(parsed.comments)) state.comments = parsed.comments;
        } catch (error) { state.comments = []; }
      }
      function persist() {
        localStorage.setItem(storageKey, JSON.stringify({ comments: state.comments }, null, 2));
      }
      function keepInContainerView(container, item) {
        const containerRect = container.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();
        if (itemRect.left < containerRect.left) container.scrollLeft -= containerRect.left - itemRect.left;
        if (itemRect.right > containerRect.right) container.scrollLeft += itemRect.right - containerRect.right;
        if (itemRect.top < containerRect.top) container.scrollTop -= containerRect.top - itemRect.top;
        if (itemRect.bottom > containerRect.bottom) container.scrollTop += itemRect.bottom - containerRect.bottom;
      }
      function renderList() {
        els.list.innerHTML = data.segments.map(function (segment, index) {
          return '<button class="scene-button" type="button" data-index="' + index + '" aria-current="' + (index === state.index) + '">' +
            '<span class="scene-number">' + String(index + 1).padStart(2, "0") + '</span>' +
            '<span class="scene-name">' + escapeHtml(segment.title) + '</span>' +
            '<span class="scene-duration">' + segment.duration_seconds + 's</span></button>';
        }).join("");
        els.list.querySelectorAll("[data-index]").forEach(function (button) {
          button.addEventListener("click", function () {
            state.index = Number(button.dataset.index);
            render();
          });
        });
        const activeScene = els.list.querySelector('[aria-current="true"]');
        if (activeScene) keepInContainerView(els.list, activeScene);
      }
      function surfaceHtml(segment) {
        if (state.tab === "voice") {
          return '<h3>Voice copy</h3><p class="voice-copy">' + escapeHtml(segment.voice_copy) + '</p>';
        }
        if (state.tab === "copy") {
          return '<h3>On-screen copy</h3>' + segment.written_copy.map(function (item) {
            return '<div class="copy-line"><p class="copy-text">' + escapeHtml(item.text) + '</p>' +
              '<div class="copy-meta">' + escapeHtml(item.role) + ' / ' + escapeHtml(item.position) + ' / ' + item.display_seconds + 's</div></div>';
          }).join("");
        }
        if (state.tab === "visual") {
          return '<h3>Visual-model input</h3>' +
            '<div class="prompt-block"><div class="field-label">Prompt</div><p class="prompt-text">' + escapeHtml(segment.visual_prompt) + '</p></div>' +
            '<div class="prompt-block negative"><div class="field-label">Negative prompt</div><p class="prompt-text">' + escapeHtml(segment.negative_prompt) + '</p></div>' +
            '<div class="prompt-block"><div class="field-label">Continuity assets</div><p class="prompt-text">' + escapeHtml(segment.continuity_assets.join(", ")) + '</p></div>';
        }
        if (state.tab === "edit") {
          const fields = [
            ["Camera and motion", segment.camera_and_motion],
            ["Sound", segment.sound_direction],
            ["Transition in", segment.transition_in],
            ["Transition out", segment.transition_out],
            ["Assembly", segment.editor_notes]
          ];
          return '<h3>Edit surface</h3>' + fields.map(function (field) {
            return '<div class="edit-row"><div class="field-label">' + escapeHtml(field[0]) + '</div><div>' + escapeHtml(field[1]) + '</div></div>';
          }).join("");
        }
        return '<h3>Claim and sources</h3><div class="source-row"><div class="field-label">Claim posture</div><div>' +
          escapeHtml(segment.claim_posture) + '</div></div><div class="source-row"><div class="field-label">Source refs</div><div>' +
          escapeHtml(segment.source_refs.join(", ")) + '</div></div>';
      }
      function renderComments() {
        const comments = state.comments.filter(function (comment) { return comment.segment_id === current().segment_id; });
        els.count.textContent = String(comments.length);
        els.comments.innerHTML = comments.length ? comments.map(function (comment) {
          return '<div class="comment-item"><div class="field-label">' + escapeHtml(comment.issue_type) + '</div><p>' + escapeHtml(comment.comment) + '</p></div>';
        }).join("") : '<div class="empty">No comments for this scene.</div>';
      }
      function render() {
        const segment = current();
        renderList();
        els.meta.textContent = segment.segment_id + " / " + segment.act_id + " / " + segment.duration_seconds + "s";
        els.title.textContent = segment.title;
        els.job.textContent = segment.story_job;
        els.mode.textContent = segment.visual_mode + " / source clip " + segment.generation_clip_seconds + "s";
        els.visualTitle.textContent = segment.visual_prompt.split(".")[0] + ".";
        els.concepts.textContent = "Concepts: " + segment.concepts.join(" / ");
        els.prior.textContent = segment.prior_model;
        els.surface.innerHTML = surfaceHtml(segment);
        document.querySelectorAll("[data-tab]").forEach(function (tab) {
          const selected = tab.dataset.tab === state.tab;
          tab.setAttribute("aria-selected", String(selected));
          tab.setAttribute("tabindex", selected ? "0" : "-1");
          if (selected) keepInContainerView(tab.parentElement, tab);
        });
        els.prev.disabled = state.index === 0;
        els.next.disabled = state.index === data.segments.length - 1;
        renderComments();
      }

      document.getElementById("package-title").textContent = data.package.title + " / " + data.package.subtitle;
      document.getElementById("runtime-stat").textContent = formatTime(data.runtime) + " runtime";
      document.getElementById("word-stat").textContent = data.voice_words + " words";
      document.querySelectorAll("[data-tab]").forEach(function (tab) {
        tab.addEventListener("click", function () { state.tab = tab.dataset.tab; render(); });
      });
      els.prev.addEventListener("click", function () { if (state.index > 0) { state.index -= 1; render(); } });
      els.next.addEventListener("click", function () { if (state.index < data.segments.length - 1) { state.index += 1; render(); } });
      document.getElementById("save-comment").addEventListener("click", function () {
        const comment = els.text.value.trim();
        if (!comment) { els.text.focus(); return; }
        state.comments.push({
          comment_id: "c-" + Date.now().toString(36),
          segment_id: current().segment_id,
          issue_type: els.issue.value,
          surface: state.tab,
          comment: comment
        });
        els.text.value = "";
        persist();
        renderComments();
      });
      document.getElementById("copy-surface").addEventListener("click", function () {
        navigator.clipboard.writeText(els.surface.innerText);
      });
      document.addEventListener("keydown", function (event) {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "TEXTAREA" || tag === "SELECT" || tag === "INPUT") return;
        if (event.key === "ArrowLeft" && state.index > 0) { state.index -= 1; render(); }
        if (event.key === "ArrowRight" && state.index < data.segments.length - 1) { state.index += 1; render(); }
      });

      window.VideoReview = {
        getAgentPayload: function () {
          return {
            kind: "whisper_video_review_payload",
            version: "0.1",
            review_id: data.review_id,
            package_id: data.package.package_id,
            comments: state.comments,
            selected_segment_id: current().segment_id,
            selected_surface: state.tab
          };
        }
      };
      load();
      render();
    })();
  </script>
</body>
</html>
