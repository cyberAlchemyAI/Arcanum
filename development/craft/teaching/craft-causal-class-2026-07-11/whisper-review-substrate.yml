      - part_id: visible_witness
        role: concrete scene before explanation
      - part_id: learner_choice
        role: bounded consequential decision
      - part_id: caused_consequence
        role: result inherited from the choice
      - part_id: earned_concept
        role: formal name after use
      - part_id: inherited_obligation
