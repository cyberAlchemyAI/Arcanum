schema_version: "1.3.0"
deck:
  id: craft-causal-class-2026-07-11
  title: From Table to Text
  subtitle: A beginner class about sketches, schemas, and writing software
  audience: Beginning developers with some vibe-coding experience
  objective: Learners move from practical table-building needs to a buildable sketch, recognize the sketch as a schema, and transfer that relation to an adaptable schema for writing software.
  story:
    table_question: What would you need to build this table?
    collective_discovery: A Mentimeter word cloud gathers the room's materials, tools, measurements, and steps.
    table_sketch: Selected answers become dimensions, parts, materials, and relations on one drawing.
    schema_relation: The sketch is acting as a schema because it preserves structure that building and checking need.
    software_transfer: A writing assistant needs the equivalent of a sketch before it generates text.
    text_mold: Stable writing questions remain reusable while each text type supplies its own structure.
  formal_terms:
    - schema
  interaction_contract:
    primary_sequence: see table -> private answer -> live word cloud -> sketch -> earned schema -> writing analogy -> adaptable text mold
    one_input_one_transition: true
    terminal_states_reset_implicitly: false
    term_before_witness_allowed: false
    notes_visible_by_default: false
  surface_contract:
    projected_copy: [slide title, learner prompt, visible details, earned term]
    spoken_copy: [speaker notes]
    interaction_prompt: [learner prompt, reveal label, Mentimeter word cloud]
    authoring_metadata: [chapter, story state, consequence, validation check, focus behavior, viewport contract]
    authoring_metadata_may_be_projected: false
  viewport_contract:
    desktop:
      - stage, prompt, current action, progress, and navigation fit within one viewport
      - speaker notes open in an overlay and do not resize the slide
    mobile:
      - vertical reading is allowed
      - persistent witness, current prompt, primary action, progress, and navigation appear before the first fold
      - state survives scrolling and notes open in an overlay
  slides:
    - id: CRAFT-CAUSAL-S01
      title: What Would You Need to Build This Table?
      chapter: practical opening
      story_state: learners inspect one table and supply build needs before receiving categories
      visual: table-question
      focus_behavior: The first reveal mounts Mentimeter; the second reveal unmounts it and preserves the room's vocabulary.
      viewport:
        desktop_required: [table, word cloud, prompt, progress]
        mobile_before_fold: [table or word cloud, prompt, reveal control]
      notes: "Put the table on screen immediately. Give the room fifteen quiet seconds with the question. Then open the supplied Mentimeter word cloud and let everyone add one or two short answers. Read the growing cloud without correcting or sorting it. Bring the words back only after the audience has seen its own build list."
      states:
        - id: S01-THINK
          visual_state: table
          visible: []
          learner_prompt: Think for fifteen seconds before the word cloud appears.
          reveal_label: Open the word cloud
          accepted_inputs: [pointer, enter, space]
          transition_to: S01-CLOUD
          consequence: The table remains the object while each learner forms an independent build list.
          earned_term: null
          validation_check: Learners independently name at least two things needed to build the table.
        - id: S01-CLOUD
          visual_state: cloud
          visible: []
          learner_prompt: Add one or two words. Watch the room build the list together.
          reveal_label: Bring the words back
          accepted_inputs: [pointer, enter, space]
          transition_to: S01-GATHERED
          consequence: Private build needs become shared and visible.
          earned_term: null
          validation_check: Multiple learners contribute before the presenter continues.
        - id: S01-GATHERED
          visual_state: gathered
          visible: [materials, tools, measurements, steps]
          learner_prompt: The room has found four kinds of things the build will need.
          accepted_inputs: []
          transition_to: null
          consequence: The audience's vocabulary is ready to be carried into a sketch.
          earned_term: null
          validation_check: Learners place at least one contributed word in a useful group.

    - id: CRAFT-CAUSAL-S02
      title: Now Make the Sketch
      chapter: buildable representation
      story_state: selected build answers move from a list into one relational drawing
      visual: annotated-sketch
      focus_behavior: The annotation reveal owns input and preserves the completed sketch.
      viewport:
        desktop_required: [rough sketch, build answers, annotations, prompt]
        mobile_before_fold: [sketch, prompt, reveal control]
      notes: "Bring forward the room's answers. Ask which answers must be visible on the drawing and which can stay beside it. Dimensions, materials, parts, and attachment relations change the sketch. The drill, saw, and work order guide the making but do not become the table's shape."
      states:
        - id: S02-CHOICES
          visual_state: choices
          visible: [pine and screws, drill and saw, 100 x 50 x 72 cm, measure then cut then join then test]
          learner_prompt: Which answers belong on the sketch, and which should stay beside it?
          reveal_label: Draw this table
          accepted_inputs: [pointer, enter, space]
          transition_to: S02-ANNOTATED
          consequence: The class separates the selected table structure from the means and order of making it.
          earned_term: null
          validation_check: Learners place dimensions, materials, parts, or relations on the sketch while keeping tools and steps beside it.
        - id: S02-ANNOTATED
          visual_state: annotated
          visible: [pine top 100 x 50 cm, working height 72 cm, four straight legs, screws beneath each corner, steady under a hand]
          learner_prompt: The sketch carries what this table is and how its parts relate.
          accepted_inputs: []
          transition_to: null
          consequence: The drawing becomes buildable and checkable rather than merely recognizable.
          earned_term: null
          validation_check: Learners point from an annotation to a build decision and a future check.

    - id: CRAFT-CAUSAL-S03
      title: How Does the Sketch Relate to Schema?
      chapter: term reveal
      story_state: learners distinguish a table picture from a drawing that preserves selected build structure
      visual: schema-reveal
      focus_behavior: The comparison advances once to a terminal term reveal and cannot reset implicitly.
      viewport:
        desktop_required: [plain and buildable sketches, prompt, earned term]
        mobile_before_fold: [sketch comparison, prompt, reveal control]
      notes: "Show a plain table picture beside the buildable sketch. Ask which one can guide the build and settle a disagreement later. The second sketch is not a schema because it is detailed or attractive. It is acting as a schema because it selects parts, dimensions, relations, and conditions that the making must preserve."
      states:
        - id: S03-COMPARE
          visual_state: compare
          visible: [a picture of a table, the selected structure of this table]
          learner_prompt: Which sketch could guide the build and settle a disagreement later?
          reveal_label: Name what the sketch is doing
          accepted_inputs: [pointer, enter, space]
          transition_to: S03-SCHEMA
          consequence: Learners choose by build and judgment power rather than visual polish.
          earned_term: null
          validation_check: Learners prefer the annotated sketch because it preserves the selected table.
        - id: S03-SCHEMA
          visual_state: schema
          visible: [selects the distinctions that matter, keeps their relations explicit, gives building and checking a shared structure]
          learner_prompt: The sketch is acting as a schema because it makes what we mean explicit enough to translate and test.
          accepted_inputs: []
          transition_to: null
          consequence: The formal term names a practical function the learners have already constructed.
          earned_term: schema
          validation_check: Learners explain when a table sketch is acting as a schema and when it is only a picture.

    - id: CRAFT-CAUSAL-S04
      title: What Is the Sketch for Writing Software?
      chapter: software transfer
      story_state: learners seek the table-sketch equivalent for a system that helps people write
      visual: writing-question
      focus_behavior: The writing surface reveal replaces an empty page with a candidate text mold.
      viewport:
        desktop_required: [writing surface, analogy question, mold fields]
        mobile_before_fold: [writing surface, prompt, reveal control]
      notes: "Transfer only the relation, not the furniture story. If our software helps someone write, sentences are the final material. Before generating them, what structure must preserve what the author means? Let the room answer before showing the mold."
      states:
        - id: S04-QUESTION
          visual_state: blank
          visible: [software that helps someone write]
          learner_prompt: If the output is text, what would play the role of the table sketch?
          reveal_label: Build the writing mold
          accepted_inputs: [pointer, enter, space]
          transition_to: S04-MOLD
          consequence: Learners search for a representation between author intent and generated sentences.
          earned_term: null
          validation_check: Learners propose at least one distinction the software needs before writing.
        - id: S04-MOLD
          visual_state: mold
          visible: [purpose, audience, meaning, evidence, shape, voice, ending]
          learner_prompt: The software needs a mold for what the text must preserve before it writes sentences.
          accepted_inputs: []
          transition_to: null
          consequence: The writing equivalent of the table sketch becomes visible.
          earned_term: null
          validation_check: Learners connect one mold field to a meaningful difference in the resulting text.

    - id: CRAFT-CAUSAL-S05
      title: Can One Mold Write Any Text?
      chapter: adaptable writing schema
      story_state: a reusable writing schema keeps stable questions while allowing transport-specific structure
      visual: writing-mold
      focus_behavior: The rigid-mold challenge advances once to an adaptable terminal schema.
      viewport:
        desktop_required: [rigid mold, adaptable mold, prompt, closing relation]
        mobile_before_fold: [mold, prompt, reveal control]
      notes: "Push against the phrase 'any text.' One fixed outline would flatten an email, essay, instructions, and poem into the same shape. Keep stable questions such as purpose, audience, meaning, evidence, voice, and ending, but let the selected text type define its body parts and checks. The reusable mold fixes the questions, not every answer or final form."
      states:
        - id: S05-RIGID
          visual_state: rigid
          visible: [email, essay, instructions, presentation]
          learner_prompt: Should every kind of text be forced into the same outline?
          reveal_label: Make the mold adaptable
          accepted_inputs: [pointer, enter, space]
          transition_to: S05-ADAPTABLE
          consequence: The universal-template assumption is challenged before the reusable structure appears.
          earned_term: null
          validation_check: Learners reject one fixed body shape for every text type.
        - id: S05-ADAPTABLE
          visual_state: adaptable
          visible: [stable questions preserve intent, text type selects the body parts, each text receives its own checkable schema]
          learner_prompt: A reusable writing mold fixes the questions, not the final form.
          accepted_inputs: []
          transition_to: null
          consequence: The table relation transfers without claiming one universal text template.
          earned_term: null
          validation_check: Learners explain how stable fields and variable structure can coexist.
