<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="deck-data-sha256" content="__DECK_SHA__">
  <title>__DECK_TITLE__</title>
  <style>
    :root {
      --paper: #f4f6f3;
      --ink: #182128;
      --muted: #59656d;
      --line: #cbd3d0;
      --white: #ffffff;
      --blue: #1769aa;
      --blue-soft: #e4f0f8;
      --green: #18794e;
      --green-soft: #e2f2e9;
      --yellow: #d7a926;
      --yellow-soft: #fff4c8;
      --red: #b5483a;
      --wood: #9a6a3a;
      --wood-dark: #68462a;
      --graphite: #40515d;
      --shadow: 0 18px 42px rgba(23, 32, 40, .10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    button { font: inherit; }
    button:focus-visible, [tabindex="0"]:focus-visible {
      outline: 3px solid rgba(23, 105, 170, .35);
      outline-offset: 3px;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      position: relative;
      z-index: 20;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .brand strong { font-size: 17px; white-space: nowrap; }
    .brand span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls { display: flex; align-items: center; gap: 7px; }
    .icon-button, .text-button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
    }
    .icon-button { width: 38px; font-size: 20px; }
    .text-button { padding: 0 12px; font-weight: 750; font-size: 13px; }
    .icon-button:hover, .text-button:hover { border-color: var(--blue); color: var(--blue); }
    .icon-button:disabled { opacity: .36; cursor: default; }
    .counter {
      min-width: 54px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .progress { height: 4px; background: #e2e7e4; position: relative; z-index: 19; }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--blue);
      transition: width .25s ease;
    }

    .deck { height: calc(100vh - 68px); position: relative; }
    .slide {
      display: none;
      height: 100%;
      padding: clamp(18px, 2.4vw, 38px) clamp(22px, 3vw, 46px);
      overflow: auto;
    }
    .slide.active { display: block; }
    .slide-grid {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .85fr);
      gap: clamp(28px, 4vw, 64px);
      align-items: center;
      max-width: 1500px;
      margin: 0 auto;
    }
    .scene {
      min-height: min(64vh, 590px);
      background: var(--white);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(22px, 2.7vw, 40px);
      border-radius: 7px;
      cursor: pointer;
      overflow: hidden;
    }
    .scene.terminal { cursor: default; }
    .scene-head { display: flex; align-items: center; justify-content: flex-end; }
    .state-dots { display: flex; gap: 6px; }
    .state-dot { width: 8px; height: 8px; border-radius: 50%; background: #d4dbd8; }
    .state-dot.active { background: var(--blue); }
    .visual {
      flex: 1;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 14px 0;
    }
    .scene-foot { display: flex; justify-content: flex-end; min-height: 38px; }
    .reveal-button {
      border: 0;
      background: var(--ink);
      color: white;
      height: 38px;
      padding: 0 14px;
      border-radius: 6px;
      font-weight: 750;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }
    .reveal-button:hover { background: var(--blue); }

    .narrative {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    h1 {
      font-size: clamp(30px, 3.2vw, 50px);
      line-height: 1.05;
      margin: 0 0 18px;
      max-width: 18ch;
      letter-spacing: 0;
    }
    .prompt {
      font-size: clamp(19px, 1.7vw, 26px);
      line-height: 1.27;
      margin: 0 0 18px;
      color: var(--blue);
      font-weight: 760;
    }
    .visible-list { display: grid; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
    .visible-list:empty { display: none; }
    .visible-list li {
      border-left: 3px solid var(--line);
      padding: 5px 0 5px 12px;
      font-size: 16px;
      line-height: 1.3;
    }
    .term {
      display: inline-flex;
      align-self: flex-start;
      margin-top: 20px;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid #add8c2;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 850;
    }

    .build-table-wrap {
      width: min(94%, 650px);
      height: 310px;
      position: relative;
    }
    .build-table-label {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 15px;
      white-space: nowrap;
    }
    .build-table-top {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 78px;
      height: 40px;
      background: var(--wood);
      border-radius: 3px;
      box-shadow: inset 0 -6px rgba(0, 0, 0, .08);
    }
    .build-table-leg {
      position: absolute;
      top: 114px;
      width: 31px;
      height: 154px;
      background: var(--wood-dark);
      border-radius: 2px;
    }
    .build-table-leg.a { left: 18%; }
    .build-table-leg.b { left: 34%; }
    .build-table-leg.c { right: 34%; }
    .build-table-leg.d { right: 18%; }
    .build-table-floor {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 28px;
      height: 2px;
      background: #aeb8b3;
    }
    .build-table-shadow {
      position: absolute;
      left: 17%;
      right: 17%;
      bottom: 21px;
      height: 12px;
      background: rgba(23, 32, 40, .10);
      border-radius: 50%;
    }

    .room-stage {
      width: min(100%, 660px);
      height: 330px;
      position: relative;
      overflow: hidden;
      background: #eef1ee;
      border-bottom: 3px solid #aeb9b4;
    }
    .room-stage::before {
      content: "";
      position: absolute;
      left: 10%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #d2d8d5;
    }
    .message-time {
      position: absolute;
      left: 10%;
      top: 55px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .message-bubble {
      position: absolute;
      left: 20%;
      right: 8%;
      top: 92px;
      padding: 24px 26px;
      background: var(--white);
      border-left: 5px solid var(--blue);
      box-shadow: 0 10px 28px rgba(23, 32, 40, .10);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 2.2vw, 30px);
      line-height: 1.25;
    }
    .room-wall {
      position: absolute;
      left: 14%;
      right: 18%;
      top: 28px;
      bottom: 20px;
      border-left: 5px solid #dde3df;
      border-right: 5px solid #dde3df;
      background: #fbfcfb;
    }
    .room-floor {
      position: absolute;
      left: 7%;
      right: 5%;
      bottom: 28px;
      height: 3px;
      background: #9eaaa4;
      transform: rotate(-1.2deg);
    }
    .measure-line {
      position: absolute;
      left: 20%;
      right: 24%;
      top: 58px;
      height: 1px;
      background: var(--blue);
    }
    .measure-line::before, .measure-line::after {
      content: "";
      position: absolute;
      top: -5px;
      width: 1px;
      height: 11px;
      background: var(--blue);
    }
    .measure-line::before { left: 0; }
    .measure-line::after { right: 0; }
    .measure-line span {
      position: absolute;
      left: 50%;
      top: -24px;
      transform: translateX(-50%);
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
    }
    .laptop {
      position: absolute;
      left: 31%;
      bottom: 42px;
      width: 88px;
      height: 58px;
      border: 4px solid var(--graphite);
      border-bottom-width: 8px;
      background: #dfe8ed;
    }
    .books {
      position: absolute;
      left: calc(31% + 106px);
      bottom: 43px;
      width: 70px;
      height: 15px;
      background: var(--yellow);
      box-shadow: 0 -18px 0 #b96a58;
    }
    .tomorrow-tag {
      position: absolute;
      right: 9%;
      top: 92px;
      padding: 9px 12px;
      border: 1px solid var(--red);
      color: var(--red);
      font-weight: 850;
      font-size: 13px;
      background: var(--white);
    }

    .sketch-sheet {
      width: min(100%, 620px);
      height: 320px;
      position: relative;
      background: #fffefa;
      border: 1px solid #d7d4ca;
      box-shadow: 0 12px 30px rgba(42, 50, 54, .08);
      transform: rotate(-.4deg);
    }
    .sketch-sheet::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 45px;
      height: 2px;
      background: #9ca7a2;
      transform: rotate(-1deg);
    }
    .pencil-start {
      position: absolute;
      left: 25%;
      right: 24%;
      top: 49%;
      height: 3px;
      background: var(--graphite);
      transform: rotate(-2deg);
    }
    .pencil-start::after {
      content: "";
      position: absolute;
      right: -42px;
      top: -5px;
      width: 48px;
      height: 11px;
      background: var(--yellow);
      transform: rotate(-8deg);
      clip-path: polygon(0 0, 84% 0, 100% 50%, 84% 100%, 0 100%);
    }
    .desk-drawing { position: absolute; left: 18%; right: 18%; top: 70px; height: 185px; }
    .draw-top {
      position: absolute;
      left: 4%;
      right: 3%;
      top: 24px;
      height: 7px;
      border-top: 4px solid var(--graphite);
      border-bottom: 2px solid var(--graphite);
      transform: rotate(.5deg);
    }
    .draw-leg {
      position: absolute;
      top: 31px;
      bottom: 8px;
      width: 4px;
      background: var(--graphite);
      transform-origin: top;
    }
    .draw-leg.a { left: 10%; transform: rotate(1deg); }
    .draw-leg.b { left: 31%; transform: rotate(-.8deg); }
    .draw-leg.c { right: 30%; transform: rotate(.7deg); }
    .draw-leg.d { right: 9%; transform: rotate(-1deg); }
    .sketch-caption {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 15px;
      white-space: nowrap;
    }
    .many-sketches { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .mini-sketch {
      height: 220px;
      position: relative;
      background: #fffefa;
      border: 1px solid #d7d4ca;
      transform: rotate(-1.4deg);
    }
    .mini-sketch:nth-child(2) { transform: rotate(.8deg); }
    .mini-sketch:nth-child(3) { transform: rotate(-.2deg); }
    .mini-sketch .desk-drawing { left: 10%; right: 10%; top: 38px; height: 140px; }
    .mini-sketch.tall .draw-leg { bottom: -17px; }
    .mini-sketch.narrow .desk-drawing { left: 27%; right: 27%; }
    .mini-sketch.two-leg .draw-leg.b, .mini-sketch.two-leg .draw-leg.c { display: none; }
    .mini-label { position: absolute; left: 0; right: 0; bottom: 13px; text-align: center; color: var(--muted); font-size: 12px; }

    .question-mark {
      position: absolute;
      color: var(--red);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 800;
    }
    .question-mark.one { left: 12%; top: 52px; }
    .question-mark.two { right: 12%; top: 118px; }
    .question-mark.three { left: 48%; bottom: 48px; }
    .poll-embed {
      width: min(100%, 680px);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: white;
    }
    .poll-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .word-cloud-summary { width: min(100%, 650px); height: 310px; position: relative; }
    .cloud-word { position: absolute; font-weight: 850; line-height: 1; white-space: nowrap; }
    .cloud-word.measure { left: 24%; top: 28%; color: var(--blue); font-size: 40px; }
    .cloud-word.steady { left: 43%; top: 52%; color: var(--green); font-size: 34px; }
    .cloud-word.tools { left: 9%; top: 57%; color: var(--graphite); font-size: 24px; }
    .cloud-word.wood { right: 13%; top: 23%; color: var(--wood); font-size: 28px; }
    .cloud-word.deadline { right: 7%; bottom: 15%; color: var(--red); font-size: 21px; }
    .cloud-word.load { left: 15%; bottom: 18%; color: var(--yellow); font-size: 27px; }
    .cloud-word.wall { left: 8%; top: 16%; color: var(--muted); font-size: 18px; }
    .cloud-word.height { right: 28%; top: 8%; color: var(--blue); font-size: 21px; }

    .means-strip {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 14px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      z-index: 4;
    }
    .means-strip span {
      border-bottom: 2px solid var(--yellow);
      padding: 3px 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .dimension-x, .dimension-y {
      position: absolute;
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
      z-index: 3;
    }
    .dimension-x { left: 20%; right: 20%; top: 58px; border-top: 2px solid var(--blue); text-align: center; padding-top: 5px; }
    .dimension-y { left: 12%; top: 93px; height: 135px; border-left: 2px solid var(--blue); padding-left: 7px; display: flex; align-items: center; }
    .annotation {
      position: absolute;
      z-index: 3;
      max-width: 130px;
      color: var(--green);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 1.15;
      font-style: italic;
    }
    .annotation.load { right: 6%; top: 105px; }
    .annotation.stability { right: 5%; top: 183px; }
    .annotation.material { right: 7%; bottom: 17px; color: var(--wood); }
    .annotation::before { content: ""; position: absolute; width: 36px; height: 1px; background: currentColor; right: 100%; top: 50%; margin-right: 5px; }

    .sketch-compare { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .compare-panel { min-width: 0; }
    .compare-panel .sketch-sheet { width: 100%; height: 260px; box-shadow: none; }
    .compare-panel .desk-drawing { top: 60px; }
    .compare-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; }
    .compare-panel.strong .compare-label { color: var(--green); }
    .schema-finish { width: min(100%, 650px); display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; align-items: center; }
    .schema-finish .sketch-sheet { width: 100%; height: 290px; box-shadow: none; }
    .schema-reasons { display: grid; gap: 10px; }
    .schema-reason { border-left: 4px solid var(--green); padding: 9px 0 9px 12px; font-size: 13px; line-height: 1.3; }

    .writing-canvas {
      width: min(100%, 650px);
      height: 320px;
      border: 1px solid var(--line);
      background: var(--white);
      position: relative;
      overflow: hidden;
    }
    .writing-toolbar {
      height: 36px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 11px;
    }
    .writing-tool { width: 8px; height: 8px; border-radius: 50%; background: #cfd7d3; }
    .blank-page {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 74px;
      bottom: 36px;
      border-left: 2px solid var(--blue);
      padding: 12px 18px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
    }
    .blank-page::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 24px;
      margin-left: 4px;
      vertical-align: -4px;
      background: var(--blue);
    }
    .mold-grid {
      position: absolute;
      inset: 54px 28px 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .mold-field {
      border-left: 4px solid var(--blue);
      background: var(--blue-soft);
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.2;
    }
    .mold-field strong { display: block; color: var(--blue); margin-bottom: 3px; text-transform: uppercase; font-size: 10px; }
    .mold-field.ending { grid-column: 1 / -1; border-color: var(--green); background: var(--green-soft); }

    .rigid-mold, .adaptive-mold {
      width: min(100%, 660px);
      min-height: 310px;
      display: grid;
      gap: 14px;
      align-items: stretch;
    }
    .rigid-mold { grid-template-columns: .8fr 1.2fr; }
    .fixed-outline { border: 1px solid var(--line); background: #fbfcfb; padding: 18px; }
    .fixed-outline strong, .text-types strong { display: block; margin-bottom: 12px; }
    .outline-line { height: 30px; margin: 7px 0; padding: 7px 9px; background: var(--blue-soft); border-left: 3px solid var(--blue); font-size: 12px; }
    .text-types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; align-content: center; }
    .text-type { border: 1px solid var(--line); padding: 14px; background: var(--white); font-weight: 750; font-size: 13px; }
    .text-type::before { content: "?"; color: var(--red); font-weight: 900; margin-right: 7px; }
    .adaptive-mold { grid-template-columns: .85fr auto 1.15fr; align-items: center; }
    .stable-questions, .variable-shape { border: 1px solid var(--line); padding: 16px; background: var(--white); min-height: 260px; }
    .stable-questions strong, .variable-shape strong { display: block; margin-bottom: 11px; color: var(--green); }
    .question-line { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .mold-arrow { color: var(--blue); font-size: 30px; font-weight: 900; }
    .transport-select { border: 2px solid var(--blue); padding: 9px 11px; margin-bottom: 11px; color: var(--blue); font-weight: 850; font-size: 12px; }
    .variable-part { background: var(--yellow-soft); border-left: 3px solid var(--yellow); padding: 9px 10px; margin: 7px 0; font-size: 12px; }

    .notes-overlay {
      position: fixed;
      inset: 68px 0 0;
      background: rgba(23, 32, 40, .55);
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 24px;
    }
    .notes-overlay.open { display: flex; }
    .notes-panel {
      width: min(760px, 100%);
      background: white;
      border-radius: 7px;
      padding: 24px;
      box-shadow: var(--shadow);
      max-height: 65vh;
      overflow: auto;
    }
    .notes-panel h2 { margin: 0 0 12px; font-size: 18px; }
    .notes-panel p { margin: 0; color: var(--muted); line-height: 1.55; }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .topbar { height: 56px; padding: 0 12px; position: sticky; top: 0; }
      .brand span { display: none; }
      .brand strong { font-size: 14px; }
      .text-button { width: 38px; padding: 0; font-size: 0; }
      .text-button::before { content: "i"; font-size: 16px; font-weight: 900; }
      .progress { position: sticky; top: 56px; z-index: 19; }
      .deck { height: auto; min-height: calc(100vh - 60px); }
      .slide { min-height: calc(100vh - 60px); height: auto; padding: 16px 14px 84px; overflow: visible; }
      .slide-grid { grid-template-columns: 1fr; gap: 22px; align-items: start; }
      .scene { min-height: 380px; padding: 18px; box-shadow: 0 8px 24px rgba(23, 32, 40, .08); }
      .visual { min-height: 250px; padding: 8px 0; }
      .narrative { justify-content: start; }
      h1 { font-size: 38px; max-width: none; margin-bottom: 14px; }
      .prompt { font-size: 22px; }
      .visible-list li { font-size: 15px; }
      .build-table-wrap { height: 260px; }
      .build-table-top { top: 54px; }
      .build-table-leg { top: 90px; height: 126px; width: 24px; }
      .room-stage, .sketch-sheet { height: 270px; }
      .message-bubble { left: 12%; top: 76px; padding: 19px; font-size: 22px; }
      .message-time { left: 7%; top: 38px; }
      .room-wall { left: 8%; right: 12%; }
      .laptop { left: 24%; }
      .books { left: calc(24% + 98px); }
      .tomorrow-tag { right: 4%; top: 87px; }
      .desk-drawing { left: 12%; right: 12%; top: 52px; height: 160px; }
      .many-sketches { gap: 6px; }
      .mini-sketch { height: 190px; }
      .mini-sketch .desk-drawing { top: 30px; height: 125px; }
      .word-cloud-summary { height: 260px; transform: scale(.9); }
      .poll-embed { width: 100%; }
      .dimension-x { top: 43px; }
      .dimension-y { top: 74px; height: 118px; left: 5%; }
      .annotation.load { right: 1%; top: 86px; }
      .annotation.stability { right: 0; top: 157px; }
      .annotation.material { right: 1%; }
      .sketch-compare { gap: 6px; }
      .compare-panel .sketch-sheet { height: 215px; }
      .compare-panel .desk-drawing { top: 48px; height: 130px; }
      .compare-panel .annotation { font-size: 10px; max-width: 72px; }
      .schema-finish { grid-template-columns: 1fr; gap: 10px; }
      .schema-finish .sketch-sheet { height: 230px; }
      .schema-reasons { grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .schema-reason { padding: 6px 0 6px 6px; font-size: 10px; }
      .writing-canvas { height: 270px; }
      .mold-grid { inset: 48px 12px 14px; gap: 5px; }
      .mold-field { padding: 7px; font-size: 10px; }
      .rigid-mold { grid-template-columns: .9fr 1.1fr; min-height: 260px; gap: 7px; }
      .fixed-outline { padding: 10px; }
      .outline-line { height: 26px; padding: 6px; font-size: 10px; }
      .text-types { gap: 5px; }
      .text-type { padding: 9px 6px; font-size: 10px; }
      .adaptive-mold { grid-template-columns: .9fr auto 1.1fr; min-height: 260px; gap: 5px; }
      .stable-questions, .variable-shape { padding: 9px; min-height: 230px; }
      .question-line, .variable-part { font-size: 9px; padding: 6px 3px; }
      .mold-arrow { font-size: 20px; }
      .transport-select { padding: 6px; font-size: 9px; }
      .notes-overlay { inset: 60px 0 0; padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>__DECK_TITLE__</strong><span>__DECK_SUBTITLE__</span></div>
    <nav class="controls" aria-label="Presentation controls">
      <button class="icon-button" id="prev-slide" type="button" aria-label="Previous slide" title="Previous slide">&#8592;</button>
      <span class="counter" id="counter" aria-live="polite">1 / __SLIDE_COUNT__</span>
      <button class="icon-button" id="next-slide" type="button" aria-label="Next slide" title="Next slide">&#8594;</button>
      <button class="text-button" id="notes-toggle" type="button" aria-pressed="false" title="Speaker notes">Notes</button>
    </nav>
  </header>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <main class="deck" id="deck" aria-label="__DECK_TITLE__"></main>
  <div class="notes-overlay" id="notes-overlay" role="dialog" aria-modal="true" aria-labelledby="notes-title">
    <div class="notes-panel">
      <h2 id="notes-title">Speaker notes</h2>
      <p id="notes-copy"></p>
    </div>
  </div>

  <script id="deck-data" type="application/json">__DECK_DATA__</script>
  <script>
    const deckData = JSON.parse(document.getElementById("deck-data").textContent);
    const stateBySlide = deckData.slides.map(() => 0);
    let activeSlide = 0;

    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    const stateClass = value => escapeHtml(value || "plain");

    function deskDrawing(extraClass = "") {
      return `<div class="desk-drawing ${escapeHtml(extraClass)}"><div class="draw-top"></div><div class="draw-leg a"></div><div class="draw-leg b"></div><div class="draw-leg c"></div><div class="draw-leg d"></div></div>`;
    }

    function annotatedSheet(compact = false) {
      return `<div class="sketch-sheet ${compact ? "compact" : ""}"><div class="sketch-caption">small wooden table</div>${deskDrawing()}<div class="dimension-x">100 cm width</div><div class="dimension-y">72 cm</div><div class="annotation load">50 cm depth</div><div class="annotation stability">steady under a hand</div><div class="annotation material">pine + corner screws</div></div>`;
    }

    function solidTable() {
      return `<div class="build-table-wrap"><div class="build-table-label">the table we want to build</div><div class="build-table-shadow"></div><div class="build-table-floor"></div><div class="build-table-top"></div><div class="build-table-leg a"></div><div class="build-table-leg b"></div><div class="build-table-leg c"></div><div class="build-table-leg d"></div></div>`;
    }

    function renderTableQuestion(state) {
      if (state === "cloud") {
        return `<div class="poll-embed"><iframe sandbox="allow-popups allow-scripts allow-same-origin allow-presentation" allowfullscreen="true" allowtransparency="true" frameborder="0" src="https://www.mentimeter.com/app/presentation/alcbnn8dmyzr18g2tww5g5xk3dxf7s1q/embed" title="Mentimeter word cloud: what would you need to build this"></iframe></div>`;
      }
      if (state === "gathered") {
        return `<div class="word-cloud-summary" aria-label="Build-needs word cloud"><span class="cloud-word measure">measurements</span><span class="cloud-word steady">steps</span><span class="cloud-word tools">tools</span><span class="cloud-word wood">wood</span><span class="cloud-word deadline">dimensions</span><span class="cloud-word load">screws</span><span class="cloud-word wall">saw</span><span class="cloud-word height">drill</span></div>`;
      }
      return solidTable();
    }

    function renderAnnotatedSketch(state) {
      if (state === "annotated") return annotatedSheet();
      return `<div class="sketch-sheet"><div class="sketch-caption">which answers belong on the drawing?</div>${deskDrawing()}<div class="means-strip"><span>pine + screws</span><span>drill + saw</span><span>100 x 50 x 72</span><span>measure / cut / join / test</span></div></div>`;
    }

    function renderSchemaReveal(state) {
      if (state === "schema") {
        return `<div class="schema-finish">${annotatedSheet(true)}<div class="schema-reasons"><div class="schema-reason">Select what matters</div><div class="schema-reason">Keep relations explicit</div><div class="schema-reason">Enable building and checking</div></div></div>`;
      }
      return `<div class="sketch-compare"><div class="compare-panel"><span class="compare-label">Picture</span><div class="sketch-sheet">${deskDrawing()}</div></div><div class="compare-panel strong"><span class="compare-label">Buildable structure</span>${annotatedSheet(true)}</div></div>`;
    }

    function renderWritingQuestion(state) {
      if (state === "mold") {
        const fields = [
          ["Purpose", "what should this text do?"],
          ["Audience", "who must understand or act?"],
          ["Meaning", "what must remain true?"],
          ["Evidence", "what supports it?"],
          ["Shape", "what parts must appear?"],
          ["Voice", "how should it sound?"],
          ["Ending", "where should the reader arrive?"]
        ];
        return `<div class="writing-canvas"><div class="writing-toolbar"><span class="writing-tool"></span><span class="writing-tool"></span><span class="writing-tool"></span> writing mold</div><div class="mold-grid">${fields.map(([name, question], index) => `<div class="mold-field ${index === fields.length - 1 ? "ending" : ""}"><strong>${name}</strong>${question}</div>`).join("")}</div></div>`;
      }
      return `<div class="writing-canvas"><div class="writing-toolbar"><span class="writing-tool"></span><span class="writing-tool"></span><span class="writing-tool"></span> new text</div><div class="blank-page">Start writing</div></div>`;
    }

    function renderWritingMold(state) {
      if (state === "adaptable") {
        const questions = ["purpose", "audience", "meaning", "evidence", "voice", "ending"];
        return `<div class="adaptive-mold"><div class="stable-questions"><strong>Stable questions</strong>${questions.map(question => `<div class="question-line">${question}</div>`).join("")}</div><div class="mold-arrow">&#8594;</div><div class="variable-shape"><strong>Text-specific shape</strong><div class="transport-select">TEXT TYPE: selected here</div><div class="variable-part">required body parts</div><div class="variable-part">order and emphasis</div><div class="variable-part">checks for this text</div></div></div>`;
      }
      return `<div class="rigid-mold"><div class="fixed-outline"><strong>One fixed outline</strong><div class="outline-line">Introduction</div><div class="outline-line">Three points</div><div class="outline-line">Conclusion</div></div><div class="text-types"><div class="text-type">email</div><div class="text-type">essay</div><div class="text-type">instructions</div><div class="text-type">presentation</div></div></div>`;
    }

    function renderVisual(slide, state) {
      if (slide.visual === "table-question") return renderTableQuestion(state.visual_state);
      if (slide.visual === "annotated-sketch") return renderAnnotatedSketch(state.visual_state);
      if (slide.visual === "schema-reveal") return renderSchemaReveal(state.visual_state);
      if (slide.visual === "writing-question") return renderWritingQuestion(state.visual_state);
      if (slide.visual === "writing-mold") return renderWritingMold(state.visual_state);
      return "";
    }

    function currentSlide() { return deckData.slides[activeSlide]; }
    function currentState() { return currentSlide().states[stateBySlide[activeSlide]]; }

    function render() {
      const root = document.getElementById("deck");
      root.innerHTML = deckData.slides.map((slide, slideIndex) => {
        const stateIndex = stateBySlide[slideIndex];
        const state = slide.states[stateIndex];
        const terminal = !state.transition_to;
        const dots = slide.states.map((_, index) => `<span class="state-dot ${index === stateIndex ? "active" : ""}"></span>`).join("");
        const list = state.visible.map(item => `<li>${escapeHtml(item)}</li>`).join("");
        const term = state.earned_term ? `<span class="term">${escapeHtml(state.earned_term)}</span>` : "";
        const revealLabel = escapeHtml(state.reveal_label || "Reveal");
        const visual = slideIndex === activeSlide ? renderVisual(slide, state) : "";
        return `<section class="slide ${slideIndex === activeSlide ? "active" : ""}" id="${escapeHtml(slide.id)}" data-index="${slideIndex}" aria-labelledby="title-${slideIndex}"><div class="slide-grid"><div class="scene ${terminal ? "terminal" : ""}" tabindex="0" role="group" aria-label="${escapeHtml(slide.title)}, state ${stateIndex + 1} of ${slide.states.length}" data-scene-index="${slideIndex}"><div class="scene-head"><div class="state-dots" aria-hidden="true">${dots}</div></div><div class="visual">${visual}</div><div class="scene-foot">${terminal ? "" : `<button class="reveal-button" type="button" data-reveal-index="${slideIndex}" title="${revealLabel}">${revealLabel} <span aria-hidden="true">&#8594;</span></button>`}</div></div><div class="narrative"><h1 id="title-${slideIndex}">${escapeHtml(slide.title)}</h1><p class="prompt">${escapeHtml(state.learner_prompt)}</p><ul class="visible-list">${list}</ul>${term}</div></div></section>`;
      }).join("");

      root.querySelectorAll("[data-reveal-index]").forEach(button => button.addEventListener("click", event => {
        event.stopPropagation();
        advanceState(Number(button.dataset.revealIndex));
      }));
      root.querySelectorAll("[data-scene-index]").forEach(scene => {
        scene.addEventListener("click", event => {
          if (event.target.closest("button")) return;
          advanceState(Number(scene.dataset.sceneIndex));
        });
        scene.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            event.stopPropagation();
            advanceState(Number(scene.dataset.sceneIndex));
          }
          if (event.key === "ArrowRight" || event.key === "PageDown") {
            event.preventDefault();
            event.stopPropagation();
            stepForward();
          }
          if (event.key === "ArrowLeft" || event.key === "PageUp") {
            event.preventDefault();
            event.stopPropagation();
            stepBackward();
          }
        });
      });

      document.getElementById("counter").textContent = `${activeSlide + 1} / ${deckData.slides.length}`;
      const totalStates = deckData.slides.reduce((count, slide) => count + slide.states.length, 0);
      const completedStates = deckData.slides.slice(0, activeSlide).reduce((count, slide) => count + slide.states.length, 0) + stateBySlide[activeSlide] + 1;
      document.getElementById("progress-bar").style.width = `${completedStates / totalStates * 100}%`;
      document.getElementById("prev-slide").disabled = activeSlide === 0 && stateBySlide[0] === 0;
      document.getElementById("next-slide").disabled = activeSlide === deckData.slides.length - 1 && !currentState().transition_to;
      document.getElementById("notes-copy").textContent = currentSlide().notes;
    }

    function setSlide(index, updateHash = true) {
      activeSlide = Math.max(0, Math.min(index, deckData.slides.length - 1));
      if (updateHash) history.replaceState(null, "", `#${currentSlide().id}`);
      closeNotes();
      render();
      window.scrollTo(0, 0);
    }

    function advanceState(slideIndex) {
      if (slideIndex !== activeSlide) return;
      const state = currentState();
      if (!state.transition_to) return;
      const nextIndex = currentSlide().states.findIndex(item => item.id === state.transition_to);
      if (nextIndex < 0) return;
      stateBySlide[activeSlide] = nextIndex;
      render();
    }

    function stepForward() {
      if (currentState().transition_to) advanceState(activeSlide);
      else if (activeSlide < deckData.slides.length - 1) setSlide(activeSlide + 1);
    }

    function stepBackward() {
      if (stateBySlide[activeSlide] > 0) {
        stateBySlide[activeSlide] -= 1;
        render();
      } else if (activeSlide > 0) {
        setSlide(activeSlide - 1);
        stateBySlide[activeSlide] = currentSlide().states.length - 1;
        render();
      }
    }

    const notesOverlay = document.getElementById("notes-overlay");
    const notesToggle = document.getElementById("notes-toggle");
    function closeNotes() {
      notesOverlay.classList.remove("open");
      notesToggle.setAttribute("aria-pressed", "false");
    }
    function toggleNotes() {
      const open = notesOverlay.classList.toggle("open");
      notesToggle.setAttribute("aria-pressed", String(open));
    }

    document.getElementById("prev-slide").addEventListener("click", stepBackward);
    document.getElementById("next-slide").addEventListener("click", stepForward);
    notesToggle.addEventListener("click", toggleNotes);
    notesOverlay.addEventListener("click", event => { if (event.target === notesOverlay) closeNotes(); });
    document.addEventListener("keydown", event => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (event.key === "Escape") { closeNotes(); return; }
      if (tag === "IFRAME" || tag === "BUTTON" || tag === "INPUT" || tag === "TEXTAREA") return;
      if (event.key === "ArrowRight" || event.key === "PageDown") stepForward();
      if (event.key === "ArrowLeft" || event.key === "PageUp") stepBackward();
    });
    window.addEventListener("hashchange", () => {
      const index = deckData.slides.findIndex(slide => `#${slide.id}` === location.hash);
      if (index >= 0) setSlide(index, false);
    });

    const initialIndex = deckData.slides.findIndex(slide => `#${slide.id}` === location.hash);
    setSlide(initialIndex >= 0 ? initialIndex : 0, initialIndex < 0);
  </script>
</body>
</html>
