hat to do first. Let the room order the work. Then point out that changing the order did not change the promises.","states":[{"id":"S05-UNORDERED","visual_state":"unordered","visible":["measure","cut","attach","place","test"],"learner_prompt":"We know what must be true. What should happen first?","reveal_label":"Put it in order","accepted_inputs":["pointer","enter","space"],"transition_to":"S05-ORDERED","consequence":"The validity structure becomes executable work.","earned_term":null,"validation_check":"Learners name one input, output, and done check."},{"id":"S05-ORDERED","visual_state":"ordered","visible":["1 measure","2 mark","3 cut","4 attach","5 place","6 test"],"learner_prompt":"The order changed. Did our promises change?","accepted_inputs":[],"transition_to":null,"consequence":"Order serves the schema without replacing it.","earned_term":null,"validation_check":"Learners distinguish validity conditions from execution order."}]},{"id":"CRAFT-CAUSAL-S06","title":"The Sketch Cannot Wobble","chapter":"artifact","story_state":"execution produces an inspectable desk","visual":"table","focus_behavior":"Build reveal input is terminal and cannot reset implicitly.","viewport":{"desktop_required":["built table","prior schema","prompt"],"mobile_before_fold":["built table","prompt"]},"notes":"A drawing can look convincing without carrying weight or moving under a hand. Build the desk, but do not call it successful yet. The important change is that reality can finally disagree with us.","states":[{"id":"S06-DRAWING","visual_state":"drawing","visible":["Will the joints move?","Will the floor matter?","Will typing shake it?"],"learner_prompt":"What can only a real desk tell us?","reveal_label":"Build it","accepted_inputs":["pointer","enter","space"],"transition_to":"S06-BUILT","consequence":"The work moves from representation to physical result.","earned_term":null,"validation_check":"Learners name one property that requires a real or simulated result."},{"id":"S06-BUILT","visual_state":"built","visible":["it fits the wall","it holds the laptop and books","nobody has pushed it sideways yet"],"learner_prompt":"Now reality gets a vote.","accepted_inputs":[],"transition_to":null,"consequence":"A result now exists and can disagree with the schema.","earned_term":"artifact","validation_check":"Learners distinguish the produced thing from the plan and schema."}]},{"id":"CRAFT-CAUSAL-S07","title":"Three Passes, One Unknown","chapter":"validation","story_state":"earlier obligations become comparisons","visual":"check-board","focus_behavior":"Check selection owns input; result reveal does not navigate.","viewport":{"desktop_required":["schema checks","desk","prompt"],"mobile_before_fold":["desk","first checks","prompt"]},"notes":"Bring back the four promises from earlier. Three have evidence; one is still unknown. Ask whether three passes are enough before touching the desk from the side.","states":[{"id":"S07-SELECT","visual_state":"unchecked","visible":["fit passes","height passes","load passes","stability is still unknown"],"learner_prompt":"Which promise should we test next?","reveal_label":"Test the last promise","accepted_inputs":["pointer","enter","space"],"transition_to":"S07-RESULTS","consequence":"The class compares the artifact with its own prior commitments.","earned_term":null,"validation_check":"Learners justify a check by pointing back to the schema."},{"id":"S07-RESULTS","visual_state":"partial-pass","visible":["fit passes","height passes","load passes","stability still needs evidence"],"learner_prompt":"Can we call it finished yet?","accepted_inputs":[],"transition_to":null,"consequence":"Comparison remains incomplete while one named condition is unknown.","earned_term":"validation","validation_check":"Learners refuse a final verdict until the remaining condition is tested."}]},{"id":"CRAFT-CAUSAL-S08","title":"Then We Push the Corner","chapter":"residue","story_state":"the recorded choice produces a named mismatch","visual":"table","focus_behavior":"The wobble reveal is terminal and preserves the failed state.","viewport":{"desktop_required":["wobbling table","failed stability check","history strip"],"mobile_before_fold":["wobbling table","failed check","prompt"]},"notes":"Ask for a prediction before the push. When the desk moves, connect it to the choice the room made earlier: fast corner joints, no side rails, and an uneven floor. The wobble is not a surprise inserted for drama; it belongs to the history.","states":[{"id":"S08-TEST","visual_state":"test","visible":[],"learner_prompt":"What do you think happens when we push here?","reveal_label":"Push the corner","accepted_inputs":["pointer","enter","space"],"transition_to":"S08-WOBBLE","consequence":"Sideways force exposes the unbraced relation.","earned_term":null,"validation_check":"Learners state a prediction before the reveal."},{"id":"S08-WOBBLE","visual_state":"wobble","visible":["fit passes","height passes","load passes","stability fails"],"learner_prompt":"It is usable. It is also not steady enough.","accepted_inputs":[],"transition_to":null,"consequence":"The next move can be routed from a specific failed obligation.","earned_term":"residue","validation_check":"Learners name the failed check without calling the whole desk useless."}]},{"id":"CRAFT-CAUSAL-S09","title":"A Fix That Fixes the Wrong Thing","chapter":"repair","story_state":"a shim closes level but not sideways stability","visual":"table","focus_behavior":"Repair input reveals one consequence and remains terminal.","viewport":{"desktop_required":["shim","before and after checks","prompt"],"mobile_before_fold":["shim","active check","prompt"]},"notes":"A shim is cheap, visible, and worth trying in this story. It is not a universal rule that repair must come first. Ask what the shim should fix, then test the exact wobble again.","states":[{"id":"S09-REPAIR","visual_state":"shim","visible":["uneven floor","one short foot","a top that is not level"],"learner_prompt":"A thin shim goes under the short foot. What should improve?","reveal_label":"Retest the desk","accepted_inputs":["pointer","enter","space"],"transition_to":"S09-RETEST","consequence":"The top becomes level, but the attachment relation is unchanged.","earned_term":null,"validation_check":"Learners predict level may improve while sideways stability may not."},{"id":"S09-RETEST","visual_state":"shim-wobble","visible":["the top is level","the sideways wobble remains","the corner joints did not change"],"learner_prompt":"We fixed what we could see. What did we actually fix?","accepted_inputs":[],"transition_to":null,"consequence":"The remaining work needs a clearer boundary and its own checks.","earned_term":null,"validation_check":"Learners explain why adding more vague instructions would hide responsibility."}]},{"id":"CRAFT-CAUSAL-S10","title":"\"Attach the Legs\" Is Hiding a Project","chapter":"candidate layer","story_state":"hidden joint work receives a provisional boundary","visual":"layer-boundary","focus_behavior":"Boundary reveal input is terminal; the slide does not award the layer term yet.","viewport":{"desktop_required":["upper input","lower responsibility","return interface"],"mobile_before_fold":["candidate responsibility","input","output"]},"notes":"The old plan said only, \"attach the legs.\" Let the room discover how many choices those three words were hiding. Then draw a smaller job with a clear input, output, and proof, without claiming yet that the split is good.","states":[{"id":"S10-HIDDEN","visual_state":"hidden-work","visible":["joint shape","rail size","screw position","wood thickness","side-force test"],"learner_prompt":"How much work was hiding inside those three words?","reveal_label":"Draw the boundary","accepted_inputs":["pointer","enter","space"],"transition_to":"S10-BOUNDARY","consequence":"Hidden obligations become a candidate responsibility.","earned_term":null,"validation_check":"Learners identify at least one input, output, and independent check."},{"id":"S10-BOUNDARY","visual_state":"boundary","visible":["receive the desk dimensions and attachment points","produce one leg-and-rail assembly","prove it is strong alone and steady in the desk"],"learner_prompt":"What should this smaller build receive, produce, and prove?","accepted_inputs":[],"transition_to":null,"consequence":"The candidate can now be accepted or rejected with evidence.","earned_term":null,"validation_check":"Learners require lower residue plus local and upper validation."}]},{"id":"CRAFT-CAUSAL-S11","title":"It Has to Work Twice","chapter":"layer proof","story_state":"the lower artifact passes locally and in the desk","visual":"dual-check","focus_behavior":"Local and upper checks advance in order; terminal state cannot cycle backward by activation.","viewport":{"desktop_required":["local checks","upper checks","residue comparison"],"mobile_before_fold":["active check surface","prompt","progress"]},"notes":"First test the assembly on the workbench. Then remind the room that a strong assembly can still fail to fit the desk. Only after both checks pass and the wobble is lower has this smaller build earned its boundary.","states":[{"id":"S11-LOCAL","visual_state":"local","visible":["dimensions pass","joints hold","side force does not rack the frame"],"learner_prompt":"The assembly holds on the workbench. Is that enough?","reveal_label":"Put it in the desk","accepted_inputs":["pointer","enter","space"],"transition_to":"S11-UPPER","consequence":"Local success is necessary but not sufficient.","earned_term":null,"validation_check":"Learners insist on the upper check."},{"id":"S11-UPPER","visual_state":"upper","visible":["fit passes","height passes","load passes","level passes","stability passes"],"learner_prompt":"The desk works again. What changed from before?","reveal_label":"Compare before and after","accepted_inputs":["pointer","enter","space"],"transition_to":"S11-EARNED","consequence":"The failed stability obligation is closed without creating another blocking failure.","earned_term":null,"validation_check":"Learners compare the declared before and after checks."},{"id":"S11-EARNED","visual_state":"earned","visible":["one clear job","its own checks","works inside the whole","the wobble is lower"],"learner_prompt":"This smaller build has earned its own boundary.","accepted_inputs":[],"transition_to":null,"consequence":"The lower build has earned independent governance inside the whole.","earned_term":"craft layer","validation_check":"Learners reject complexity alone as a sufficient reason to split."}]},{"id":"CRAFT-CAUSAL-S12","title":"Back in the Whole Desk","chapter":"recomposition","story_state":"the lower artifact changes the upper artifact and closes the blocking mismatch","visual":"recomposition","focus_behavior":"Return reveal is terminal and keeps the completed table visible.","viewport":{"desktop_required":["lower artifact","return arrow","completed desk","stop condition"],"mobile_before_fold":["completed desk","return relation","prompt"]},"notes":"Returning the assembly is not the end; the original desk promises must run again. A small screw mark remains after the repair, but it does not block this bedroom desk. Stop at the objective, not at imagined perfection.","states":[{"id":"S12-RETURN","visual_state":"return","visible":["fit","height","load","level","stability"],"learner_prompt":"What do we have to test again after the new assembly returns?","reveal_label":"Run the desk checks","accepted_inputs":["pointer","enter","space"],"transition_to":"S12-CLOSED","consequence":"The lower result changes the upper artifact.","earned_term":null,"validation_check":"Learners name the original upper checks, not only the local ones."},{"id":"S12-CLOSED","visual_state":"closed","visible":["all important checks pass","one cosmetic screw mark remains","stop here for this job"],"learner_prompt":"The desk is steady. Are we done for this job?","accepted_inputs":[],"transition_to":null,"consequence":"Work stops at acceptable residue for the chosen objective.","earned_term":"recomposition","validation_check":"Learners distinguish acceptable residue from perfect completion."}]},{"id":"CRAFT-CAUSAL-S13","title":"A Dashboard Can Look Right and Be Wrong","chapter":"software transfer","story_state":"a plausible screen fails a concrete student task before explanation","visual":"dashboard","focus_behavior":"Dashboard comparison owns reveal input; no new formal term is introduced.","viewport":{"desktop_required":["two dashboards","student task","result"],"mobile_before_fold":["first dashboard","student task","prompt"]},"notes":"Show both screens before diagnosing either one. Give the room one student task: find what must be done before tomorrow. Let that task expose what the polished screens forgot.","states":[{"id":"S13-SCREENS","visual_state":"plausible","visible":["charts and recent activity","assignments and due dates"],"learner_prompt":"Which screen can tell a student what to do before tomorrow?","reveal_label":"Try the task","accepted_inputs":["pointer","enter","space"],"transition_to":"S13-FAILURE","consequence":"Plausible appearance is separated from the required action.","earned_term":null,"validation_check":"Learners choose by task evidence rather than visual preference."},{"id":"S13-FAILURE","visual_state":"failed-task","visible":["what is due next is unclear","overdue work is hidden","returned work is mixed in"],"learner_prompt":"Neither screen answers the whole question. What is missing?","reveal_label":"Fix the smallest useful piece","accepted_inputs":["pointer","enter","space"],"transition_to":"S13-PANEL","consequence":"The learner supplies constraints before the correction appears.","earned_term":null,"validation_check":"Learners name at least one missing relation and one check."},{"id":"S13-PANEL","visual_state":"assignment-panel","visible":["due next","overdue","returned for revision","open the assignment","filter by class"],"learner_prompt":"Now the student can act without guessing.","accepted_inputs":[],"transition_to":null,"consequence":"The table pattern transfers without a second vocabulary lecture.","earned_term":null,"validation_check":"Learners reject both the whole portal and an isolated button as the next responsible unit."}]},{"id":"CRAFT-CAUSAL-S14","title":"Now We Can Name It","chapter":"closure","story_state":"learners reconstruct the causal path before the final term appears","visual":"craft-path","focus_behavior":"Reconstruction advances to one terminal term reveal; no reset occurs without explicit reload.","viewport":{"desktop_required":["table path","software echo","stop condition","final term"],"mobile_before_fold":["causal path","prompt","reveal control"]},"notes":"Ask the room to retell the journey without formal vocabulary. We kept promises visible, built something reality could challenge, used the mismatch to choose the next move, and checked the result again inside the whole. Only now give that way of working its name.","states":[{"id":"S14-RECONSTRUCT","visual_state":"path","visible":["went back to the promise","found the exact mismatch","repaired or opened a smaller build","returned and checked again"],"learner_prompt":"When the result disagreed with us, what did we do next?","reveal_label":"Name the method","accepted_inputs":["pointer","enter","space"],"transition_to":"S14-CRAFT","consequence":"Learners reconstruct the method from witnessed decisions.","earned_term":null,"validation_check":"Learners explain the path using either the table or dashboard without reading labels."},{"id":"S14-CRAFT","visual_state":"craft","visible":["choose what counts","build something inspectable","let the mismatch guide the next move","stop when the remainder is acceptable"],"learner_prompt":"Craft keeps the next responsible move visible.","accepted_inputs":[],"transition_to":null,"consequence":"The formal name arrives after the learner has used the pattern.","earned_term":"Craft","validation_check":"Learners state when to repair, revise, descend, return, or stop."}]}]}</script>
  <script>
    const deckData = JSON.parse(document.getElementById("deck-data").textContent);
    const stateBySlide = deckData.slides.map(() => 0);
    let activeSlide = 0;

    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    const stateClass = value => escapeHtml(value || "plain");

    function renderTable(state) {
      const label = state.includes("wobble") ? "still wobbles sideways" : state === "closed" || state === "upper" || state === "earned" ? "steady after the rebuild" : state === "shim" ? "shim under one foot" : "bedroom desk";
      return `<div class="table-wrap ${stateClass(state)}"><div class="table-label">${escapeHtml(label)}</div><div class="floor"></div><div class="table-top"></div><div class="rail"></div><div class="leg a"></div><div class="leg b"></div><div class="leg c"></div><div class="leg d"></div><div class="shim"></div></div>`;
    }

    function renderPoll() {
      return `<div class="poll-embed"><iframe sandbox="allow-popups allow-scripts allow-same-origin allow-presentation" allowfullscreen="true" allowtransparency="true" frameborder="0" src="https://www.mentimeter.com/app/presentation/alp3oabge8exjja9bondf9szd8m8zaff/embed" title="Mentimeter poll: choose the table we will build"></iframe></div>`;
    }

    function renderChoices(state) {
      const profile = withRail => `<div class="desk-profile" aria-label="front view of desk ${withRail ? "with a side rail joining the legs" : "with legs attached only at the corners"}"><div class="profile-top"></div><div class="profile-leg left"></div><div class="profile-leg right"></div>${withRail ? '<div class="profile-rail"></div>' : ""}</div>`;
      return `<div class="choice-grid"><div class="option-panel ${state === "corners" ? "selected" : ""}"><strong>Corners only</strong>${profile(false)}<span class="option-caption">The legs meet only at the tabletop. Faster, fewer parts.</span></div><div class="option-panel rails"><strong>Add boards between the legs</strong>${profile(true)}<span class="option-caption">A side rail ties the legs together and resists sideways movement.</span></div></div>`;
    }

    function renderFacts(state) {
      const facts = state === "facts" ? [["100 cm","wall"],["uneven","floor"],["basic","tools"],["10 kg","load"]] : [["?","wall"],["?","floor"],["?","tools"],["?","load"]];
      return `<div class="fact-grid">${facts.map(([a,b]) => `<div class="fact"><strong>${a}</strong>${b}</div>`).join("")}</div>`;
    }

    function renderSchema(state) {
      const rows = state === "schema" ? [["Fit the wall","<= 100 cm"],["Working height","72 cm"],["Expected load","10 kg"],["Typing stability","required"]] : [["Vague promise","it should be good"],["Testable promise","fit + height + load + stability"]];
      return `<div class="schema-list">${rows.map(([a,b]) => `<div class="schema-row"><strong>${escapeHtml(a)}</strong><span class="status">${escapeHtml(b)}</span></div>`).join("")}</div>`;
    }

    function renderPlan(state) {
      const steps = state === "ordered" ? ["1 Measure","2 Mark","3 Cut","4 Attach","5 Place","6 Check"] : ["Cut","Check","Attach","Measure","Place","Mark"];
      return `<div class="timeline">${steps.map(step => `<div class="step">${escapeHtml(step)}</div>`).join("")}</div>`;
    }

    function renderChecks(state) {
      const rows = state === "partial-pass" ? [["Fit","pass"],["Height","pass"],["Load","pass"],["Stability","active"]] : [["Fit","waiting"],["Height","waiting"],["Load","waiting"],["Stability","waiting"]];
      return `<div class="check-list">${rows.map(([a,b]) => `<div class="check-row"><strong>${a}</strong><span class="status ${b}">${b}</span></div>`).join("")}</div>`;
    }

    function renderBoundary(state) {
      if (state === "hidden-work") return `<div class="fact-grid">${["joint shape","rail size","screw position","wood thickness"].map(x => `<div class="fact"><strong>${x}</strong>hidden inside three words</div>`).join("")}</div>`;
      return `<div class="flow"><div class="flow-node"><strong>The desk gives us</strong>height<br>attachment points<br>expected load</div><div class="flow-arrow">&#8594;</div><div class="flow-node"><strong>The assembly returns</strong>joined legs and rails<br>workbench checks<br>ready for the desk</div></div>`;
    }

    function renderDual(state) {
      const localActive = state === "local";
      const upperActive = state === "upper" || state === "earned";
      return `<div class="dual"><div class="check-surface"><strong>On the workbench</strong>dimensions ${localActive ? "pass" : "pass"}<br>joints pass<br>side resistance pass</div><div class="check-surface upper"><strong>Back in the desk</strong>${upperActive ? "fit pass<br>height pass<br>load pass<br>stability pass" : "the desk still needs a test"}</div></div>`;
    }

    function renderRecomposition(state) {
      return `<div class="flow recomposition-flow"><div class="flow-node"><strong>New assembly</strong>legs and rails pass on the workbench</div><div class="flow-arrow">&#8594;</div><div class="flow-node"><strong>Back in the desk</strong><div class="mini-table"></div>${state === "closed" ? "the desk checks pass" : "test the whole desk again"}</div></div>`;
    }

    function renderDashboard(state) {
      if (state === "assignment-panel") return `<div class="dashboard-grid single"><div class="dashboard"><div class="dashboard-head">Assignment summary</div><div class="dash-body"><div class="dash-card warn">Due next</div><div class="dash-card bad">Overdue</div><div class="dash-card">Returned for revision</div><div class="dash-card">Filter by class</div></div></div></div>`;
      const bad = state === "failed-task";
      return `<div class="dashboard-grid"><div class="dashboard"><div class="dashboard-head">Student analytics</div><div class="dash-body"><div class="dash-card">Activity chart</div><div class="dash-card">Four statistics</div><div class="dash-card ${bad ? "bad" : ""}">${bad ? "Cannot answer tomorrow's task" : "Recent activity"}</div></div></div><div class="dashboard"><div class="dashboard-head">Assignments</div><div class="dash-body"><div class="dash-card warn">Due dates</div><div class="dash-card ${bad ? "bad" : ""}">${bad ? "Overdue hidden" : "Class filter"}</div><div class="dash-card ${bad ? "bad" : ""}">${bad ? "Returned work mixed in" : "Status list"}</div></div></div></div>`;
    }

    function renderPath(state) {
      const labels = ["remember the promise","build a real thing","find the exact mismatch","repair or open a smaller job","test the smaller job","return it","test the whole again","stop when it is good enough"];
      return `<div class="path">${labels.map((label,index) => `<div class="path-node ${index === 5 ? "return" : index === 7 ? "stop" : ""}">${escapeHtml(label)}</div>`).join("")}</div>`;
    }

    function renderVisual(slide, state) {
      const key = slide.visual;
      const value = state.visual_state;
      if (key === "poll-table") return value === "poll" ? renderPoll() : renderTable(value);
      if (key === "table") return renderTable(value);
      if (key === "table-choice") return renderChoices(value);
      if (key === "constraint-board") return renderFacts(value);
      if (key === "schema-board") return renderSchema(value);
      if (key === "plan-line") return renderPlan(value);
      if (key === "check-board") return renderChecks(value);
      if (key === "layer-boundary") return renderBoundary(value);
      if (key === "dual-check") return renderDual(value);
      if (key === "recomposition") return renderRecomposition(value);
      if (key === "dashboard") return renderDashboard(value);
      if (key === "craft-path") return renderPath(value);
      return renderTable(value);
    }

    function render() {
      const root = document.getElementById("deck");
      root.innerHTML = deckData.slides.map((slide, slideIndex) => {
        const stateIndex = stateBySlide[slideIndex];
        const state = slide.states[stateIndex];
        const terminal = !state.transition_to;
        const dots = slide.states.map((_, index) => `<span class="state-dot ${index === stateIndex ? "active" : ""}"></span>`).join("");
        const list = state.visible.map(item => `<li>${escapeHtml(item)}</li>`).join("");
        const term = state.earned_term ? `<span class="term">${escapeHtml(state.earned_term)}</span>` : "";
        const revealLabel = escapeHtml(state.reveal_label || "Reveal");
        const visual = slideIndex === activeSlide ? renderVisual(slide,state) : "";
        return `<section class="slide ${slideIndex === activeSlide ? "active" : ""}" id="${escapeHtml(slide.id)}" data-index="${slideIndex}" aria-labelledby="title-${slideIndex}"><div class="slide-grid"><div class="scene ${terminal ? "terminal" : ""}" tabindex="0" role="group" aria-label="${escapeHtml(slide.title)}, state ${stateIndex + 1} of ${slide.states.length}" data-scene-index="${slideIndex}"><div class="scene-head"><div class="state-dots" aria-hidden="true">${dots}</div></div><div class="visual">${visual}</div><div class="scene-foot">${terminal ? "" : `<button class="reveal-button" type="button" data-reveal-index="${slideIndex}" title="${revealLabel}">${revealLabel} <span aria-hidden="true">&#8594;</span></button>`}</div></div><div class="narrative"><h1 id="title-${slideIndex}">${escapeHtml(slide.title)}</h1><p class="prompt">${escapeHtml(state.learner_prompt)}</p><ul class="visible-list">${list}</ul>${term}</div></div></section>`;
      }).join("");

      root.querySelectorAll("[data-reveal-index]").forEach(button => button.addEventListener("click", event => {
        event.stopPropagation();
        advanceState(Number(button.dataset.revealIndex));
      }));
      root.querySelectorAll("[data-scene-index]").forEach(scene => {
        scene.addEventListener("click", event => {
          if (event.target.closest("button")) return;
          advanceState(Number(scene.dataset.sceneIndex));
        });
        scene.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            event.stopPropagation();
            advanceState(Number(scene.dataset.sceneIndex));
          }
          if (event.key === "ArrowRight" || event.key === "PageDown") {
            event.preventDefault();
            event.stopPropagation();
            stepForward();
          }
          if (event.key === "ArrowLeft" || event.key === "PageUp") {
            event.preventDefault();
            event.stopPropagation();
            stepBack();
          }
        });
      });
      updateChrome();
    }

    function advanceState(index) {
      if (index !== activeSlide) return;
      const states = deckData.slides[index].states;
      if (stateBySlide[index] >= states.length - 1) return;
      stateBySlide[index] += 1;
      render();
      document.querySelector(`[data-scene-index="${index}"]`).focus({preventScroll:true});
    }

    function stepForward() {
      const states = deckData.slides[activeSlide].states;
      if (stateBySlide[activeSlide] < states.length - 1) advanceState(activeSlide);
      else goToSlide(activeSlide + 1);
    }

    function stepBack() {
      if (stateBySlide[activeSlide] > 0) {
        stateBySlide[activeSlide] -= 1;
        render();
      } else goToSlide(activeSlide - 1, true);
    }

    function goToSlide(index, useTerminal = false) {
      const next = Math.max(0, Math.min(deckData.slides.length - 1, index));
      if (next === activeSlide) return;
      activeSlide = next;
      stateBySlide[activeSlide] = useTerminal ? deckData.slides[activeSlide].states.length - 1 : 0;
      history.replaceState(null, "", `#${deckData.slides[activeSlide].id}`);
      render();
      window.scrollTo(0,0);
    }

    function updateChrome() {
      document.getElementById("counter").textContent = `${activeSlide + 1} / ${deckData.slides.length}`;
      const stateProgress = stateBySlide[activeSlide] / deckData.slides[activeSlide].states.length;
      const progress = ((activeSlide + stateProgress) / deckData.slides.length) * 100;
      document.getElementById("progress-bar").style.width = `${progress}%`;
      document.getElementById("prev-slide").disabled = activeSlide === 0 && stateBySlide[0] === 0;
      document.getElementById("next-slide").disabled = activeSlide === deckData.slides.length - 1 && stateBySlide[activeSlide] === deckData.slides[activeSlide].states.length - 1;
      document.getElementById("notes-copy").textContent = deckData.slides[activeSlide].notes;
    }

    function toggleNotes(force) {
      const overlay = document.getElementById("notes-overlay");
      const button = document.getElementById("notes-toggle");
      const open = typeof force === "boolean" ? force : !overlay.classList.contains("open");
      overlay.classList.toggle("open", open);
      button.setAttribute("aria-pressed", String(open));
      if (open) document.getElementById("notes-title").focus?.();
    }

    document.getElementById("prev-slide").addEventListener("click", stepBack);
    document.getElementById("next-slide").addEventListener("click", stepForward);
    document.getElementById("notes-toggle").addEventListener("click", () => toggleNotes());
    document.getElementById("notes-overlay").addEventListener("click", event => { if (event.target.id === "notes-overlay") toggleNotes(false); });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") { toggleNotes(false); return; }
      if (event.target.closest("button, [data-scene-index]")) return;
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") { event.preventDefault(); stepForward(); }
      if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); stepBack(); }
    });
    window.addEventListener("hashchange", () => {
      const index = deckData.slides.findIndex(slide => `#${slide.id}` === location.hash);
      if (index < 0 || index === activeSlide) return;
      activeSlide = index;
      stateBySlide[activeSlide] = 0;
      render();
      window.scrollTo(0,0);
    });

    const hashIndex = deckData.slides.findIndex(slide => `#${slide.id}` === location.hash);
    if (hashIndex >= 0) activeSlide = hashIndex;
    render();
  </script>
</body>
</html>
