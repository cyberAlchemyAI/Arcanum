fixture:
  id: whisper-idea-to-mvp
  source_rollout: 019e6556-940e-7501-ab97-8dc127a624a9
  source_folder: spells/whisper/development/refinement-runs/20260526T204134Z-language-ai-substack
  purpose: Show how Whisper's writing cores generalize into an Arcanum idea exploration grammar.

raw_idea:
  summary: Language and generative AI let people create personal symbolic tools through names, aliases, schemas, meta-schemas, and workflow capture.
  first_transport: substack_research_post
  next_transport_pressure: fundraising_copy
  mvp_proof: A reviewable Substack draft passes the opening, audience, resonance, structure, constraint, and citation-integrity checks.

idea_resonance:
  source_core: resonance_core
  question: What human energy, meaning, or relief should the idea create?
  selected_values:
    tone: wonder with operational seriousness
    emotional_residue: language feels newly available as a creative instrument
    value_signal: symbolic agency should not belong only to engineers, academics, or institutions
  avoid:
    - generic AI hype
    - language mysticism without concrete mechanics
    - software-engineer superiority
    - private jargon that excludes the reader

idea_relevance:
  source_core: relevance_core
  question: Who is this for, why does it matter here, and what objections must be respected?
  selected_values:
    target_public: AI-curious creative builders
    secondary_public: Arcanum research collaborators
    domain: generative AI, language, creative tooling, workflow design, symbolic systems
    authority_mode: research_group
  objections:
    - Is this just prompting?
    - Is language really code or only a metaphor?
    - Will personal symbolic systems become unreadable private jargon?
    - Can non-engineers create useful tools without technical syntax?

idea_trajectory:
  source_core: trajectory_core
  question: What movement should the user make from first encounter to evidence of value?
  selected_values:
    narrative_anchor: Arcanum as a live example of language becoming a tool-making medium
    introduction_strategy: reader-grounded tension before external authority
    ending_strategy: invitation to name one workflow
    proof_sequence:
      - reader_grounded_opening_hook
      - harari_shared_fiction_bridge
      - research_context_generative_ai_changes_who_can_operate_on_language
      - core_insight_language_becomes_executable_through_ai
      - arcanum_example_aliases_sigils_schemas
      - implications_for_personal_code
      - invitation_to_name_a_workflow

hard_gates:
  - id: opening_contract_compliance
    reason: The draft must not start with an external authority before the reader has a concrete handle.
  - id: citation_integrity
    reason: Harari/Sapiens can be paraphrased as a bridge, but direct quotation or page citation remains blocked until verified.
  - id: audience_legibility
    reason: Arcanum terms must be translated before they are used as examples.

generalization:
  idea_resonance: Use to protect the human promise of a tool or workflow.
  idea_relevance: Use to protect audience fit, context, constraints, and objections.
  idea_trajectory: Use to protect the path from first contact to validated value.
